document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n    --display:\"Geist\",'Söhne',-apple-system,\"Segoe UI\",sans-serif;\n    --mono:\"Geist Mono\",\"JetBrains Mono\",ui-monospace,SFMono-Regular,Menlo,monospace;\n    --shadow:0 1px 2px rgba(30,30,45,.04), 0 14px 34px -16px rgba(30,30,45,.13);\n    --shadow-lg:0 2px 6px rgba(30,30,45,.06), 0 34px 70px -28px rgba(30,30,45,.19);\n    --radius:16px;\n  }\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{\n    margin:0; background:var(--bg); color:var(--text);\n    font-family:var(--display);\n    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;\n    background-image:radial-gradient(70% 55% at 50% -12%, var(--accent-soft), transparent 72%);\n    background-repeat:no-repeat;\n  }\n  a{color:var(--accent); text-decoration:none;}\n  a:hover{text-decoration:underline;}\n  code,pre,.mono{font-family:var(--mono);}\n  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}\n  .eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; margin:0 0 14px;}\n  h2.sec{font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:0 0 18px;}\n\n  /* nav */\n  nav{position:sticky; top:0; z-index:50; backdrop-filter:saturate(140%) blur(12px);\n    background:color-mix(in srgb, var(--bg) 78%, transparent); border-bottom:1px solid transparent;}\n  nav.scrolled{border-bottom-color:var(--rule);}\n  .nav-in{display:flex; align-items:center; justify-content:space-between; height:62px;}\n  .brand{font-family:var(--display); display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.01em; font-size:16px; color:var(--text);}\n  .brand:hover{text-decoration:none;}\n  .logo{font-family:var(--mono); width:26px; height:26px; border-radius:7px; background:linear-gradient(140deg,var(--accent),var(--accent-2));\n    display:grid; place-items:center; color:#fff; font-size:13px; box-shadow:0 4px 12px -4px var(--accent);}\n  .nav-links{display:flex; align-items:center; gap:26px; font-size:14px;}\n  .nav-links a{color:var(--muted); font-weight:500;}\n  .nav-links a:hover{color:var(--text); text-decoration:none;}\n  .nav-cta{font-weight:600; padding:7px 14px; border-radius:8px; border:1px solid var(--rule); color:var(--text)!important;}\n  .nav-cta:hover{border-color:var(--accent); background:var(--accent-soft);}\n  @media(max-width:680px){.nav-links a:not(.nav-cta){display:none;}}\n\n  /* hero */\n  .hero{padding:80px 0 28px; text-align:center;}\n  .badge-pill{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600;\n    color:var(--muted); background:var(--card); border:1px solid var(--rule); border-radius:999px;\n    padding:6px 14px; margin-bottom:26px; box-shadow:var(--shadow);}\n  .badge-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}\n  h1{font-family:var(--display); font-size:clamp(34px,5.4vw,58px); font-weight:700; letter-spacing:-.03em; line-height:1.05; margin:0 auto 22px; max-width:14ch;}\n  h1 em{font-style:normal; color:var(--accent); position:relative; white-space:nowrap;}\n  h1 em::after{content:\"\"; position:absolute; left:0; right:0; bottom:.06em; height:.16em;\n    background:var(--note); opacity:.5; border-radius:2px;}\n  .sub{font-size:clamp(16px,2vw,19px); color:var(--muted); max-width:62ch; margin:0 auto 30px;}\n  .sub strong{color:var(--text); font-weight:600;}\n  .ctas{display:flex; flex-wrap:wrap; gap:12px; justify-content:center;}\n  .btn{font-size:15px; font-weight:600; border-radius:10px; padding:12px 22px; cursor:pointer;\n    border:1px solid var(--rule); background:var(--card); color:var(--text); display:inline-flex; align-items:center; gap:9px;\n    transition:transform .12s ease, box-shadow .12s ease, border-color .12s; box-shadow:var(--shadow);}\n  .btn:hover{transform:translateY(-1px); text-decoration:none;}\n  .btn.primary{background:linear-gradient(140deg,var(--accent),var(--accent-2)); color:#fff; border-color:transparent;\n    box-shadow:0 8px 22px -8px var(--accent);}\n  .btn.primary:hover{box-shadow:0 12px 28px -8px var(--accent);}\n  .btn svg{width:17px; height:17px;}\n\n  .trust{display:flex; flex-wrap:wrap; gap:10px 28px; justify-content:center; margin-top:36px; font-size:13.5px; color:var(--muted);}\n  .trust span{display:inline-flex; align-items:center; gap:8px; font-weight:500;}\n  .trust .tk{color:var(--accent);}\n\n  /* browser frame / demo */\n  .demo-wrap{padding:44px 0 12px;}\n  .frame{background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);\n    box-shadow:var(--shadow-lg); overflow:hidden; max-width:980px; margin:0 auto;}\n  .frame-bar{display:flex; align-items:center; gap:14px; padding:11px 16px; border-bottom:1px solid var(--rule); background:var(--bg-2);}\n  .dots{display:flex; gap:7px;}\n  .dots i{width:11px; height:11px; border-radius:50%; display:block;}\n  .dots i:nth-child(1){background:#f0625a;} .dots i:nth-child(2){background:#f5be4f;} .dots i:nth-child(3){background:#5dc466;}\n  .urlbar{flex:1; font-size:12.5px; color:var(--muted); background:var(--bg); border:1px solid var(--rule);\n    border-radius:7px; padding:5px 12px; text-align:center; max-width:380px; margin:0 auto;}\n  .frame img{display:block; width:100%; height:auto;}\n  .cap{text-align:center; font-size:13.5px; color:var(--muted); max-width:70ch; margin:18px auto 0;}\n  .cap strong{color:var(--text);} .cap .strike{text-decoration:line-through; text-decoration-color:var(--note);}\n\n  /* sections */\n  section.block{padding:64px 0;}\n  .lead{font-size:18px; max-width:64ch;} .lead strong{font-weight:600;}\n\n  /* review loop steps */\n  .loop{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:8px;}\n  @media(max-width:820px){.loop{grid-template-columns:repeat(2,1fr);}}\n  @media(max-width:480px){.loop{grid-template-columns:1fr;}}\n  .step{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:22px 20px; position:relative; box-shadow:var(--shadow);}\n  .step .n{width:30px; height:30px; border-radius:9px; background:var(--accent-soft); color:var(--accent);\n    font-weight:700; font-size:14px; display:grid; place-items:center; margin-bottom:14px;}\n  .step h3{font-family:var(--display); font-size:15.5px; margin:0 0 7px; letter-spacing:-.01em;}\n  .step p{font-size:13.5px; color:var(--muted); margin:0;}\n  .step code{font-size:12px; background:var(--accent-soft); color:var(--accent); padding:1px 5px; border-radius:5px;}\n  .step:not(:last-child)::after{content:\"→\"; position:absolute; right:-13px; top:50%; transform:translateY(-50%);\n    color:var(--rule); font-size:20px; z-index:2;}\n  @media(max-width:820px){.step::after{display:none!important;}}\n\n  /* feature pills */\n  .feature-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:8px;}\n  .feat{background:var(--card); border:1px solid var(--rule); border-radius:13px; padding:18px 18px; box-shadow:var(--shadow);\n    transition:border-color .15s, transform .15s;}\n  .feat:hover{border-color:var(--accent); transform:translateY(-2px);}\n  .feat .ic{font-size:18px; margin-bottom:10px; display:block;}\n  .feat b{font-family:var(--display); display:block; font-size:14.5px; margin-bottom:4px;}\n  .feat span{font-size:13px; color:var(--muted);}\n  .feat code{font-size:11.5px; background:var(--accent-soft); color:var(--accent); padding:1px 5px; border-radius:4px;}\n\n  /* code terminal */\n  .term{background:var(--code-bg); border:1px solid var(--rule); border-radius:14px; overflow:hidden; box-shadow:var(--shadow-lg);}\n  .term-bar{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--rule);}\n  .term-bar .dots i{width:10px;height:10px;}\n  .term-bar .ttl{font-size:12px; color:var(--code-c); margin-left:4px;}\n  .copy{margin-left:auto; background:#fff; border:1px solid var(--rule); color:var(--muted);\n    font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:6px; cursor:pointer; font-family:inherit;}\n  .copy:hover{color:var(--text); border-color:var(--accent);}\n  pre.code{margin:0; padding:20px; font-size:13px; line-height:1.75; color:var(--code-text); overflow-x:auto;}\n  pre.code .c{color:var(--code-c);} pre.code .out{color:var(--code-out);} pre.code .kw{color:var(--code-kw);} pre.code .s{color:#7C4DFF;}\n  .after{font-size:14px; color:var(--muted); margin-top:18px; max-width:66ch;}\n  .after code{font-size:12.5px; background:var(--accent-soft); color:var(--accent); padding:1px 6px; border-radius:5px;}\n\n  /* two col */\n  .cols{display:grid; grid-template-columns:1fr 1fr; gap:48px;}\n  @media(max-width:820px){.cols{grid-template-columns:1fr; gap:48px;}}\n\n  /* mcp tools */\n  .tools{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}\n  .tool{font-family:var(--mono); font-size:12.5px; background:var(--card); border:1px solid var(--rule);\n    border-radius:7px; padding:5px 11px; color:var(--text); display:inline-flex; align-items:center; gap:7px;}\n  .tool::before{content:\"\"; width:6px; height:6px; border-radius:50%; background:var(--accent);}\n  .tool.dim{color:var(--muted);} .tool.dim::before{background:var(--muted);}\n  .tgroup{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:18px 0 2px; width:100%;}\n\n  /* cta band */\n  .band{margin:24px 0 0; background:linear-gradient(140deg,var(--accent),var(--accent-2)); border-radius:20px;\n    padding:48px 40px; text-align:center; color:#fff; box-shadow:var(--shadow-lg);}\n  .band h2{font-family:var(--display); font-size:clamp(24px,3.4vw,34px); margin:0 0 10px; letter-spacing:-.02em; color:#fff;}\n  .band p{margin:0 auto 24px; max-width:50ch; opacity:.92; font-size:16px;}\n  .band .btn{background:#fff; color:var(--accent-2); border-color:#fff;}\n  .band .btn.ghost{background:rgba(255,255,255,.12); color:#fff; border-color:rgba(255,255,255,.4);}\n  .band code{background:rgba(0,0,0,.22); color:#fff; padding:2px 8px; border-radius:6px; font-size:14px;}\n\n  footer{border-top:1px solid var(--rule); margin-top:72px; padding:32px 0 56px;\n    display:flex; flex-wrap:wrap; gap:8px 22px; align-items:center; font-size:14px; color:var(--muted);}\n  footer a{font-weight:600;}\n  footer .sp{flex:1;}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<nav id=\"nav\">\n  <div class=\"wrap nav-in\">\n    <a class=\"brand\" href=\"#top\"><span class=\"logo\">md<\u002Fspan> mdreview<\u002Fa>\n    <div class=\"nav-links\">\n      <a href=\"#loop\">Review loop<\u002Fa>\n      <a href=\"#contract\">API<\u002Fa>\n      <a href=\"#mcp\">MCP<\u002Fa>\n      <a class=\"nav-cta\" href=\"https://github.com/waqaskhan137/mdreview-service\">GitHub ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<div id=\"top\"><\u002Fdiv>\n<header class=\"hero wrap\">\n  <span class=\"badge-pill\"><span class=\"dot\"><\u002Fspan> Containerized · stdlib Python · 18 MCP tools<\u002Fspan>\n  <h1>Your agent writes the draft.<br>A human <em>reviews<\u002Fem> it.<\u002Fh1>\n  <p class=\"sub\">A containerized markdown review microservice: an agent <strong>POSTs markdown<\u002Fstrong>, hands a human the returned URL, and the human marks it up in the browser — highlighting text into <strong>threaded comments<\u002Fstrong>. The agent reads them over HTTP or MCP, replies, <strong>resolves<\u002Fstrong>, and pushes revisions. Math, diagrams, and code <strong>render as they'll publish<\u002Fstrong>.<\u002Fp>\n  <div class=\"ctas\">\n    <a class=\"btn primary\" href=\"https://github.com/waqaskhan137/mdreview-service\">\n      <svg viewBox=\"0 0 16 16\" fill=\"currentColor\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg>\n      View on GitHub\n    <\u002Fa>\n    <a class=\"btn\" href=\"#run\">⌘ Run it locally<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"trust\">\n    <span><span class=\"tk\">✓<\u002Fspan> No shared files, no process juggling<\u002Fspan>\n    <span><span class=\"tk\">✓<\u002Fspan> Many concurrent reviews, isolated by id<\u002Fspan>\n    <span><span class=\"tk\">✓<\u002Fspan> No base64 through the model's context<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"demo-wrap wrap\">\n  <figure style=\"margin:0;\">\n    <div class=\"frame\">\n      <div class=\"frame-bar\">\n        <span class=\"dots\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan>\n        <span class=\"urlbar\">mdreview.local/r/8f3a — mid-review<\u002Fspan>\n      <\u002Fdiv>\n      <img src=\"263ee2cb-7d2d-402a-8d6d-5930865dcc1e\" alt=\"The mdreview viewer mid-review: a markdown draft rendered with a Mermaid decision-flow diagram, a KaTeX equation, and syntax-highlighted code, plus a reviewer's highlighted phrase opening a margin comment thread and a Resolved panel toggle.\">\n    <\u002Fdiv>\n    <figcaption class=\"cap\">A human highlights text → a <strong>comment thread<\u002Fstrong>; the agent reads it over MCP, replies, and <strong>resolves<\u002Fstrong> it. Math, Mermaid diagrams, and code render inline — the draft reviews as it ships.<\u002Ffigcaption>\n  <\u002Ffigure>\n<\u002Fdiv>\n\n<section class=\"block wrap\" id=\"loop\">\n  <p class=\"eyebrow\">The review loop<\u002Fp>\n  <h2 class=\"sec\" style=\"font-size:24px;text-transform:none;letter-spacing:-.01em;color:var(--text);margin-bottom:28px;font-family:var(--display);\">Four moves, one round trip<\u002Fh2>\n  <div class=\"loop\">\n    <div class=\"step\">\n      <span class=\"n\">1<\u002Fspan><h3>Agent submits<\u002Fh3>\n      <p>POST markdown to <code>/api/reviews<\u002Fcode> → get back a <code>review_url<\u002Fcode>.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"step\">\n      <span class=\"n\">2<\u002Fspan><h3>Human annotates<\u002Fh3>\n      <p>Open the URL, highlight text, leave <strong style=\"color:var(--text)\">threaded comments<\u002Fstrong> in the margin.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"step\">\n      <span class=\"n\">3<\u002Fspan><h3>Agent reads<\u002Fh3>\n      <p>Pull open comments, <code>reply<\u002Fcode> to discuss or <code>resolve<\u002Fcode> once addressed.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"step\">\n      <span class=\"n\">4<\u002Fspan><h3>Push revision<\u002Fh3>\n      <p>PUT the tightened source — the human's page <strong style=\"color:var(--text)\">live-reloads<\u002Fstrong>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"block wrap\" id=\"render\">\n  <p class=\"eyebrow\">Renders like it'll publish<\u002Fp>\n  <p class=\"lead\">The viewer renders the draft the way a Jekyll / MathJax site does — so a math- or diagram-heavy draft reviews <strong>exactly as it ships<\u002Fstrong>, not as raw markup. The MCP tools tell the agent to author <em>to<\u002Fem> this: a flow as a Mermaid diagram, not ASCII art.<\u002Fp>\n  <div class=\"feature-grid\">\n    <div class=\"feat\"><span class=\"ic\">∑<\u002Fspan><b>LaTeX math<\u002Fb><span>Inline &amp; block — <code>$…$<\u002Fcode> / <code>$$…$$<\u002Fcode><\u002Fspan><\u002Fdiv>\n    <div class=\"feat\"><span class=\"ic\">⬡<\u002Fspan><b>Mermaid diagrams<\u002Fb><span>Flows &amp; trees — <code>```mermaid<\u002Fcode><\u002Fspan><\u002Fdiv>\n    <div class=\"feat\"><span class=\"ic\">⌗<\u002Fspan><b>Syntax-highlighted code<\u002Fb><span>Fenced blocks render as they publish<\u002Fspan><\u002Fdiv>\n    <div class=\"feat\"><span class=\"ic\">¹<\u002Fspan><b>GFM footnotes<\u002Fb><span>Full GitHub-flavored markdown<\u002Fspan><\u002Fdiv>\n    <div class=\"feat\"><span class=\"ic\">🖼<\u002Fspan><b>Images survive revisions<\u002Fb><span>Attach once — kept across every push<\u002Fspan><\u002Fdiv>\n    <div class=\"feat\"><span class=\"ic\">↺<\u002Fspan><b>History rounds<\u002Fb><span>Every revision is snapshotted &amp; recoverable<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"block wrap\" id=\"contract\">\n  <p class=\"eyebrow\">The whole contract is four calls<\u002Fp>\n  <div class=\"term\">\n    <div class=\"term-bar\">\n      <span class=\"dots\"><i style=\"background:#f0625a\"><\u002Fi><i style=\"background:#f5be4f\"><\u002Fi><i style=\"background:#5dc466\"><\u002Fi><\u002Fspan>\n      <span class=\"ttl\">bash — the entire API surface<\u002Fspan>\n      <button class=\"copy\" onclick=\"copyTerm(this)\">Copy<\u002Fbutton>\n    <\u002Fdiv>\n<pre class=\"code\" id=\"contract-code\"><span class=\"c\"># 1 — submit a draft<\u002Fspan>\ncurl -X POST <span class=\"kw\">$BASE<\u002Fspan>/api/reviews -d <span class=\"s\">'{\"title\":\"My draft\",\"markdown\":\"# My draft\\n...\"}'<\u002Fspan>\n<span class=\"out\">     → {\"id\":\"…\",\"review_url\":\"…\",\"feedback_url\":\"…\"}<\u002Fspan>\n\n<span class=\"c\"># 2 — hand review_url to a human; they annotate in the browser<\u002Fspan>\n\n<span class=\"c\"># 3 — read the threaded comments the human raised<\u002Fspan>\ncurl <span class=\"kw\">$BASE<\u002Fspan>/api/reviews/<span class=\"kw\">$id<\u002Fspan>/comments?status=open\n<span class=\"out\">     → reply to discuss, or resolve once you've addressed it<\u002Fspan>\n\n<span class=\"c\"># 4 — apply the edits, push the revision (their page live-reloads)<\u002Fspan>\ncurl -X PUT <span class=\"kw\">$BASE<\u002Fspan>/api/reviews/<span class=\"kw\">$id<\u002Fspan>/source -d <span class=\"s\">'{\"markdown\":\"# My draft\\n...tightened...\"}'<\u002Fspan><\u002Fpre>\n  <\u002Fdiv>\n  <p class=\"after\">Comments carry an <code>open → resolved → reopened<\u002Fcode> state machine the service enforces; every revision snapshots a history round, so earlier drafts and their feedback stay recoverable. Full API table in the <a href=\"https://github.com/waqaskhan137/mdreview-service#api\">README<\u002Fa>.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"block wrap\">\n  <div class=\"cols\">\n    <div id=\"run\">\n      <p class=\"eyebrow\">Run it<\u002Fp>\n      <div class=\"term\">\n        <div class=\"term-bar\">\n          <span class=\"dots\"><i style=\"background:#f0625a\"><\u002Fi><i style=\"background:#f5be4f\"><\u002Fi><i style=\"background:#5dc466\"><\u002Fi><\u002Fspan>\n          <span class=\"ttl\">bash<\u002Fspan>\n          <button class=\"copy\" onclick=\"copyTerm(this)\">Copy<\u002Fbutton>\n        <\u002Fdiv>\n<pre class=\"code\">docker compose up -d --build\n<span class=\"c\"># → http://localhost:8137<\u002Fspan><\u002Fpre>\n      <\u002Fdiv>\n      <p class=\"after\">Stdlib Python only — <strong style=\"color:var(--text)\">no pip installs<\u002Fstrong>, tiny image, renderers vendored. Config and variants in the <a href=\"https://github.com/waqaskhan137/mdreview-service#run\">README<\u002Fa>.<\u002Fp>\n    <\u002Fdiv>\n    <div id=\"mcp\">\n      <p class=\"eyebrow\">Speaks MCP — 18 tools<\u002Fp>\n      <p style=\"font-size:15px;margin:0;color:var(--muted);\">A thin, stdlib-only stdio MCP server (JSON-RPC 2.0) ships in the repo as <strong style=\"color:var(--text)\">18 first-class tools<\u002Fstrong>, so an MCP agent plugs in and self-serves — no hand-rolled HTTP. Wraps the running service and adds no state.<\u002Fp>\n      <div class=\"tools\">\n        <span class=\"tgroup\">Review loop<\u002Fspan>\n        <span class=\"tool\">create_review<\u002Fspan><span class=\"tool\">get_source<\u002Fspan><span class=\"tool\">update_source<\u002Fspan>\n        <span class=\"tgroup\">Comment workflow<\u002Fspan>\n        <span class=\"tool\">list<\u002Fspan><span class=\"tool\">reply<\u002Fspan><span class=\"tool\">resolve<\u002Fspan><span class=\"tool\">author<\u002Fspan><span class=\"tool\">delete<\u002Fspan>\n        <span class=\"tgroup\">Utility<\u002Fspan>\n        <span class=\"tool\">attach_image<\u002Fspan><span class=\"tool\">server_info<\u002Fspan>\n        <span class=\"tool dim\">+ 7 more<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"after\" style=\"margin-top:16px;\">Image attach <strong style=\"color:var(--text)\">by path<\u002Fstrong> — no base64 through the model's context. Tools &amp; client config in the <a href=\"https://github.com/waqaskhan137/mdreview-service#mcp-server-optional\">README<\u002Fa>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"block wrap\">\n  <div class=\"band\">\n    <h2>Hand your agent a reviewer.<\u002Fh2>\n    <p>One container, one URL, any number of concurrent reviews — each isolated by id.<\u002Fp>\n    <div class=\"ctas\">\n      <a class=\"btn\" href=\"https://github.com/waqaskhan137/mdreview-service\">View on GitHub<\u002Fa>\n      <a class=\"btn ghost\" href=\"#run\"><code>docker compose up -d<\u002Fcode><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer class=\"wrap\">\n  <a href=\"https://github.com/waqaskhan137/mdreview-service\">github.com/waqaskhan137/mdreview-service<\u002Fa>\n  <span class=\"sp\"><\u002Fspan>\n  <span>canonical: <a href=\"https://mdreview.waqasrana.space/\">mdreview.waqasrana.space<\u002Fa><\u002Fspan>\n  <span>built by waqas<\u002Fspan>\n  <span><a href=\"https://github.com/waqaskhan137/mdreview-service/blob/main/LICENSE\">Apache 2.0<\u002Fa><\u002Fspan>\n<\u002Ffooter>\n\n<script>\n  const nav=document.getElementById('nav');\n  addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>8));\n  function copyTerm(btn){\n    const pre=btn.closest('.term').querySelector('pre');\n    const txt=pre.innerText;\n    navigator.clipboard.writeText(txt).then(()=>{\n      const old=btn.textContent; btn.textContent='Copied ✓';\n      setTimeout(()=>btn.textContent=old,1400);\n    });\n  }\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
