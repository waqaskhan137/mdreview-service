<svg width="680" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>mdreview promo</title>
<desc>Hook: AI code is fast but broken, pile falls. Why: thinking was the real work. Punch: mdreview adds plan and review, castle rises, CTA.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:system-ui,sans-serif}
.th{font-size:15px;font-weight:600;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.pill{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.8}
.pilltxt{fill:#3C3489;font-size:14px;font-weight:500}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.stone{fill:#9a9890;stroke:#5F5E5A;stroke-width:0.8}
@keyframes c1{0%{opacity:0}2%,24%{opacity:1}27%,100%{opacity:0}}
@keyframes c2{0%,29%{opacity:0}31%,50%{opacity:1}53%,100%{opacity:0}}
@keyframes c3{0%,55%{opacity:0}57%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes p1{0%,1%{opacity:0}3%,24%{opacity:1}27%,29%{opacity:0}32%,50%{opacity:1}53%,55%{opacity:0}58%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes p2{0%,1%{opacity:0}3%,24%{opacity:1}27%,32%{opacity:0}35%,50%{opacity:1}53%,55%{opacity:0}58%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes p3{0%,1%{opacity:0}3%,24%{opacity:1}27%,35%{opacity:0}38%,50%{opacity:1}53%,55%{opacity:0}58%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes kx{0%,3%{opacity:0}5%,24%{opacity:1}27%,100%{opacity:0}}
@keyframes rb{0%,1%{opacity:0}3%,24%{opacity:1}27%,60%{opacity:0}62%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes yb{0%,38%{opacity:0}40%,50%{opacity:1}53%,100%{opacity:0}}
@keyframes ar{0%,3%{opacity:0}5%,24%{opacity:1}27%,40%{opacity:0}42%,50%{opacity:1}53%,62%{opacity:0}64%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes kp{0%,4%{opacity:0}6%,24%{opacity:1}27%,100%{opacity:0}}
@keyframes tip{0%,10%{transform:rotate(0deg)}16%,24%{transform:rotate(24deg)}27%,100%{transform:rotate(0deg)}}
@keyframes tw{0%,41%{opacity:0}43%,50%{opacity:1}53%,63%{opacity:0}65%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes wl{0%,44%{opacity:0}46%,50%{opacity:1}53%,63%{opacity:0}65%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes fl{0%,47%{opacity:0}49%,50%{opacity:1}53%,63%{opacity:0}65%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes rl{0%,59%{opacity:0}61%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes cta{0%,68%{opacity:0}71%,94%{opacity:1}98%,100%{opacity:0}}
.c1{animation:c1 22s infinite}.c2{animation:c2 22s infinite}.c3{animation:c3 22s infinite}
.p1{animation:p1 22s infinite}.p2{animation:p2 22s infinite}.p3{animation:p3 22s infinite}
.kx{animation:kx 22s infinite}.rb{animation:rb 22s infinite}.yb{animation:yb 22s infinite}
.ar{animation:ar 22s infinite}.kp{animation:kp 22s infinite}
.tw{animation:tw 22s infinite}.wl{animation:wl 22s infinite}.fl{animation:fl 22s infinite}
.rl{animation:rl 22s infinite}.cta{animation:cta 22s infinite}
.tipg{animation:tip 22s infinite;transform-origin:577px 178px}
</style>

<text class="th c1" x="340" y="46" text-anchor="middle">AI writes code fast. Why is it still broken?</text>
<text class="th c2" x="340" y="46" text-anchor="middle">Coding was never the work. Thinking was.</text>
<text class="th c3" x="340" y="46" text-anchor="middle">mdreview: your agent asks you before it ships</text>

<g class="p1"><rect class="pill" x="40" y="95" width="130" height="36" rx="8"/>
  <text class="pilltxt" x="105" y="118" text-anchor="middle">dream the castle</text></g>
<g class="p2"><rect class="pill" x="40" y="140" width="130" height="36" rx="8"/>
  <text class="pilltxt" x="105" y="163" text-anchor="middle">plan the pieces</text></g>
<g class="p3"><rect class="pill" x="40" y="185" width="130" height="36" rx="8"/>
  <text class="pilltxt" x="105" y="208" text-anchor="middle">check it works</text></g>

<g class="kx">
<line x1="45" y1="92" x2="165" y2="224" stroke="#E24B4A" stroke-width="3" stroke-linecap="round"/>
<line x1="165" y1="92" x2="45" y2="224" stroke="#E24B4A" stroke-width="3" stroke-linecap="round"/>
<text class="ts" x="105" y="244" text-anchor="middle" fill="#E24B4A">skipped</text>
</g>

<g class="rl">
<rect x="30" y="85" width="150" height="146" rx="10" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="th" x="105" y="252" text-anchor="middle" fill="#0F6E56" font-size="14">mdreview</text>
<text class="ts" x="105" y="270" text-anchor="middle" fill="#0F6E56">plan + review before execution</text>
</g>

<g class="yb"><rect x="230" y="112" width="130" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text class="pilltxt" x="295" y="138" text-anchor="middle" fill="#0C447C">you stack</text>
  <text class="ts" x="295" y="158" text-anchor="middle" fill="#185FA5">slow, takes days</text></g>
<g class="rb"><rect x="230" y="112" width="130" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text class="pilltxt" x="295" y="138" text-anchor="middle" fill="#444441">robot stacks</text>
  <text class="ts" x="295" y="158" text-anchor="middle" fill="#5F5E5A">instant, free</text></g>

<g class="ar">
<line class="arr" x1="178" y1="142" x2="222" y2="142" marker-end="url(#arrow)"/>
<line class="arr" x1="368" y1="142" x2="455" y2="142" marker-end="url(#arrow)"/>
</g>

<g class="kp" transform="translate(0,-55)">
<rect class="stone" x="505" y="262" width="42" height="20" transform="rotate(-8 526 272)"/>
<rect class="stone" x="552" y="266" width="46" height="18" transform="rotate(5 575 275)"/>
<rect class="stone" x="528" y="238" width="38" height="20" transform="rotate(12 547 248)"/>
<rect class="stone" x="582" y="242" width="30" height="22" transform="rotate(-15 597 253)"/>
<polygon points="602,282 634,282 618,262" transform="rotate(38 618 272)" fill="#D85A30" stroke="#993C1D" stroke-width="0.8"/>
<g class="tipg"><rect class="stone" x="558" y="215" width="38" height="18"/></g>
<line x1="480" y1="290" x2="655" y2="290" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="565" y="312" text-anchor="middle">fast, and falling over</text>
</g>

<g transform="translate(0,45)">
<g class="tw">
<rect class="stone" x="480" y="70" width="28" height="80"/>
<rect class="stone" x="612" y="70" width="28" height="80"/>
<polygon points="476,72 512,72 494,48" fill="#D85A30" stroke="#993C1D" stroke-width="0.8"/>
<polygon points="608,72 644,72 626,48" fill="#D85A30" stroke="#993C1D" stroke-width="0.8"/>
</g>
<g class="wl">
<rect class="stone" x="508" y="100" width="104" height="50"/>
<rect class="stone" x="512" y="90" width="14" height="10"/>
<rect class="stone" x="540" y="90" width="14" height="10"/>
<rect class="stone" x="568" y="90" width="14" height="10"/>
<rect class="stone" x="596" y="90" width="14" height="10"/>
<path d="M548 150 v-22 a12 12 0 0 1 24 0 v22 z" fill="#444441"/>
<line x1="470" y1="150" x2="655" y2="150" stroke="#5F5E5A" stroke-width="1"/>
</g>
<g class="fl">
<line x1="560" y1="90" x2="560" y2="58" stroke="#5F5E5A" stroke-width="1.5"/>
<polygon points="560,58 586,65 560,72" fill="#1D9E75"/>
<text class="ts" x="560" y="172" text-anchor="middle">shipped, and standing</text>
</g>
</g>

<g class="cta">
<rect x="240" y="262" width="200" height="30" rx="15" fill="#0F6E56"/>
<text x="340" y="282" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600" font-family="system-ui,sans-serif">try mdreview on GitHub</text>
</g>
</svg>
