<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A public document (#101) is "anyone with the link", NOT search-indexed: noindex the viewer.
     Belt-and-suspenders with the X-Robots-Tag header the server sends on this route. Harmless for
     private docs (only ever served to their owner; a crawler can only reach a public one). -->
<meta name="robots" content="noindex, nofollow">
<title>mdreview</title>
<link rel="stylesheet" href="/static/katex.min.css">
<link rel="stylesheet" href="/static/hljs-github.css">
<style>
  /* Light palette = the new mockup (violet baton/comments, blue headings/links); dark derived via
     the existing token swap (mockup is light-only). --accent is the violet primary used by the
     baton + comment threads; --blue is section headings + links; --noteline = the comment margin
     bar (violet, was amber). */
  :root{--bg:#fafafc;--panel:#fff;--text:#181a20;--muted:#5c6270;--muted2:#6e727e;--rule:#e6e7ee;--accent:#5b30d6;--accent-bg:#eee9fd;--blue:#1d4fbf;--blue-bg:#e9f0fd;--noteline:#5b30d6;--link:#2f6fed;
    --baton-ico:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>');}
  @media (prefers-color-scheme: dark){:root{--bg:#0f1014;--panel:#17181d;--text:#e9eaf0;--muted:#9a9fb0;--muted2:#878c9c;--rule:#26282f;--accent:#b9a3f5;--accent-bg:#2a2147;--blue:#9cc0f5;--blue-bg:#16243f;--noteline:#b9a3f5;--link:#7ba6f5;}}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Charter,Georgia,Cambria,"Times New Roman",serif;font-size:20px;line-height:1.7;}
  .wrap{max-width:720px;margin:0 auto;padding:40px 24px 160px 64px;}
  /* full-width sticky top bar (mockup): ← Reviews + filename (left), vN · turn-state (right) */
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 26px;border-bottom:1px solid var(--rule);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;}
  .topbar .tb-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .topbar .home{color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;}
  .topbar .home:hover{color:var(--text);}
  .topbar .tb-sep{color:var(--rule);}
  .filename{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tb-right{font-size:12px;color:var(--muted);letter-spacing:.03em;white-space:nowrap;font-variant:small-caps;}
  /* breadcrumb above the title: project / session / source_path (present segments only) */
  .breadcrumb{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12.5px;color:var(--muted2);margin:0 0 14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .breadcrumb .sep{color:var(--rule);}
  .breadcrumb:empty{display:none;}
  /* rendered markdown */
  #article h1{font-size:38px;line-height:1.15;letter-spacing:-.02em;margin:.2em 0 .3em;font-weight:700;}
  #article h2{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);margin:0;font-weight:700;}
  #article h3{font-size:22px;margin:0;font-weight:600;}
  #article p{margin:0;}
  #article ul,#article ol{margin:0;padding-left:1.4em;}
  #article li{margin:.2em 0;}
  #article blockquote{margin:0;padding-left:1em;border-left:3px solid var(--accent);color:var(--muted);font-style:italic;}
  #article pre{background:rgba(127,127,127,.1);padding:14px;border-radius:8px;overflow:auto;font-size:14px;}
  #article code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em;}
  #article a{color:var(--blue);}
  #article table{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px;line-height:1.45;display:block;overflow-x:auto;}
  #article th,#article td{border:1px solid var(--rule);padding:6px 10px;text-align:left;vertical-align:top;}
  #article th{background:rgba(127,127,127,.1);font-weight:600;}
  #article tr:nth-child(even) td{background:rgba(127,127,127,.04);}
  /* Images get a near-white "paper" mat so a light-authored figure stays legible on a dark pane
     instead of smearing into it (theme-awareness / MR-027). Keep this IMAGE-ONLY — never widen to
     #article > *: mermaid (.mermaid svg, inline, JS-themed) and KaTeX (.katex spans) theme
     themselves and a mat would fight them; an <img> is an opaque box we can't introspect, and the
     pane's color-scheme can't reach an <img>-loaded SVG. .histdoc img covers the history-modal
     drafts. Supported direction: light-authored figures; a dark/transparent figure on the mat is a
     known non-goal (it can go invisible) — see epics/theme-awareness-plan.md. */
  #article img, .histdoc img{max-width:100%;background:#fafaf9;padding:8px;border-radius:8px;}
  #article img{cursor:zoom-in;}
  #lightbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);align-items:center;justify-content:center;cursor:zoom-out;padding:16px;}
  #lightbox img{max-width:96vw;max-height:96vh;background:#fff;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.5);}
  /* GFM footnotes: marked-footnote appends a footnotes section at the end of the article, led by a
     screen-reader-only heading. The viewer has no .sr-only rule otherwise, so without the clip rule
     below that heading renders as a full-size accent banner. */
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;padding:0;margin:-1px;}
  #article .footnotes{margin-top:32px;border-top:1px solid var(--rule);padding-top:6px;font-size:15px;color:var(--muted);}
  #article .footnotes ol{padding-left:1.2em;}
  #article sup a,#article .footnotes a{color:var(--blue);text-decoration:none;}
  #article hr{border:none;border-top:1px solid var(--rule);margin:8px 0;}
  #doctitle{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:34px;line-height:1.15;letter-spacing:-.5px;margin:4px 0 8px;font-weight:700;}
  #doctitle:empty{display:none;}
  #docmeta{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;color:var(--muted2);margin:0 0 24px;}
  #article .mermaid{margin:10px 0;text-align:center;}
  #article .mermaid svg{max-width:100%;height:auto;}
  /* block wrapper + margin number */
  .blk{position:relative;padding:6px 0;margin:16px 0;border-radius:6px;transition:background .15s;}
  .blk:hover{background:rgba(127,127,127,.06);}
  .blk .num{position:absolute;left:-46px;top:9px;width:32px;text-align:right;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:11.5px;color:var(--muted2);cursor:pointer;user-select:none;opacity:.5;font-variant-numeric:tabular-nums;}
  .blk .num:hover{opacity:1;color:var(--accent);}
  .blk.has-note{box-shadow:inset 3px 0 0 var(--noteline);background:rgba(91,48,214,.06);}
  .blk.has-note .num::after{content:" \25CF";color:var(--noteline);}
  @media (max-width:820px){.blk .num{left:-30px;width:22px;font-size:11px;}.wrap{padding-left:40px;}}
  #addbtn{position:absolute;z-index:50;display:none;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-family:-apple-system,sans-serif;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);}
  /* Issue #44: composer floats beside the article (positionPop), where the gutter cards live. width
     284px (was 330) = the .gcard width, so it fits inside the wide gate's envelope — left is rect.right+24
     and the gate needs innerWidth >= rect.right+320, so 24+284=308 < 320 — instead of overflowing the edge. */
  #pop{position:fixed;z-index:60;display:none;width:284px;background:var(--bg);border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.3);padding:14px;}
  /* narrow fallback: dock (mirrors #gutter.docked); auto!important beats the wide branch's inline left/top.
     .top docks upper-right instead, chosen opposite the anchor so the composer never covers it (issue #44 AC3). */
  #pop.docked{right:18px;bottom:70px;top:auto!important;left:auto!important;width:360px;}
  #pop.docked.top{top:18px!important;bottom:auto;}
  #pop .q{font-size:13px;color:var(--muted);font-style:italic;margin:0 0 8px;max-height:64px;overflow:auto;font-family:-apple-system,sans-serif;}
  #pop textarea{width:100%;min-height:74px;font-family:-apple-system,sans-serif;font-size:14px;border:1px solid var(--rule);border-radius:6px;padding:8px;background:var(--bg);color:var(--text);resize:vertical;}
  #pop .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;}
  .btn{font-family:-apple-system,sans-serif;font-size:13px;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--rule);background:var(--panel);color:var(--text);}
  .btn:hover{border-color:var(--muted2);}
  .btn.primary{background:var(--link);color:#fff;border-color:var(--link);}
  .btn.primary:hover{filter:brightness(1.06);border-color:var(--link);}
  /* baton action column (mockup: Send to agent on the right of the violet banner) */
  .turnactions{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch;}
  #sendbtn:not([disabled])::after{content:" \2192";}
  #dock{position:fixed;right:18px;bottom:18px;z-index:55;font-family:-apple-system,sans-serif;}
  #dockbar{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--rule);border-radius:30px;padding:8px 12px;box-shadow:0 4px 18px rgba(0,0,0,.2);}
  #count{font-size:13px;color:var(--muted);}
  /* MR-052: turn baton — Send button, status banner, reclaim control */
  .btn.sendagent[disabled]{opacity:.5;cursor:default;}
  /* baton banner — the mockup's violet "Your turn" treatment (left accent bar + icon), hosting the
     Send button on the right. renderBanner toggles loading/warn/steps; only CSS changed here. */
  .turnbanner{display:none;align-items:center;gap:13px;margin:0 0 24px;padding:14px 16px;border:1px solid var(--accent-bg);border-left:3px solid var(--accent);border-radius:11px;background:var(--accent-bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;color:var(--text);}
  .turnbanner::before{content:"";flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--accent) var(--baton-ico) center/15px no-repeat;}
  .turnbanner.warn::before,.turnbanner.loading::before{display:none;}
  .turnbanner.show{display:flex;}
  #turnbody{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;}
  .turnhead{display:flex;align-items:baseline;gap:10px;}
  #turntext{font-weight:600;}
  .turnhead #turntext{flex:1;}
  #turntimer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap;}
  .turnbanner .reclaim{font-size:12px;padding:4px 11px;white-space:nowrap;}
  /* MR-073 (issue #27): derived live progress timeline. Shown only while the agent is working
     (#turnbanner.working); steps come purely from the /status epoch timestamps (no new data). */
  #turnsteps{display:none;margin:0;padding:0;list-style:none;font-size:12px;color:var(--muted);}
  #turnbanner.steps #turnsteps{display:flex;flex-direction:column;gap:3px;}
  #turnsteps li{display:flex;align-items:center;gap:7px;}
  #turnsteps li::before{content:"\25CB";color:var(--muted);width:1em;text-align:center;font-size:10px;}   /* ○ pending */
  #turnsteps li.done{color:var(--text);}
  #turnsteps li.done::before{content:"\25CF";color:var(--accent);}                                          /* ● reached */
  #turnsteps li.active{color:var(--text);}
  #turnsteps li.active::before{content:"";display:inline-block;width:9px;height:9px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:turnspin .8s linear infinite;}
  @media (prefers-reduced-motion:reduce){#turnsteps li.active::before{animation:none;border-top-color:var(--muted);opacity:.6;}}
  /* MR-062 (issue #27, supersedes MR-061): a clear loading SPINNER on the agent-turn *waiting* states — both
     "Sent — waiting for pickup" AND "Agent is working" (NOT the stale "may have stopped"). renderBanner
     adds the .loading class in those two arms. Pure CSS rotating ring; reduced-motion shows a static ring. */
  #turnbanner.loading #turntext::before{content:"";display:inline-block;width:11px;height:11px;margin-right:9px;vertical-align:-1px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:turnspin .8s linear infinite;}
  @keyframes turnspin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){#turnbanner.loading #turntext::before{animation:none;border-top-color:var(--muted);opacity:.6;}}
  /* MR-066 (issue #26): a NON-spinning warning treatment for "nothing is coming, act" states — the
     pickup-timeout cue (no agent claimed within the grace window) and, reused by MR-068, the crashed-run
     signal. No animation, so reduced-motion-safe by construction. Defined here; MR-068 reuses it. */
  #turnbanner.warn{border-color:var(--noteline);border-left:3px solid var(--noteline);background:rgba(212,160,23,.10);}
  #toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:90;background:var(--accent);color:#fff;font-family:-apple-system,sans-serif;font-size:13px;padding:8px 16px;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none;}
  /* MR-006/MR-036: Google-Docs style margin comments (threaded) */
  #gutter{position:absolute;top:0;width:284px;z-index:5;display:none;}
  body.gutter-on #cmtbtn{display:none;}
  .gcard{position:absolute;width:284px;background:var(--bg);border:1px solid var(--rule);border-left:3px solid var(--noteline);border-radius:8px;padding:10px 28px 10px 12px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;line-height:1.4;box-shadow:0 1px 6px rgba(0,0,0,.06);transition:top .18s ease,box-shadow .15s,border-color .15s;cursor:pointer;}
  .gcard:hover,.gcard.active{box-shadow:0 5px 18px rgba(0,0,0,.18);border-left-color:var(--accent);}
  .gcard .gref{color:var(--accent);font-weight:700;}
  .gcard .gq{color:var(--muted);font-style:italic;display:block;margin:2px 0 5px;font-size:12px;max-height:48px;overflow:hidden;}
  .gcard .gnote{color:var(--text);}
  .gcard .gx{position:absolute;top:5px;right:8px;border:none;background:none;color:var(--muted);font-size:16px;cursor:pointer;line-height:1;}
  .gcard.addressed{opacity:.55;border-left-color:var(--muted);}
  .gcard.addressed .gnote{text-decoration:line-through;}
  mark.cmt{background:rgba(91,48,214,.18);color:inherit;border-radius:2px;padding:.5px 0;cursor:pointer;transition:background .15s;}
  mark.cmt.active{background:rgba(91,48,214,.40);}
  #histmodal{display:none;position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.45);align-items:center;justify-content:center;}
  #histbox{width:min(720px,92vw);max-height:82vh;overflow:auto;background:var(--bg);border-radius:12px;padding:18px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13.5px;}
  #histbox h3{margin:0 0 12px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
  .histlist{display:flex;flex-direction:column;gap:6px;}
  .histitem{text-align:left;font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--bg);color:var(--text);border-radius:7px;padding:8px 10px;cursor:pointer;}
  .histitem:hover{border-color:var(--accent);}
  #histview h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);}
  #histview ul{margin:4px 0;padding-left:1.2em;}
  .histdoc{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;font-family:Charter,Georgia,serif;font-size:15px;line-height:1.5;max-height:38vh;overflow:auto;}
  .histbtnrow{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  /* #19: History-modal compare mode — pick any two versions, line-level source diff */
  .cmpbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--muted);}
  .cmpbar select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--text);max-width:min(46%,300px);}
  .diffdoc{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.55;max-height:44vh;overflow:auto;white-space:pre-wrap;word-break:break-word;}
  .diffrow{display:block;padding:0 6px;border-radius:3px;}
  .diffrow.add{background:rgba(46,160,67,.16);}
  .diffrow.del{background:rgba(229,83,75,.15);}
  .diffrow.add::before{content:"+ ";color:#2ea043;}
  .diffrow.del::before{content:"- ";color:#e5534b;}
  .diffrow.eq::before{content:"\00a0\00a0";color:var(--muted);}
  .diffempty{color:var(--muted);padding:8px 4px;}
  /* MR-036: a block carrying an open comment gets the margin bar + dot */
  .blk.has-comment{box-shadow:inset 3px 0 0 var(--noteline);background:rgba(91,48,214,.06);}
  .blk.has-comment .num::after{content:" \25CF";color:var(--noteline);}
  /* MR-036: threaded comment cards (gutter when wide, docked panel when narrow) */
  .gcard{cursor:default;padding:9px 11px;}
  .gcard .ghead,.rcard .ghead{display:flex;gap:6px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;}
  /* MR-050: secondary, muted Delete affordance — only on the reviewer's own un-engaged comment */
  .gcard .ghead .gdel{margin-left:auto;align-self:baseline;background:none;border:none;cursor:pointer;font-family:inherit;font-size:11px;color:var(--muted);padding:1px 5px;border-radius:4px;}
  .gcard .ghead .gdel:hover{color:#c0392b;background:rgba(192,57,43,.10);}
  .gcard .ghead .gdel.armed{color:#fff;background:#c0392b;font-weight:600;}
  .gthread{display:flex;flex-direction:column;gap:5px;}
  .gentry{border-left:3px solid var(--rule);background:rgba(127,127,127,.05);border-radius:4px;padding:4px 8px;}
  .gentry.reviewer{border-left-color:var(--noteline);background:rgba(91,48,214,.07);}
  .gentry.agent{border-left-color:var(--blue);background:rgba(29,79,191,.08);}
  .gentry .grole{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--muted);margin-right:5px;}
  .gentry.reviewer .grole{color:var(--noteline);}
  .gentry.agent .grole{color:var(--blue);}
  .gentry .gtext{color:var(--text);}
  .gentry .gtext>:first-child{margin-top:0;}
  .gentry .gtext>:last-child{margin-bottom:0;}
  .gentry .gtext p{margin:.4em 0;}
  .gentry .gtext ul,.gentry .gtext ol{margin:.4em 0;padding-left:1.3em;}
  .gentry .gtext li{margin:.15em 0;}
  .gentry .gtext code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:rgba(127,127,127,.16);padding:.5px 4px;border-radius:4px;}
  .gentry .gtext pre{background:rgba(127,127,127,.12);padding:7px 9px;border-radius:6px;overflow:auto;margin:.4em 0;}
  .gentry .gtext pre code{background:none;padding:0;font-size:.86em;}
  .gentry .gtext a{color:var(--accent);}
  .gentry .gtext blockquote{margin:.4em 0;padding-left:8px;border-left:2px solid var(--rule);color:var(--muted);}
  .gentry .gtext h1,.gentry .gtext h2,.gentry .gtext h3,.gentry .gtext h4,.gentry .gtext h5{font-size:13px;margin:.5em 0 .2em;}
  .gentry .gtext img{max-width:100%;border-radius:4px;}
  .gentry .gtext hr{border:none;border-top:1px solid var(--rule);margin:.5em 0;}
  .greply,.reopenbox{margin-top:8px;display:flex;flex-direction:column;gap:5px;}
  .greply textarea,.reopenbox textarea{width:100%;min-height:36px;font-family:-apple-system,sans-serif;font-size:12.5px;border:1px solid var(--rule);border-radius:5px;padding:6px;background:var(--bg);color:var(--text);resize:vertical;}
  .greply .btn,.reopenbox .btn{align-self:flex-end;padding:4px 12px;font-size:12px;}
  /* Resolved history panel */
  #resolved{display:none;position:fixed;right:18px;bottom:70px;z-index:55;width:380px;max-height:64vh;overflow:auto;background:var(--bg);border:1px solid var(--rule);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:14px;font-family:-apple-system,sans-serif;}
  #resolved h3{margin:0 0 6px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
  .resolved-count{color:var(--accent);font-weight:700;}
  #resempty{color:var(--muted);font-size:13px;}
  .rcard{border-top:1px solid var(--rule);padding:11px 0;font-size:13px;}
  .rcard .gref{color:var(--accent);font-weight:700;}
  .rcard .gq{color:var(--muted);font-style:italic;font-size:12px;}
  /* narrow fallback: the active-comment gutter docks bottom-right with static cards */
  #gutter.docked{position:fixed;right:18px;bottom:70px;top:auto!important;left:auto!important;width:360px;max-height:64vh;overflow:auto;background:var(--bg);border:1px solid var(--rule);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:12px;display:block;z-index:55;}
  #gutter.docked .gcard{position:static;width:auto;margin-bottom:8px;box-shadow:none;}

  /* ---- Share control (#133 public link, extended by #134 people) ---- */
  .tb-btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--text);background:none;
    border:1px solid var(--rule);border-radius:8px;padding:5px 12px;cursor:pointer;
    text-transform:none;letter-spacing:normal;}
  .tb-btn:hover{border-color:var(--muted2,var(--muted));}
  .share-wrap{position:relative;display:flex;}
  .sharepop{position:absolute;top:calc(100% + 8px);right:0;width:320px;background:var(--panel);
    border:1px solid var(--rule);border-radius:12px;box-shadow:0 12px 40px rgba(20,22,40,.16);
    padding:16px;z-index:60;text-transform:none;letter-spacing:normal;text-align:left;}
  .sharepop h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--text);}
  .share-row{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .share-lbl{font-size:13px;color:var(--text);}
  .share-lbl small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;font-weight:400;}
  .switch{position:relative;width:40px;height:22px;flex:0 0 auto;display:inline-block;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch .track{position:absolute;inset:0;background:var(--rule);border-radius:22px;transition:.15s;
    cursor:pointer;display:block;}
  .switch .track:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.15s;}
  .switch input:checked + .track{background:#5b46e6;}
  .switch input:checked + .track:before{transform:translateX(18px);}
  .share-link{display:flex;gap:8px;margin-top:14px;}
  .share-link input{flex:1;min-width:0;font:inherit;font-size:12px;padding:8px 10px;
    border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--muted);}
  .share-copy{font:inherit;font-size:12.5px;font-weight:600;padding:8px 14px;border:none;
    border-radius:8px;background:#5b46e6;color:#fff;cursor:pointer;white-space:nowrap;}
  .share-copy:hover{opacity:.92;}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-left"><a href="/" class="home" title="Back to all reviews">&larr; Reviews</a><span class="tb-sep">|</span><span class="filename" id="filename">loading…</span></div>
  <div class="tb-right" style="display:flex;align-items:center;gap:14px"><span id="topstate"></span><div class="share-wrap"><button id="sharebtn" class="tb-btn" type="button" style="display:none">Share</button><div id="sharepop" class="sharepop" hidden></div></div><div id="acct"></div></div>
</header>
<div class="wrap">
  <nav class="breadcrumb" id="breadcrumb"></nav>

    </div>

  <button class="btn" id="histbtn">History</button>
</div></div>

</div>

</div></div>

<div id="lightbox"><img alt="zoomed figure"></div>
<div id="toast"></div>
<script src="/static/marked.min.js"></script>
<script src="/static/mermaid.min.js"></script>
<script src="/static/katex.min.js"></script>
<script src="/static/marked-footnote.umd.js"></script>
<script src="/static/highlight.min.js"></script>
<script src="/static/marked-highlight.umd.js"></script>
<script>
const $=s=>document.querySelector(s);
let META={name:"file.md",path:""};
let docTitle="";
let comments=[];        // the shared server-side comment threads (GET /comments)
let cur=null;           // pending anchor while authoring a comment
let lastSrc=0;          // source_updated (doc live-reload)
let lastCmt=0;          // comments_updated (thread live-reload)
let confirming=null;    // comment_id with a pending inline delete-confirm (guards the poll re-render)

function toast(msg){const t=$("#toast");t.textContent=msg;t.style.opacity=1;clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.opacity=0,1800);}
function escapeHtml(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function fileBase(p){return (p||"").split('/').pop()||p;}
// chrome derived from META (top-bar filename + breadcrumb). Legacy reviews lack provenance keys —
// render only the segments present (back-compat: never assume project/session/source_path exist).
function renderChrome(){
  $("#filename").textContent=fileBase(META.source_path)||META.title||('review '+ID);
  const segs=[META.project,META.session,META.source_path].filter(Boolean);
  const bc=$("#breadcrumb");
  if(bc)bc.innerHTML=segs.map(s=>`<span>${escapeHtml(s)}</span>`).join('<span class="sep">/</span>');
}

// --- MR-052: turn baton UI (Send / status banner / reclaim), driven purely by the /status body ---
const STALE_S=180;   // lease-heartbeat staleness (~3 min); agent_status.at is epoch SECONDS (float).
                     // MIRRORS app.py LEASE_TTL_S (single source of truth; both seconds) — move together.
const PICKUP_GRACE_S=60;  // MR-066 (issue #26): pickup grace — turn==agent but NOTHING has claimed a lease
                          // (agent_status null). A different, shorter clock than STALE_S (which is for a
                          // claimed-then-stale lease): > one ~25s watcher long-poll cycle + claim/spawn
                          // jitter (a live watcher won't trip it), < STALE_S=180, > the ~2s poll. Surfaces
                          // a no-watcher review in ~1 min instead of spinning forever.
function postHandoff(body){
  return fetch(API+'/handoff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
}
// First-match decision: agent rows key on turn==='agent', reviewer rows on agent_status.state, so no
// row shadows another. agent message is set via textContent (it can't inject HTML).
// MR-073 (issue #27): per-turn progress state for the derived live timeline + timer. The steps come
// purely from the /status epoch timestamps (no new data): while turn==='agent', turn_updated is the
// Send/flip time (stable), so source_updated/comments_updated > turn_updated ⟺ that happened THIS turn.
// We ACCUMULATE reached steps (cumulative — a skipped 2s poll can't lose one) and keep them into the
// following 'done' state (where turn_updated is re-bumped to the hand_back time, so the comparison no
// longer works — the remembered flags + the client-captured start carry the final render). Reset on a
// NEW agent turn (fresh turn_updated). A fresh page that never observed turn==='agent' leaves these
// unset → no bogus final duration (the documented reopen-after-done limitation).
let _turnId=null, _turnStartAt=null, _turnEdited=false, _turnCommented=false, _lastStatus=null, _timerIv=null;
function fmtDur(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,'0');}
function renderSteps(reached, activeIdx){
  const steps=$("#turnsteps"); if(!steps)return;
  const labels=["Connected — reading your comments","Editing the document","Updating comments"];
  steps.innerHTML='';
  labels.forEach((label,i)=>{
    const li=document.createElement('li'); li.textContent=label;     // textContent: no HTML injection
    if(reached[i]) li.className=(i===activeIdx)?'active':'done';
    steps.appendChild(li);
  });
  return steps;
}
function startTicker(){                                               // 1s fetch-free clock for the live timer
  if(_timerIv)return;
  _timerIv=setInterval(()=>{
    const st=_lastStatus, t=$("#turntimer");
    if(!t||!st||st.turn!=='agent'||!st.agent_status||_turnStartAt==null)return;
    // MR-073: only tick while the lease is FRESH. Once agent_status.at ages past STALE_S — the agent
    // stopped pinging, OR /status is unreachable so the cached `at` keeps aging — re-render the banner
    // off the cached status: it flips to "Agent may have stopped" (clearing the timer), instead of the
    // timer ticking forever. Works even with no successful poll (a dead server / a stuck agent).
    if((Date.now()/1000-(st.agent_status.at||0))>STALE_S){renderBanner(st);return;}
    t.textContent=fmtDur(Date.now()/1000-_turnStartAt);              // fresh: recompute from cached /status, no poll
  },1000);
}
function renderBanner(st){
  const turn=(st&&st.turn)||'reviewer';
  const as=st&&st.agent_status;            // null/absent => parked or never handed off
  const send=$("#sendbtn"),reclaim=$("#reclaimbtn"),tt=$("#turntext"),bar=$("#turnbanner"),timer=$("#turntimer"),steps=$("#turnsteps");
  if(!bar)return;
  _lastStatus=st;
  bar.classList.remove('loading','warn','steps');    // MR-062/066/073: arms below re-add the relevant one
  if(steps)steps.innerHTML=''; if(timer)timer.textContent='';   // cleared unless a timeline arm repopulates
  let msg;
  if(turn==='agent'){
    if(!as){
      // MR-066: parked — nothing claimed. Within grace: still spinner. Past grace: non-spinning warning
      // (no watcher running, or nothing picked it up). turn_updated is in the /status body; renderBanner
      // runs every ~2s poll tick (not guarded on a status change), so this flips as the clock crosses.
      if((Date.now()/1000-((st&&st.turn_updated)||0))>PICKUP_GRACE_S){
        msg="No agent has picked this up — is a watcher running? Take back the turn.";bar.classList.add('warn');
      }else{
        msg="Sent — waiting for an agent to pick this up.";bar.classList.add('loading');  // MR-062: spinner
      }
    }
    else if((Date.now()/1000-(as.at||0))>STALE_S){msg="Agent may have stopped — Take back the turn?";bar.classList.add('warn');}  // MR-066: stale lease is also an "act" state
    else{
      // MR-073 (issue #27): claimed + working → the live progress timeline + ticking timer.
      const tu=(st&&st.turn_updated)||0;
      if(tu!==_turnId){_turnId=tu;_turnStartAt=null;_turnEdited=false;_turnCommented=false;}   // a new turn
      // MR-073/W1: baseline the timer on the AGENT CLAIM (the first 'working' agent_status.at we see),
      // NOT the Send time (turn_updated) — so "Agent revised in M:SS" is the agent's work time, not
      // work time + pickup lag. Captured once per turn; as.at then heartbeats forward.
      if(_turnStartAt==null && as && as.at) _turnStartAt=as.at;
      if(((st&&st.source_updated)||0)>tu)_turnEdited=true;            // edited THIS turn (cumulative)
      if(((st&&st.comments_updated)||0)>tu)_turnCommented=true;       // comment activity THIS turn
      const reached=[true,_turnEdited,_turnCommented];
      let active=0; reached.forEach((r,i)=>{if(r)active=i;});         // latest reached step = active (spins)
      renderSteps(reached,active);
      bar.classList.add('steps');                                    // show #turnsteps (active step spins → liveness)
      msg="Agent is working on your feedback…";
      if(timer&&_turnStartAt!=null)timer.textContent=fmtDur(Date.now()/1000-_turnStartAt);   // live elapsed (since claim)
      startTicker();
    }
    reclaim.style.display='';              // rows 1–3: reclaim available
    send.disabled=true;send.textContent="Sent — agent's turn";
  }else{
    const state=as&&as.state;
    if(state==='done'){
      msg="Agent updated the draft"+(as.message?": "+as.message:"")+". Your turn.";
      // MR-073: if we watched the run (start captured), show the terminal timeline + final duration.
      if(_turnStartAt!=null){
        renderSteps([true,_turnEdited,_turnCommented],-1);           // all reached steps done; no active/spin
        if(_turnCommented&&steps&&steps.children[2])steps.children[2].textContent="Resolved comments"; // honest: only on done
        bar.classList.add('steps');
        const at=(as&&as.at)||0;
        if(timer&&at>_turnStartAt)timer.textContent="Agent revised in "+fmtDur(at-_turnStartAt);
      }
    }
    else if(state==='blocked'){
      // MR-068 (issue #26): distinguish the WATCHER's crash signal (the turn is already back with you)
      // from a deliberate agent question. The watcher sends "agent process exited N without finishing".
      if(as.message&&as.message.indexOf('agent process exited')===0){
        msg="Agent run stopped: "+as.message+". Your turn.";bar.classList.add('warn');  // reuse MR-066 .warn
      }else{
        msg="Agent needs you"+(as.message?": "+as.message:"")+".";   // agent-initiated question (unchanged)
      }
    }
    else msg="Your turn. Comment, then Send to agent.";
    reclaim.style.display='none';
    // gate: the agent's whole instruction IS the open comments, so with none there is nothing to
    // send — disable + grey (the .sendagent[disabled] rule handles the greying).
    const noOpen=(comments||[]).filter(c=>c.status!=='resolved').length===0;
    send.disabled=noOpen;
    send.title=noOpen?"Add a comment first — the agent acts on your open comments":"";
    send.textContent="Send to agent";
  }
  tt.textContent=msg;
  bar.classList.add('show');
  // top-bar right: vN · <turn state> (mockup). Derived from the same turn/agent_status.
  const ts=$("#topstate");
  if(ts){
    const lbl = turn==='agent' ? ((as&&as.state==='working')?'agent working':'waiting for agent') : 'your turn';
    const rev = (st&&st.revision)||META.revision||0;
    ts.textContent = (rev?('v'+rev+' · '):'')+lbl;
  }
}
$("#sendbtn").onclick=async()=>{
  if($("#sendbtn").disabled)return;
  $("#sendbtn").disabled=true;$("#sendbtn").textContent="Sent — agent's turn";
  try{await postHandoff({to:'agent'});const st=await fetch(API+'/status').then(r=>r.json());renderBanner(st);toast('Sent to agent');}
  catch(e){toast('Could not send');$("#sendbtn").disabled=false;$("#sendbtn").textContent="Send to agent";}
};
$("#reclaimbtn").onclick=async()=>{
  try{await postHandoff({to:'reviewer',by:'reviewer'});const st=await fetch(API+'/status').then(r=>r.json());renderBanner(st);toast('Turn reclaimed');}
  catch(e){toast('Could not reclaim');}
};

function initMermaid(){
  if(!window.mermaid)return;
  const dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  try{mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:dark?'dark':'default'});}catch(e){}
}
async function renderMermaid(){
  const codes=[...document.querySelectorAll('#article code.language-mermaid')];
  codes.forEach(c=>{
    const div=document.createElement('div');
    div.className='mermaid';div.textContent=c.textContent;
    (c.closest('pre')||c).replaceWith(div);
  });
  if(window.mermaid&&codes.length){
    try{await mermaid.run({querySelector:'#article .mermaid'});}catch(e){console.warn('mermaid render failed',e);}
  }
}
// Math rendering: a marked extension tokenizes math DURING the markdown parse and renders it
// to HTML with KaTeX. It must run inside marked, not as a post-pass: marked strips the
// backslashes from \(...\) / \[...\] (turning them into literal parens/brackets) and can mangle
// $...$ internals, and KaTeX's auto-render bare-$ scan pairs prose dollars (rendering "$5 and
// $10" as math). The tokenizers below match Jekyll/MathJax delimiters — inline $...$ and \(...\),
// display $$...$$ and \[...\] — with a no-whitespace-hugging rule on $...$ so prose/currency/lone
// $ stays literal; code spans and fenced blocks are skipped by marked's own tokenizer.
function katexHTML(tex, display){
  try{ return katex.renderToString(tex, {displayMode:display, throwOnError:false}); }
  catch(e){ return (display?'$$':'$')+escapeHtml(tex)+(display?'$$':'$'); }
}
// Register marked extensions once, before any marked.parse(). Each feature is guarded on its own
// global, so a missing vendored asset degrades to today's behavior instead of throwing (default-safe).
let _markedReady=false;
function setupMarked(){
  if(_markedReady||!window.marked)return;
  _markedReady=true;
  // Math (KaTeX): inline $…$ / \(…\), display $$…$$ / \[…\].
  if(window.katex) marked.use({extensions:[
    { name:'blockMath', level:'block',
      start(src){ const m=src.match(/\$\$|\\\[/); return m?m.index:undefined; },
      tokenizer(src){
        let m=/^\$\$([\s\S]+?)\$\$/.exec(src);
        if(m) return {type:'blockMath', raw:m[0], text:m[1].trim(), display:true};
        m=/^\\\[([\s\S]+?)\\\]/.exec(src);
        if(m) return {type:'blockMath', raw:m[0], text:m[1].trim(), display:true};
      },
      renderer(t){ return katexHTML(t.text, true); } },
    { name:'inlineMath', level:'inline',
      start(src){ const m=src.match(/\$[^\s$]|\\\(/); return m?m.index:undefined; },
      tokenizer(src){
        let m=/^\\\(([\s\S]+?)\\\)/.exec(src);
        if(m) return {type:'inlineMath', raw:m[0], text:m[1].trim(), display:false};
        m=/^\$([^\s$](?:[^$\n]*[^\s$])?)\$/.exec(src);
        if(m) return {type:'inlineMath', raw:m[0], text:m[1], display:false};
      },
      renderer(t){ return katexHTML(t.text, false); } },
  ]});
  // GFM footnotes: window.markedFootnote IS the factory; refs -> ordered back-ref section.
  var mf=window.markedFootnote;
  if(typeof mf==='function') marked.use(mf());
  // Syntax highlighting (highlight.js): window.markedHighlight is a NAMESPACE object whose
  // .markedHighlight is the factory (a bare markedHighlight() throws). The guard wraps the actual
  // call, so a missing asset degrades silently. The sync highlight callback keeps marked.parse
  // synchronous; mermaid blocks are returned raw so renderMermaid() still makes them diagrams.
  var mh=window.markedHighlight && window.markedHighlight.markedHighlight;
  if(mh && window.hljs) marked.use(mh({
    langPrefix:'hljs language-',
    highlight(code, lang){
      if(lang==='mermaid') return code;
      if(lang && hljs.getLanguage(lang)) return hljs.highlight(code, {language:lang}).value;
      return hljs.highlightAuto(code).value;
    }
  }));
}

const ID=location.pathname.split('/').filter(Boolean).pop();
const API='/api/reviews/'+ID;

// Point <img> sources at attached assets the service now hosts. The agent attached the draft's
// images to the review, so a site-root (/assets/x.png) or source-relative (../img/y.svg) src is
// matched to an attached asset — by full draft src first, then basename — and repointed at the
// served stored-name URL (%2F-free). Absolute http(s)/protocol-relative/data: srcs and unmatched
// local srcs are left untouched (no regression, no source.md mutation).
async function rewriteAssetImages(root){
  const imgs=[...root.querySelectorAll('img')];
  if(!imgs.length)return;
  let assets=[];
  try{ assets=((await fetch(API+'/assets').then(r=>r.json()))||{}).assets||[]; }catch(e){ return; }
  if(!assets.length)return;
  const base=s=>s.split(/[?#]/)[0].split('/').pop();
  const byName=new Map(), byBase=new Map();
  for(const a of assets){ byName.set(a.name,a); const b=base(a.name); if(!byBase.has(b))byBase.set(b,a); }
  for(const img of imgs){
    const src=img.getAttribute('src')||'';
    if(!src||/^(https?:|data:|\/\/)/i.test(src))continue;
    const m=byName.get(src)||byBase.get(base(src));
    if(m&&m.url)img.src=m.url;
  }
}

async function boot(){
  setupMarked();  // register marked extensions (math, footnotes, …) once, before any marked.parse()
  initMermaid();
  META=await fetch(API).then(r=>r.json()).catch(()=>({}));
  document.title="mdreview · "+(META.title||ID);
  renderChrome();
  await fetchComments();   // the shared server-side comments are the single feedback surface
  await load();
  poll();
}

async function load(){
  let md=await fetch(API+'/source',{cache:'no-store'}).then(r=>r.text());
  const st=await fetch(API+'/status').then(r=>r.json()).catch(()=>({}));
  lastSrc=st.source_updated||0;lastCmt=st.comments_updated||0;
  renderBanner(st);   // MR-052: first-paint banner from the same /status body
  // extract YAML front matter (for the title) and strip it
  let title="";
  const fm=md.match(/^﻿?\s*---\r?\n([\s\S]*?)\r?\n---\s*/);
  if(fm){
    const tm=fm[1].match(/^\s*title:\s*["']?(.+?)["']?\s*$/m);
    if(tm)title=tm[1];
    md=md.slice(fm[0].length);
  }
  // strip a leading HTML comment (working-draft metadata)
  md=md.replace(/^\s*<!--[\s\S]*?-->\s*/,'');
  docTitle=title||META.title||ID;
  const dt=$("#doctitle");if(dt)dt.textContent=title;
  // word count + reading time, from prose (drop fenced code/diagram blocks)
  const prose=md.replace(/```[\s\S]*?```/g,' ');
  const words=(prose.trim().match(/\S+/g)||[]).length;
  const rev=(st&&st.revision)||META.revision||0;
  const dm=$("#docmeta");if(dm)dm.textContent=words.toLocaleString()+" words  ·  ~"+Math.max(1,Math.round(words/200))+" min read"+(rev?("  ·  v"+rev):"");
  const html=window.marked?marked.parse(md):("<pre>"+escapeHtml(md)+"</pre>");
  const art=$("#article");art.innerHTML=html;
  await rewriteAssetImages(art);   // repoint local <img> at served assets before reparenting
  numberBlocks();
  await renderMermaid();
  renderAll();
}

// content-derived stable block id (issue #15): FNV-1a over whitespace-normalized text -> hex, so a
// whole-block comment re-anchors by CONTENT after a live-reload renumber (positional #N is unstable
// when a block is inserted/removed above it). Hex-only charset keeps `.blk[data-bid="…"]` selector-safe.
function blockHash(s){s=(s||'').replace(/\s+/g,' ').trim();let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return(h>>>0).toString(16);}
function numberBlocks(){
  const art=$("#article");
  const kids=[...art.children];
  art.innerHTML="";
  let n=0,heading="";const seen={};
  kids.forEach(el=>{
    if(/^H[1-3]$/.test(el.tagName))heading=el.textContent.trim();
    n++;
    // hash el (the child), NOT blk: blk holds the .num span (text = n), which would fold the block
    // NUMBER into the hash and break it on every renumber. Computed here in numberBlocks (called
    // BEFORE renderMermaid) so a diagram/code block hashes its stable SOURCE, and the .blk keeps its
    // data-bid after mermaid swaps its innards to SVG (do NOT move this to renderAll). A per-render
    // occurrence suffix disambiguates verbatim-identical blocks (else querySelector grabs the first).
    let bid=blockHash(el.textContent);const k=seen[bid]=(seen[bid]||0)+1;if(k>1)bid+='-'+k;
    const blk=document.createElement('div');
    blk.className="blk";blk.dataset.num=n;blk.dataset.heading=heading;blk.dataset.bid=bid;
    const num=document.createElement('span');num.className="num";num.title="comment on this block";num.textContent=n;
    blk.appendChild(num);blk.appendChild(el);
    art.appendChild(blk);
    // block_num:blk.dataset.num (per-iteration const), NOT String(n): n is function-scoped, so the old
    // closure read the FINAL n (=total block count) for every gutter click. bid carries the stable id.
    num.onclick=()=>openPop({block_num:blk.dataset.num,quoted_text:'',bid:blk.dataset.bid});
  });
}

// --- comment actions: every human-author path writes the shared comment store ---
async function fetchComments(){

  catch(e){}
}
async function createComment(anchor,text){

      body:JSON.stringify({anchor:anchor,text:text})});

  }catch(e){toast('Could not save comment');}
}
async function replyTo(cid,text){
  if(!text)return;

    await fetch(API+'/comments/'+cid+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:text,role:'reviewer'})});

  }catch(e){toast('Reply failed');}
}
async function reopenComment(cid,text){

      body:JSON.stringify(text?{text:text}:{})});

async function deleteComment(cid){
  // Hard-remove a comment the reviewer made by mistake (DELETE /comments/{cid}). A 404 means it's
  // already gone (e.g. an agent deleted it concurrently) — treat as success and let the re-render
  // drop the card. Only a real failure (5xx/network) keeps the card, with an error toast.
  try{

// --- rendering: active threads in the gutter, resolved ones in the Resolved panel ---
const esc=escapeHtml;
// Render a comment body as markdown (bold/italic/code/lists/links/line-breaks). Comments are
// UNTRUSTED, no-auth input, so HTML is escaped FIRST (neutralises raw-HTML / attribute injection),
// THEN marked renders the markdown syntax; a final pass drops any javascript:/data: URL an author
// slipped into a link or image. `breaks:true` makes a single newline a line break (chat-like).
function mdComment(raw){
  raw=raw||'';
  const html=window.marked?marked.parse(esc(raw),{breaks:true}):esc(raw).replace(/\n/g,'<br>');
  const tpl=document.createElement('template');tpl.innerHTML=html;   // <template> content is inert (no img loads)
  tpl.content.querySelectorAll('a[href]').forEach(a=>{
    if(/^(https?:|mailto:)/i.test(a.getAttribute('href')||'')){a.target='_blank';a.rel='noopener noreferrer';}
    else a.removeAttribute('href');
  });
  tpl.content.querySelectorAll('img[src]').forEach(im=>{
    if(!/^(https?:|data:image\/)/i.test(im.getAttribute('src')||''))im.removeAttribute('src');
  });
  return tpl.innerHTML;
}
function qsnippet(c){const q=(c.anchor&&c.anchor.quoted_text)||'';return q?'"'+q+'"':'(whole block)';}
function threadHtml(c){
  return '<div class="gthread">'+((c.thread||[]).map(e=>{
    const role=e.role==='agent'?'agent':'reviewer';
    return '<div class="gentry '+role+'"><span class="grole">'+esc(role)+'</span><div class="gtext">'+mdComment(e.text||'')+'</div></div>';
  }).join(''))+'</div>';
}
// wrap the comment's quoted text (within a single text node) in a highlight keyed by comment_id
function highlightComment(c){
  const qt=c.anchor&&c.anchor.quoted_text;if(!qt)return null;
  // prefer the authored block_num; if it's absent or doesn't match (e.g. an agent-authored comment
  // that only knows the quoted text — block_num is a rendered-viewer concept it can't supply), scan
  // every block for the phrase so it still anchors + highlights.
  const named=document.querySelector('.blk[data-num="'+(c.anchor.block_num||'')+'"]');
  const blks=named?[named]:[...document.querySelectorAll('.blk')];
  for(const blk of blks){
    const w=document.createTreeWalker(blk,NodeFilter.SHOW_TEXT);let node;
    while(node=w.nextNode()){
      const idx=node.nodeValue.indexOf(qt);
      if(idx>=0){
        const r=document.createRange();r.setStart(node,idx);r.setEnd(node,idx+qt.length);
        const mk=document.createElement('mark');mk.className='cmt';mk.dataset.id=c.comment_id;
        try{r.surroundContents(mk);return mk;}catch(e){return null;}
      }
    }
  }
  return null; // not found / spans inline tags -> gutter card with no inline highlight
}
function focusPair(id){
  document.querySelectorAll('.gcard.active,mark.cmt.active').forEach(e=>e.classList.remove('active'));
  const c=document.querySelector('.gcard[data-id="'+id+'"]');
  const m=document.querySelector('mark.cmt[data-id="'+id+'"]');
  if(c)c.classList.add('active');
  if(m){m.classList.add('active');m.scrollIntoView({block:'center',behavior:'smooth'});}
  else if(c)c.scrollIntoView({block:'center',behavior:'smooth'});
}
function renderAll(){
  const A=$("#article"),G=$("#gutter");if(!A)return;
  confirming=null;   // any full re-render rebuilds the cards, so a pending inline delete-confirm is gone
  // unwrap existing highlights so anchors re-resolve cleanly
  A.querySelectorAll('mark.cmt').forEach(m=>{const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m);p.normalize();});
  document.querySelectorAll('.blk').forEach(b=>b.classList.remove('has-comment'));
  const active=(comments||[]).filter(c=>c.status!=='resolved');
  const resolved=(comments||[]).filter(c=>c.status==='resolved');
  // active -> gutter thread cards (+ highlight)
  G.innerHTML='';
  active.forEach(c=>{
    const mk=highlightComment(c);
    // anchor the card + margin bar to the block the highlight actually landed in (an agent-authored
    // comment may have no block_num — derive it from the highlight).
    // whole-block (quoted_text='') re-resolve: bid FIRST (content-stable across renumbers, issue #15),
    // positional #N only as fallback. bid absent (legacy/agent/text comments) -> straight to positional.
    const blk=mk?mk.closest('.blk'):((c.anchor.bid&&document.querySelector('.blk[data-bid="'+c.anchor.bid+'"]'))||document.querySelector('.blk[data-num="'+(c.anchor.block_num||'')+'"]'));
    if(blk)blk.classList.add('has-comment');
    const ref=(blk&&blk.dataset.num)||c.anchor.block_num||'';
    const card=document.createElement('div');card.className='gcard';card.dataset.id=c.comment_id;
    // Delete is offered ONLY when the thread has no agent entry — i.e. the reviewer's own un-engaged
    // comment (the "I made a mistake" case). Once an agent has replied/resolved, the thread is
    // engaged feedback; the human resolves/reopens it, never hard-deletes it (matches the
    // delete_comment convention that warns agents off deleting real feedback).
    const deletable=!(c.thread||[]).some(e=>e.role==='agent');
    card.innerHTML='<div class="ghead"><span class="gref">'+(ref?'#'+esc(ref):'')+'</span> <span class="gq">'+esc(qsnippet(c))+'</span>'+
      (deletable?'<button class="gdel" data-act="delete" title="Delete this comment — permanent, no undo">Delete</button>':'')+'</div>'+
      threadHtml(c)+
      '<div class="greply"><textarea placeholder="Reply…"></textarea><button class="btn" data-act="reply">Reply</button></div>';
    card._anchor=mk||blk;G.appendChild(card);
  });
  // resolved -> Resolved panel cards (+ reopen)
  const RI=$("#resitems");RI.innerHTML='';
  resolved.forEach(c=>{
    const r=document.createElement('div');r.className='rcard';r.dataset.id=c.comment_id;
    r.innerHTML='<div class="ghead"><span class="gref">#'+esc(c.anchor.block_num||'')+'</span> <span class="gq">'+esc(qsnippet(c))+'</span></div>'+
      threadHtml(c)+
      '<div class="reopenbox"><textarea placeholder="Optional reply when reopening…"></textarea><button class="btn" data-act="reopen">Reopen</button></div>';
    RI.appendChild(r);
  });
  $("#resempty").style.display=resolved.length?'none':'block';
  // counts
  $("#count").textContent=active.length+' open'+(resolved.length?' · '+resolved.length+' resolved':'');
  $("#resbtn").textContent='Resolved '+resolved.length;
  document.querySelector('.resolved-count').textContent=resolved.length;
  // wire reply / reopen / focus-pair
  G.querySelectorAll('.gcard').forEach(card=>{
    const rb=card.querySelector('[data-act=reply]');
    rb.onclick=e=>{e.stopPropagation();const ta=card.querySelector('textarea');const v=ta.value.trim();if(v)replyTo(card.dataset.id,v);};
    card.querySelector('textarea').onclick=e=>e.stopPropagation();
    // inline two-step delete: first click arms ("Confirm delete?"), second click deletes. While armed,
    // `confirming` is set so the 2s poll skips its re-render (which would otherwise wipe the confirm);
    // auto-disarm after 3s.
    const del=card.querySelector('[data-act=delete]');
    if(del)del.onclick=e=>{
      e.stopPropagation();
      const cid=card.dataset.id;
      if(del.dataset.armed){deleteComment(cid);return;}
      del.dataset.armed='1';del.textContent='Confirm delete?';del.classList.add('armed');confirming=cid;
      clearTimeout(del._t);del._t=setTimeout(()=>{del.dataset.armed='';del.textContent='Delete';del.classList.remove('armed');if(confirming===cid)confirming=null;},3000);
    };
    card.onclick=()=>focusPair(card.dataset.id);
  });
  RI.querySelectorAll('.rcard [data-act=reopen]').forEach(b=>{
    b.onclick=e=>{e.stopPropagation();const ta=b.parentNode.querySelector('textarea');reopenComment(b.closest('.rcard').dataset.id,ta.value.trim());};
  });
  A.querySelectorAll('mark.cmt').forEach(m=>m.onclick=()=>focusPair(m.dataset.id));
  layoutComments();
  if(_lastStatus)renderBanner(_lastStatus);   // keep the Send-to-agent gate in sync as comments change
}
function layoutComments(){
  const A=$("#article"),G=$("#gutter");if(!A||!G)return;
  const rect=A.getBoundingClientRect();
  const wide=window.innerWidth>=rect.right+320;          // only when the gutter fits beside the doc
  document.body.classList.toggle('gutter-on',wide);
  if(wide){
    G.classList.remove('docked');G.style.display='block';G.style.top='0px';G.style.width='284px';
    G.style.left=(rect.left+window.scrollX+rect.width+24)+'px';
    const cards=[...G.querySelectorAll('.gcard')].map(c=>{
      let top=0;const a=c._anchor;if(a){const r=a.getBoundingClientRect();top=r.top+window.scrollY;}
      return {c,top};
    }).sort((x,y)=>x.top-y.top);
    let prev=0;cards.forEach(o=>{const t=Math.max(o.top,prev+10);o.c.style.top=t+'px';prev=t+o.c.offsetHeight;});
  }else{
    G.querySelectorAll('.gcard').forEach(c=>c.style.top='');
    if(!G.classList.contains('docked'))G.style.display='none';   // narrow: hidden unless toggled docked
  }
}
// Issue #44: place the composer BESIDE the anchored block (where comment cards live), never over it.
// Mirrors layoutComments' wide/narrow gate + right-margin x. #pop is position:fixed so it uses VIEWPORT
// coords — NO window.scroll* (unlike layoutComments' absolute #gutter, which adds scrollX at line 740).
function positionPop(){
  const pop=$("#pop");if(pop.style.display!=='block')return;   // closed: no-op (safe from the resize handler)
  const A=$("#article");if(!A)return;
  const rect=A.getBoundingClientRect();
  const blk=cur&&document.querySelector('.blk[data-num="'+cur.block_num+'"]');   // graft: null-safe if the block's gone
  if(window.innerWidth>=rect.right+320){                       // wide: float beside the gutter-card column
    pop.classList.remove('docked');
    const popH=pop.offsetHeight;                               // measured after display:block, before positioning
    pop.style.left=(rect.right+24)+'px';                       // layoutComments' x (line 740) minus scrollX (fixed)
    const anchorTop=blk?blk.getBoundingClientRect().top:(window.innerHeight-popH)/2;
    pop.style.top=Math.max(12,Math.min(window.innerHeight-popH-12,anchorTop))+'px';   // AC2: clamp top/bottom on-screen
  }else{                                                       // narrow: dock on the viewport half OPPOSITE the anchor
    pop.classList.add('docked');                              // CSS top/left:auto!important beats the wide inline styles
    // AC3: anchor in the lower half -> dock top-right; upper half (or no anchor) -> bottom-right. The composer
    // and the block sit on opposite halves, so it never covers the anchored block (no scroll hack, no residual).
    const low=blk&&blk.getBoundingClientRect().top>window.innerHeight/2;
    pop.classList.toggle('top',!!low);
  }
}
window.addEventListener('resize',()=>{try{layoutComments();positionPop();}catch(e){}});

// selection -> "+ comment" button (the single author surface: a highlight starts a comment)
const addbtn=$("#addbtn");
$("#article").addEventListener('mouseup',e=>{
  setTimeout(()=>{
    const sel=window.getSelection();const t=sel.toString().trim();
    if(!t||!sel.rangeCount){addbtn.style.display='none';return;}
    const r=sel.getRangeAt(0);
    if(!$("#article").contains(r.commonAncestorContainer)){addbtn.style.display='none';return;}
    // Resolve the block from WHICHEVER endpoint lands inside a .blk. A cross-block, backward, or
    // boundary/whitespace-started selection can leave anchorNode on #article itself — the old code
    // only walked anchorNode, so .closest('.blk') was null and the button silently never appeared
    // (and a clean re-select "fixed" it). Checking anchor + focus + range ends makes it reliable.
    const blkOf=n=>{while(n&&n.nodeType!==1)n=n.parentNode;return(n&&n.closest)?n.closest('.blk'):null;};
    const blk=blkOf(sel.anchorNode)||blkOf(sel.focusNode)||blkOf(r.startContainer)||blkOf(r.endContainer);
    if(!blk){addbtn.style.display='none';return;}
    cur={block_num:blk.dataset.num,quoted_text:t.length>180?t.slice(0,180)+'...':t};
    addbtn.style.left=(e.pageX-10)+'px';addbtn.style.top=(e.pageY+12)+'px';addbtn.style.display='block';
  },1);

// live-reload: a source change re-renders the doc; a comment change re-renders the threads (so an
// agent's MCP reply/resolve appears in the open browser without a manual refresh)
function poll(){
  setInterval(async()=>{
    // Don't re-render the DOM out from under an in-progress comment gesture (button or popup open) —
    // re-rendering mid-selection is the secondary cause of "my highlight didn't take". Skip this tick;
    // the next one (2s) picks the update up once the human is done.
    if(addbtn.style.display==='block'||$("#pop").style.display==='block'||confirming)return;
    try{
      const s=await fetch(API+'/status',{cache:'no-store'}).then(r=>r.json());
      if(s.source_updated&&s.source_updated!==lastSrc){await fetchComments();await load();toast('Draft updated by AI');}
      else if(s.comments_updated&&s.comments_updated!==lastCmt){lastCmt=s.comments_updated;await fetchComments();renderAll();}
      // MR-052 turn baton: reflect the latest turn/agent_status from the SAME /status body. The
      // source-change branch above already ran load() (re-rendered the doc, reset lastSrc) before we
      // touch the banner, so the "Draft updated by AI" toast and the banner don't race. renderBanner
      // runs every tick (not guarded on a turn-change), so the stale-lease row appears over time as
      // agent_status.at ages past STALE_S even with no /status change.
      renderBanner(s);
    }catch(e){}
  },2000);
}

// --- version history (read-only) ---
let HISTVERS=[];        // [{n,label}] versions for the compare pickers (newest-first: current, then rounds)
let HISTMODE='browse';  // 'browse' (one version at a time) | 'compare' (any-two-versions diff, #19)

async function openHistory(){
  const body=$("#histbody");body.innerHTML='Loading...';$("#histmodal").style.display='flex';
  HISTMODE='browse';$("#histcmp").textContent='Compare';
  try{
    // MR-065 (#18): the current live draft is its own top entry — "current (vN)" reconciles with the
    // dashboard's vN badge; the archived rounds (earlier drafts) list below, newest-first. Labels are
    // display-only (round-n on disk is unchanged). The per-round note count was removed (MR-064:
    // round.json no longer carries it — it was always 0 in the comments era).
    const [d,meta]=await Promise.all([fetch(API+'/history').then(r=>r.json()),fetch(API).then(r=>r.json())]);
    const rounds=(d&&d.rounds)||[];
    const rev=(meta&&meta.revision)||0;
    // Shared version list for the compare pickers: current draft first, then each archived round.
    HISTVERS=[{n:'current',label:rev>0?'current (v'+rev+')':'current'}].concat(
      rounds.map(r=>({n:String(r.round),label:'v'+r.round+' · '+new Date(r.ts*1000).toLocaleString()})));
    renderBrowse(rounds,rev);
  }catch(e){body.innerHTML='Could not load history.';}
}
function renderBrowse(rounds,rev){
  const body=$("#histbody");
  let items='<button class="histitem" data-n="current">'+(rev>0?'current (v'+rev+')':'current')+' &middot; live draft</button>';
  if(rounds.length)items+=rounds.map(r=>'<button class="histitem" data-n="'+r.round+'">v'+r.round+' &middot; earlier draft &middot; '+new Date(r.ts*1000).toLocaleString()+'</button>').join('');
  else items+='<p style="color:var(--muted);font-size:13px;margin:6px 2px 0">No earlier versions yet — a version is saved each time the AI pushes a revised draft.</p>';
  body.innerHTML='<div class="histlist">'+items+'</div><div id="histview"></div>';

}
async function showRound(n){

// --- compare mode (#19): pick any two versions, render a line-level source diff ---
// Raw source ("current" via /source, an archived round via /history/{n}). Diffing raw markdown is
// deliberate: it sidesteps diffing rendered HTML/KaTeX/mermaid/attached images (a separate, larger job).
function versionSource(n){
  if(n==='current')return fetch(API+'/source',{cache:'no-store'}).then(r=>r.text());
  return fetch(API+'/history/'+n).then(r=>r.json()).then(d=>d.source||'');
}
// Pure LCS line diff: returns [{tag,text}] where tag is ' ' (unchanged), '-' (only in A), '+' (only in B).
// No DOM/global access, so tests/diff_selfcheck.js can extract and exercise it directly.
function lineDiff(aText,bText){
  const a=String(aText).split('\n'),b=String(bText).split('\n');
  const n=a.length,m=b.length;
  const dp=[];                                 // dp[i][j] = LCS length of a[i:] vs b[j:]
  for(let i=0;i<=n;i++)dp.push(new Int32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){
    if(a[i]===b[j]){out.push({tag:' ',text:a[i]});i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){out.push({tag:'-',text:a[i]});i++;}
    else{out.push({tag:'+',text:b[j]});j++;}
  }
  while(i<n)out.push({tag:'-',text:a[i++]});
  while(j<m)out.push({tag:'+',text:b[j++]});
  return out;
}
function renderCompare(){
  const body=$("#histbody");
  if(HISTVERS.length<2){
    body.innerHTML='<p class="diffempty">Need at least two versions to compare — a version is saved each time the AI pushes a revised draft.</p>';
    return;
  }
  const opts=sel=>HISTVERS.map((v,idx)=>'<option value="'+escapeHtml(v.n)+'"'+(idx===sel?' selected':'')+'>'+escapeHtml(v.label)+'</option>').join('');
  // Default A = previous round (index 1), B = current draft (index 0): the most common "what just changed".
  body.innerHTML='<div class="cmpbar"><span>Compare</span><select id="cmpA">'+opts(1)+'</select>'
    +'<span>&rarr;</span><select id="cmpB">'+opts(0)+'</select></div>'
    +'<div id="diffview" class="diffdoc"></div>';
  const run=()=>renderDiff($("#cmpA").value,$("#cmpB").value);
  $("#cmpA").onchange=run;$("#cmpB").onchange=run;run();
}
async function renderDiff(a,b){
  const view=$("#diffview");if(!view)return;view.innerHTML='Loading...';
  try{
    const [ta,tb]=await Promise.all([versionSource(a),versionSource(b)]);
    const rows=lineDiff(ta,tb);
    if(!rows.some(r=>r.tag!==' ')){view.innerHTML='<div class="diffempty">No changes between these versions.</div>';return;}
    const cls={' ':'eq','+':'add','-':'del'};
    view.innerHTML=rows.map(r=>'<span class="diffrow '+cls[r.tag]+'">'+escapeHtml(r.text)+'</span>').join('');
  }catch(e){view.innerHTML='<div class="diffempty">Could not load the diff.</div>';}
}
$("#histbtn").onclick=openHistory;
$("#histcmp").onclick=()=>{
  if(!HISTVERS.length)return;                   // history not loaded yet
  HISTMODE=HISTMODE==='compare'?'browse':'compare';
  $("#histcmp").textContent=HISTMODE==='compare'?'Browse':'Compare';
  if(HISTMODE==='compare')renderCompare();

};

let _shareCsrf = "", _pubRight = null;
async function initShare(){
  const btn = document.getElementById("sharebtn"), pop = document.getElementById("sharepop");
  if(!btn) return;
  // Ownership gate: GET /shares → 200 (owner; carries the current public state) | 404 (not owner).
  let r; try{ r = await fetch(API + "/shares", {cache:"no-store"}); }catch(e){ return; }
  if(r.status !== 200) return;                        // not the owner → no Share control at all
  const d = await r.json().catch(()=>({}));
  _pubRight = d.public || null;                        // "view" or null
  try{ _shareCsrf = ((await fetch("/auth/session",{cache:"no-store"}).then(x=>x.json())) || {}).csrf || ""; }catch(e){}
  btn.style.display = "";
  btn.addEventListener("click", e=>{ e.stopPropagation(); pop.hidden = !pop.hidden; if(!pop.hidden) renderShare(); });
  document.addEventListener("click", e=>{ if(!pop.hidden && !pop.contains(e.target) && e.target!==btn) pop.hidden = true; });
}
function shareUrl(){ return location.origin + "/review/" + encodeURIComponent(ID); }
function renderShare(){
  const pop = document.getElementById("sharepop"), on = !!_pubRight;
  pop.innerHTML =
    '<h3>Share this review</h3>' +
    '<div class="share-row"><div class="share-lbl">Public link<small>Anyone with the link can view</small></div>' +
    '<label class="switch"><input type="checkbox" id="pubtoggle"' + (on?" checked":"") + '><span class="track"></span></label></div>' +
    (on ? '<div class="share-link"><input id="publink" readonly value="' + shareUrl() + '"><button class="share-copy" id="pubcopy" type="button">Copy</button></div>' : '');
  pop.querySelector("#pubtoggle").addEventListener("change", async e=>{
    const t = e.target; t.disabled = true;
    try{
      const rr = await fetch(API + "/public", {method: t.checked?"POST":"DELETE", headers:{"X-CSRF-Token":_shareCsrf}});
      if(rr.ok) _pubRight = t.checked ? "view" : null;
    }catch(e){}
    renderShare();
  });
  const cp = pop.querySelector("#pubcopy");
  if(cp) cp.addEventListener("click", ()=>{
    const i = pop.querySelector("#publink"); i.select();
    try{ navigator.clipboard.writeText(i.value); }catch(e){}
    cp.textContent = "Copied"; setTimeout(()=>{ cp.textContent = "Copy"; }, 1400);
  });
}
initShare();
</script>
<script src="/static/account.js"></script>
</body>
</html>
