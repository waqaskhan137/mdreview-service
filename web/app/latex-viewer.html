<!DOCTYPE html>
<!-- LaTeX paper review viewer (MR-097). Overleaf-style split: LaTeX source (line-numbered,
     highlighted) left, live server-compiled PDF right. Reuses the shared comment store verbatim
     (block_num = source line number); no turn baton. Self-contained per the repo convention.
     UI contract: mockup artifact b1132f25-daf3-43d8-ba92-d41655fb68d4. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdreview · latex</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  /* Colour tokens live in /static/theme.css (#153) — never redefine them per page. */
  /* Tokens shared with viewer.html (violet accent, blue, theme swap). */

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:13px;display:flex;flex-direction:column;overflow:hidden;}

  .topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 20px;border-bottom:1px solid var(--border);background:var(--bg);}
  .tb-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .home{color:var(--text-muted);text-decoration:none;font-weight:500;white-space:nowrap;}
  .home:hover{color:var(--text);}
  .tb-sep{color:var(--border);}
  .filename{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--accent);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .typechip{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-bg);border-radius:var(--r-pill);padding:2px 6px;}
  .tb-right{font-size:12px;color:var(--text-muted);letter-spacing:.03em;white-space:nowrap;font-variant:small-caps;}

  .tabbar{display:none;}
  .split{flex:1;display:flex;min-height:0;}
  .srcpane{flex:0 0 46%;min-width:280px;display:flex;flex-direction:column;min-height:0;background:var(--bg);}
  .vdiv{flex:0 0 5px;cursor:col-resize;background:var(--border);position:relative;}
  .vdiv::after{content:"";position:absolute;inset:0 -3px;}
  .vdiv:hover,.vdiv.drag{background:var(--accent);}
  .pdfpane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas);}

  .panehead{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--border);
    background:var(--bg);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}
  .panehead .mono{font-family:ui-monospace,Menlo,monospace;text-transform:none;letter-spacing:0;font-size:12px;color:var(--text);}
  /* #189: copy the raw .tex. margin-left:auto parks it at the pane's trailing edge. */
  .panehead .headbtn{margin-left:auto;font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-muted);background:none;border:1px solid var(--border);border-radius:var(--r-control);
    padding:2px 9px;cursor:pointer;}
  .panehead .headbtn:hover{color:var(--text);border-color:var(--text-muted);}
  .panehead .headbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .srcscroll{flex:1;overflow:auto;position:relative;display:flex;align-items:flex-start;}
  /* An explicit `display` BEATS the [hidden] attribute's UA display:none, so hiding the source
     pane needs saying out loud. Without this, toggling diff mode left both panes stacked (#208). */
  .srcscroll[hidden]{display:none;}
  /* The diff pane is its own scroller and must lay out as a BLOCK: .srcscroll is a flex row built
     for codecol + railcol, and reusing it put the diff header beside the rows instead of above. */
  .diffscroll{flex:1;overflow:auto;position:relative;display:block;}
  .diffscroll[hidden]{display:none;}
  /* #291: edit mode. A third source-pane view, same [hidden]-beats-flex contract as srcscroll and
     diffscroll above (an explicit display beats the UA default or two panes stack, #208's bug
     again). BLOCK layout, like diffscroll: it is a column (textarea + bottom bar), not the
     codecol+railcol row srcscroll is built for. */
  .editscroll{flex:1;display:flex;flex-direction:column;min-height:0;}
  .editscroll[hidden]{display:none;}
  .editscroll textarea{flex:1;width:100%;border:0;resize:none;padding:12px 14px;margin:0;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.62;
    background:var(--bg);color:var(--text);outline:none;}
  .editbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px;
    border-top:1px solid var(--border);background:var(--bg);}
  .editerr{flex:1;color:var(--warning);font-size:12px;line-height:1.4;}
  .editerr[hidden]{display:none;}
  /* Mutual exclusion (AC): edit mode always wins over diff mode (enterEdit forces DIFFON off), so
     this is belt-and-suspenders — the diff toggle stays inert (JS guard) and visibly says so. */
  body.editing #difftoggle{opacity:.35;pointer-events:none;}
  .codecol{flex:1;min-width:0;padding:12px 0 60vh;}
  .ln{display:flex;padding:1px 14px 1px 0;line-height:1.62;position:relative;}
  .ln:hover{background:rgba(127,127,127,.07);}
  .ln .n{flex:0 0 46px;text-align:right;padding-right:12px;color:var(--text-subtle);opacity:.55;
    font-family:ui-monospace,Menlo,monospace;font-size:11.5px;user-select:none;cursor:pointer;
    font-variant-numeric:tabular-nums;padding-top:1px;}
  .ln .n:hover{opacity:1;color:var(--accent);}
  .ln .src{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;}
  .ln.has-c{box-shadow:inset 3px 0 0 var(--noteline);background:rgba(91,48,214,.06);}
  .ln.has-c .n{opacity:1;}
  .ln.flash{background:var(--accent-muted);}
  .addb{position:absolute;left:3px;top:50%;transform:translateY(-50%);width:18px;height:18px;border:none;
    border-radius:var(--r-control);background:var(--accent);color:#fff;font-size:14px;line-height:1;cursor:pointer;
    display:none;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.25);}
  .ln:hover .addb,.addb:focus-visible{display:block;}
  .tx-c{color:var(--blue);}          /* \command */
  .tx-m{color:var(--accent);}        /* $math$ */
  .tx-x{color:var(--text-subtle);font-style:italic;}   /* % comment */
  mark.cmt{background:rgba(91,48,214,.18);color:inherit;border-radius:var(--r-control);cursor:pointer;}
  mark.cmt.active{background:rgba(91,48,214,.40);}

  /* comment rail inside the source scroll (mockup .railcol) */
  .railcol{flex:0 0 296px;position:relative;padding:12px 12px 60vh 0;min-height:100%;}
  body.norail .railcol{display:none;}
  .gcard{position:absolute;width:284px;background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--noteline);
    border-radius:var(--r-control);padding:9px 11px;font-size:13px;line-height:1.4;box-shadow:0 1px 6px rgba(0,0,0,.06);
    transition:top .16s ease,box-shadow .15s,border-color .15s;}
  .gcard:hover,.gcard.active{box-shadow:0 5px 18px rgba(0,0,0,.18);border-left-color:var(--accent);}
  .ghead{display:flex;gap:6px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;}
  .gref{color:var(--accent);font-weight:700;}
  .gq{color:var(--text-muted);font-style:italic;font-size:12px;max-height:48px;overflow:hidden;}
  .gdel{margin-left:auto;background:none;border:none;cursor:pointer;font:inherit;font-size:11px;color:var(--text-muted);padding:1px 5px;border-radius:var(--r-control);}
  .gdel:hover{color:#c0392b;background:rgba(192,57,43,.10);}
  .gdel.armed{color:#fff;background:#c0392b;font-weight:600;}
  .gthread{display:flex;flex-direction:column;gap:5px;}
  .gentry{border-left:3px solid var(--border);background:rgba(127,127,127,.05);border-radius:var(--r-control);padding:4px 8px;}
  .gentry.reviewer{border-left-color:var(--noteline);background:rgba(91,48,214,.07);}
  .gentry.agent{border-left-color:var(--blue);background:rgba(29,79,191,.08);}
  .grole{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--text-muted);margin-right:5px;}
  .gentry.reviewer .grole{color:var(--noteline);}
  .gentry.agent .grole{color:var(--blue);}
  .gtext{color:var(--text);}
  .gtext>:first-child{margin-top:0;}.gtext>:last-child{margin-bottom:0;}
  .gtext p{margin:.4em 0;}.gtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(127,127,127,.16);padding:.5px 4px;border-radius:var(--r-control);}
  .gtext pre{background:rgba(127,127,127,.12);padding:7px 9px;border-radius:var(--r-control);overflow:auto;margin:.4em 0;}
  .gtext a{color:var(--accent);}
  .greply,.reopenbox{margin-top:8px;display:flex;flex-direction:column;gap:5px;}
  .greply textarea,.reopenbox textarea{width:100%;min-height:36px;font:inherit;font-size:12.5px;border:1px solid var(--border);
    border-radius:var(--r-control);padding:6px;background:var(--bg);color:var(--text);resize:vertical;}
  .btn{font:inherit;font-size:12.5px;border-radius:var(--r-control);padding:6px 13px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);}
  .btn:hover{border-color:var(--text-subtle);}
  /* #152 slice C: primary buttons (composer "Comment", "Download PDF") use the app-wide brand violet
     with --bg text, matching Basecoat's --primary on the other pages and the viewer (slice B). --bg
     text keeps contrast correct in dark mode. Like the viewer, this page stays off Basecoat's CSS on
     purpose — its preflight would strip list markers from comment-body markdown — and instead aligns
     via the shared theme.css tokens. */
  .btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);}
  .btn.primary:hover{filter:brightness(1.06);}
  .greply .btn,.reopenbox .btn{align-self:flex-end;padding:4px 12px;font-size:12px;}

  /* PDF pane */
  .pdfbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--border);
    background:var(--bg);font-size:12px;color:var(--text-muted);}
  .pdfbar .st{font-variant-numeric:tabular-nums;}
  .pdfbar .dl{margin-left:auto;}
  /* #250: retry a failed compile without editing the source. Same visibility contract as .errbar —
     body.compile-failed drives it, so it appears on a COLD load of a failed review and never on ok. */
  .pdfbar .recompile{display:none;}
  body.compile-failed .pdfbar .recompile{display:inline-block;}
  .pdfbar .recompile[disabled]{opacity:.55;cursor:default;}
  .dl{text-decoration:none;}
  .errbar{display:none;flex:0 0 auto;padding:8px 14px;background:var(--warning-bg);border-bottom:1px solid var(--warning);color:var(--warning);font-size:12px;}
  body.compile-failed .errbar{display:block;}
  .errbar summary{cursor:pointer;font-weight:600;}
  .errbar pre{margin:6px 0 0;max-height:180px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text);}
  .pdfwrap{flex:1;min-height:0;position:relative;}
  #pdfframe{border:0;width:100%;height:100%;background:var(--canvas);}
  .pdfmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px;padding:20px;text-align:center;}

  #toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:90;background:var(--accent);color:#fff;
    font-size:13px;padding:8px 16px;border-radius:var(--r-card);box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none;}
  /* An action toast has to be clickable, which the default explicitly is not, and has to outlive
     the 1.8s fade or the action is decorative (#208). */
  #toast.hasaction{pointer-events:auto;display:flex;align-items:center;gap:12px;}
  #toast .toastbtn{font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;background:none;
    border:1px solid rgba(255,255,255,.65);color:#fff;border-radius:var(--r-control);padding:2px 9px;}
  #toast .toastbtn:hover{background:rgba(255,255,255,.15);}
  #addbtn{position:fixed;z-index:50;display:none;background:var(--accent);color:#fff;border:none;border-radius:var(--r-control);
    padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);}
  #pop{position:fixed;z-index:60;display:none;width:320px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-card);
    box-shadow:0 8px 30px rgba(0,0,0,.3);padding:13px;}
  #pop .q{font-size:12px;color:var(--text-muted);font-style:italic;margin:0 0 8px;font-family:ui-monospace,Menlo,monospace;
    white-space:pre-wrap;max-height:56px;overflow:auto;}
  #pop textarea{width:100%;min-height:70px;font:inherit;font-size:13.5px;border:1px solid var(--border);border-radius:var(--r-control);
    padding:8px;background:var(--bg);color:var(--text);resize:vertical;}
  #pop .row{display:flex;gap:8px;justify-content:flex-end;margin-top:9px;}

  #dock{position:fixed;right:18px;bottom:18px;z-index:55;}
  #dockbar{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-pill);
    padding:8px 12px;box-shadow:0 4px 18px rgba(0,0,0,.2);}
  #count{font-size:13px;color:var(--text-muted);}
  #cmtdock{display:none;position:fixed;right:18px;bottom:70px;z-index:55;width:340px;max-height:64vh;overflow:auto;
    background:var(--bg);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:0 8px 30px rgba(0,0,0,.25);padding:12px;}
  #cmtdock.show{display:block;}
  #cmtdock .gcard{position:static;width:auto;margin-bottom:8px;box-shadow:none;}

  @media (max-width:880px){
    .split{flex-direction:column;}
    .vdiv{display:none;}
    .srcpane{flex:1;min-width:0;}
    .pdfpane{flex:1;}
    .tabbar{display:flex;gap:6px;padding:7px 14px;border-bottom:1px solid var(--border);background:var(--bg);}
    .tabbar button{font:inherit;font-size:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:var(--r-control);padding:4px 14px;cursor:pointer;}
    .tabbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
    body.show-pdf .srcpane{display:none;}
    body:not(.show-pdf) .pdfpane{display:none;}
  }
  button:focus-visible,a:focus-visible,.ln .n:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---- Share control (#133 public link, extended by #134 people) — copied verbatim from viewer.html
     so both viewers show the same panel (#152 latex share-parity). Keep in sync with viewer.html. ---- */
  .tb-btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--text);background:none;
    border:1px solid var(--border);border-radius:var(--r-control);padding:5px 12px;cursor:pointer;
    text-transform:none;letter-spacing:normal;}
  .tb-btn:hover{border-color:var(--text-subtle,var(--text-muted));}
  .share-wrap{position:relative;display:flex;}
  .sharepop{position:absolute;top:calc(100% + 8px);right:0;width:320px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--r-panel);box-shadow:0 12px 40px rgba(20,22,40,.16);
    padding:16px;z-index:60;text-transform:none;letter-spacing:normal;text-align:left;}
  .sharepop h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--text);}
  .share-row{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .share-lbl{font-size:13px;color:var(--text);}
  .share-lbl small{display:block;color:var(--text-muted);font-size:11.5px;margin-top:2px;font-weight:400;}
  .switch{position:relative;width:40px;height:22px;flex:0 0 auto;display:inline-block;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch .track{position:absolute;inset:0;background:var(--border);border-radius:var(--r-pill);transition:.15s;
    cursor:pointer;display:block;}
  .switch .track:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;
    background:#fff;border-radius:var(--r-pill);transition:.15s;}
  .switch input:checked + .track{background:#5b46e6;}
  .switch input:checked + .track:before{transform:translateX(18px);}
  .share-link{display:flex;gap:8px;margin-top:14px;}
  .share-link input{flex:1;min-width:0;font:inherit;font-size:12px;padding:8px 10px;
    border:1px solid var(--border);border-radius:var(--r-control);background:var(--bg);color:var(--text-muted);}
  .share-copy{font:inherit;font-size:12.5px;font-weight:600;padding:8px 14px;border:none;
    border-radius:var(--r-control);background:#5b46e6;color:#fff;cursor:pointer;white-space:nowrap;}
  .share-copy:hover{opacity:.92;}
  /* #134 named-share / people section */
  .share-sep{height:1px;background:var(--border);margin:16px 0;}
  .share-people h4{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--text-muted);}
  .share-list{display:flex;flex-direction:column;gap:8px;margin:0 0 12px;}
  .share-item{display:flex;align-items:center;gap:8px;font-size:13px;}
  .share-item .em{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
  .share-item .rt{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:capitalize;}
  .share-item .rm{background:none;border:none;color:var(--text-subtle,var(--text-muted));cursor:pointer;
    font-size:16px;line-height:1;padding:1px 5px;border-radius:var(--r-control);}
  .share-item .rm:hover{color:#c0392b;background:rgba(192,57,43,.1);}
  .share-empty{color:var(--text-muted);font-size:12.5px;margin:0 0 12px;}
  .share-invite{display:flex;gap:6px;align-items:center;}
  .share-invite input{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:8px 10px;
    border:1px solid var(--border);border-radius:var(--r-control);background:var(--bg);color:var(--text);}
  .share-invite select{font:inherit;font-size:12.5px;padding:8px 6px;border:1px solid var(--border);
    border-radius:var(--r-control);background:var(--bg);color:var(--text);}
  .share-invite button{font:inherit;font-size:12.5px;font-weight:600;padding:8px 12px;border:none;
    border-radius:var(--r-control);background:#5b46e6;color:#fff;cursor:pointer;white-space:nowrap;}
  .share-err{color:#c0392b;font-size:12px;margin:8px 0 0;}
</style>
</head>
<body class="norail">
<header class="topbar">
  <div class="tb-left"><a href="/" class="home" title="Back to all reviews">&larr; Reviews</a><span class="tb-sep">|</span>
    <span class="filename" id="filename">loading…</span><span class="typechip">LATEX</span></div>
  <div class="tb-right" style="display:flex;align-items:center;gap:14px"><span id="topstate"></span><div class="share-wrap"><button id="sharebtn" class="tb-btn" type="button" style="display:none">Share</button><div id="sharepop" class="sharepop" hidden></div></div><div id="acct"></div></div>
</header>
<div class="tabbar" role="tablist">
  <button id="tab-src" aria-pressed="true">Source</button>
  <button id="tab-pdf" aria-pressed="false">PDF</button>
</div>
<div class="split">
  <section class="srcpane" aria-label="LaTeX source">
    <div class="panehead">Source <span class="mono" id="srcname">paper.tex</span><span id="srcmeta"></span><button type="button" class="headbtn difftoggle" id="difftoggle" aria-pressed="false" title="Show what changed in the last revision" hidden><span class="dglyph" aria-hidden="true">+/−</span><span>Diff</span><span class="dcount" id="diffcount" hidden></span></button><button type="button" class="headbtn" id="editbtn" aria-label="Edit the LaTeX source" hidden>Edit</button><button type="button" class="headbtn" id="copysrc" aria-label="Copy the LaTeX source to the clipboard">Copy</button></div>
    <div class="srcscroll" id="srcscroll">
      <div class="codecol" id="codecol"><div class="pdfmsg">Loading source…</div></div>
      <div class="railcol" id="railcol"></div>
    </div>
    <!-- #208: diff mode replaces the source rows only. The PDF pane keeps its half, which is the
         point of the split — you compare the source with the compiled paper still beside it. The
         comment rail is deliberately NOT shown here: comments anchor to current line numbers, and a
         unified diff interleaves old and new ones, so an anchor drawn against it would be a lie. -->
    <div class="diffscroll" id="texdiffpane" hidden></div>
    <!-- #291: edit mode. A textarea over the .tex source, same pane, same mutual-exclusion rule as
         diff mode above (only one of the three views is ever visible). editerr surfaces the two
         DISTINCT #188 failure paths: 400 (rejected write, buffer kept, nothing written) and 409
         (stale revision, buffer kept, "changed by the agent"). A 200 that later fails to COMPILE is
         NOT an editor error — that surfaces in #errbar via the existing compile poll, after the
         editor has already closed on the successful save. -->
    <div class="editscroll" id="editpane" hidden>
      <textarea id="edittext" spellcheck="false" aria-label="Edit the LaTeX source"></textarea>
      <div class="editbar"><span class="editerr" id="editerr" hidden></span>
        <button type="button" class="btn" id="editcancel">Cancel</button>
        <button type="button" class="btn primary" id="editsave">Save</button>
      </div>
    </div>
  </section>
  <div class="vdiv" id="vdiv" role="separator" aria-label="Resize panes" aria-orientation="vertical"></div>
  <section class="pdfpane" aria-label="PDF preview">
    <div class="pdfbar"><span class="st" id="pdfstate">PDF</span>
      <button class="btn recompile" id="recompilebtn" type="button" title="Re-run the compile at the current revision">Recompile</button>
      <a class="btn primary dl" id="dlbtn" href="#" download="paper.pdf">Download PDF</a></div>
    <details class="errbar" id="errbar"><summary id="errsum">Compile failed</summary><pre id="errlog"></pre></details>
    <div class="pdfwrap"><iframe id="pdfframe" title="compiled PDF"></iframe>
      <div class="pdfmsg" id="pdfmsg">No PDF yet.</div></div>
  </section>
</div>

<button id="addbtn">+ Comment</button>
<div id="pop"><div class="q" id="popq"></div>
  <textarea id="popnote" placeholder="Your comment on this line…"></textarea>
  <div class="row"><button class="btn" id="popcancel">Cancel</button><button class="btn primary" id="popsave">Comment</button></div>
</div>
<div id="dock"><div id="dockbar"><span id="count">0 open</span><button class="btn" id="cmtbtn">Comments</button></div></div>
<div id="cmtdock"></div>
<div id="toast" role="status"></div>

<script src="/static/linediff.js"></script>
<script src="/static/marked.min.js"></script>
<!-- Before the inline block: it registers bindings at parse time and needs window.mdKeys. -->
<script src="/static/keys.js"></script>
<script>
const $=s=>document.querySelector(s);
const ID=location.pathname.split('/').pop();
const API='/api/reviews/'+ID, LATEX='/api/latex/'+ID;
let comments=[], cur=null, confirming=null, lastSrc=0, lastCmt=0, pdfRev=null;

function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const esc=escapeHtml;

// ---- LaTeX line highlighting: split a line into command / comment / math / text spans. The
// concatenated textContent of .src equals the raw line, so comment offsets map cleanly. ----
function highlightLatex(line){
  let out='', i=0;
  const push=(cls,txt)=>{out+=cls?'<span class="'+cls+'">'+esc(txt)+'</span>':esc(txt);};
  while(i<line.length){
    const ch=line[i];
    if(ch==='%'){push('tx-x',line.slice(i));break;}
    if(ch==='\\'){
      const m=/^\\([A-Za-z]+\*?|.)/.exec(line.slice(i));
      const tok=m?m[0]:ch;push('tx-c',tok);i+=tok.length;continue;
    }
    if(ch==='$'){
      const rest=line.slice(i+1);const end=rest.indexOf('$');
      if(end>=0){push('tx-m',line.slice(i,i+2+end));i+=2+end;continue;}
    }
    let j=i+1;while(j<line.length&&!'%\\$'.includes(line[j]))j++;
    push('',line.slice(i,j));i=j;
  }
  return out;
}

// #189: the raw .tex exactly as /source returned it. Rendering interleaves gutter numbers into the
// DOM, so reading the copy back off .ln would not round-trip. loadSource() is re-invoked by the
// live-reload path, so this tracks the current revision rather than the one present at boot.
let rawSource='';

async function loadSource(){
  const t=await (await fetch(API+'/source',{cache:'no-store'})).text();
  rawSource=t;
  const col=$('#codecol');col.innerHTML='';
  const lines=t.split('\n');
  lines.forEach((line,idx)=>{
    const n=idx+1;
    const d=document.createElement('div');d.className='ln';d.dataset.num=String(n);d.id='L'+n;
    d.innerHTML='<span class="n" tabindex="0" title="Comment on line '+n+'">'+n+'</span>'+
      '<span class="src">'+highlightLatex(line)+'</span>';
    col.appendChild(d);
  });
  $('#srcmeta').textContent=' · '+lines.length+' lines';
  wireLineAffordances();
  renderComments();
}

// ---- #208: diff mode in the source pane -------------------------------------------------------
// Same contract as the markdown viewer (#207): OFF on load, STICKY once opened, and a push only
// ever hints. Only the source pane swaps; the PDF pane and the compile bar are untouched.
let DIFFON=false;
let PREVROUND=null;      // newest archived round, or null when there is nothing to compare against
// #291: edit mode. EDITON gates the third source-pane view (syncDiffVisibility above); editRevision
// is the #288 precondition token, taken ONLY from the GET /source response that seeds the textarea
// (never a separate /status fetch — that ordering is the lost-update bug the guard exists to
// prevent); canEdit mirrors /status.can_edit, read once at boot like the Share button's ownership
// gate (both viewers already poll /status, so this adds no requests).
let EDITON=false, editRevision=null, canEdit=false;

function setDiffCount(c){
  const el=$('#diffcount');
  if(!c||!c.changed){el.hidden=true;return;}
  el.innerHTML='+'+c.add+' <span class="dm">&minus;'+c.del+'</span>';
  el.hidden=false;
}
// The button only appears once an earlier version exists — before the first agent push there is
// nothing to diff, and an inert control would raise a question it cannot answer.
async function refreshDiffAvail(){
  try{
    const d=await (await fetch(API+'/history',{cache:'no-store'})).json();
    const rounds=(d&&d.rounds)||[];
    PREVROUND=rounds.length?String(rounds[0].round):null;   // rounds are newest-first
  }catch(e){PREVROUND=null;}
  $('#difftoggle').hidden=!PREVROUND;
}
async function versionSource(n){
  if(n==='current')return (await fetch(API+'/source',{cache:'no-store'})).text();
  const d=await (await fetch(API+'/history/'+n)).json();
  return d.source||'';
}
async function paintTexDiff(){
  const pane=$('#texdiffpane');
  if(!PREVROUND){pane.innerHTML='<div class="diffempty">No earlier version yet — a version is saved each time the AI pushes a revised draft.</div>';return;}
  pane.innerHTML='<div class="diffempty">Loading…</div>';
  try{
    const [ta,tb]=await Promise.all([versionSource(PREVROUND),versionSource('current')]);
    setDiffCount(mdDiff.renderInto(pane,ta,tb));
  }catch(e){pane.innerHTML='<div class="diffempty">Could not load the diff.</div>';}
}
// DIFFON is the single source of truth for which pane shows; kept separate so a push can
// re-assert it without also re-triggering a repaint. #291: EDITON is a THIRD pane sharing the same
// slot, and it always wins — enterEdit() forces DIFFON off before opening, so the two are never
// both true, but this stays defensive rather than trusting that invariant silently.
function syncDiffVisibility(){
  $('#srcscroll').hidden=DIFFON||EDITON;
  $('#texdiffpane').hidden=!DIFFON||EDITON;
  $('#editpane').hidden=!EDITON;
  $('#difftoggle').setAttribute('aria-pressed',DIFFON?'true':'false');
  document.body.classList.toggle('editing',EDITON);
}
function applyDiffMode(){
  syncDiffVisibility();
  if(DIFFON)paintTexDiff();
}
async function onAgentPush(){
  await refreshDiffAvail();
  if(DIFFON){await paintTexDiff();syncDiffVisibility();toast('Draft updated by AI');return;}
  let changed=0;
  try{
    if(PREVROUND){
      const [ta,tb]=await Promise.all([versionSource(PREVROUND),versionSource('current')]);
      const c=mdDiff.counts(mdDiff.lineDiff(ta,tb));
      setDiffCount(c);changed=c.changed;
      if(c.changed)$('#difftoggle').classList.add('hinted');
    }
  }catch(e){}
  // The toast is where the reviewer learns their paper was rewritten, so it is where the way to
  // see it belongs. Clicking is the reviewer ASKING — that is the one case where opening the diff
  // for them is correct, and it is still their action, not the push's.
  // #291: not while EDITON — the action would flip DIFFON under an open editor, and syncDiffVisibility
  // keeps the edit pane on top regardless, so the click would silently do nothing visible. Plain
  // notice instead; the diff is still one click away once they finish or cancel.
  if(changed&&!EDITON)toastAction('Draft updated by AI','See what changed',()=>{DIFFON=true;$('#difftoggle').classList.remove('hinted');applyDiffMode();});
  else toast('Draft updated by AI');
  // Re-assert from DIFFON, always and last: loadSource() has just rebuilt the pane and several
  // awaits have passed, so this guarantees a push cannot leave the reviewer in a pane they did
  // not open.
  syncDiffVisibility();
}

// ---- comments: same store + CRUD as viewer.html, block_num = line number ----
async function fetchComments(){
  try{const d=await (await fetch(API+'/comments',{cache:'no-store'})).json();comments=(d&&d.comments)||[];}catch(e){}
}
async function createComment(anchor,text){
  try{await fetch(API+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({anchor:anchor,text:text})});
    await fetchComments();renderComments();toast('Comment added');}
  catch(e){toast('Could not save comment');}
}
async function replyTo(cid,text){if(!text)return;
  try{await fetch(API+'/comments/'+cid+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:text,role:'reviewer'})});await fetchComments();renderComments();}
  catch(e){toast('Reply failed');}}
async function reopenComment(cid,text){
  try{await fetch(API+'/comments/'+cid+'/reopen',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(text?{text:text}:{})});await fetchComments();renderComments();toast('Reopened');}
  catch(e){toast('Reopen failed');}}
async function deleteComment(cid){
  try{const r=await fetch(API+'/comments/'+cid,{method:'DELETE'});
    if(!r.ok&&r.status!==404){toast('Could not delete');return;}
    await fetchComments();renderComments();toast('Comment deleted');}
  catch(e){toast('Could not delete');}}

// Comment body is UNTRUSTED: escape first, then marked, then strip javascript:/data: urls.
function mdComment(raw){
  raw=raw||'';
  const html=window.marked?marked.parse(esc(raw),{breaks:true}):esc(raw).replace(/\n/g,'<br>');
  const tpl=document.createElement('template');tpl.innerHTML=html;
  tpl.content.querySelectorAll('a[href]').forEach(a=>{
    if(/^(https?:|mailto:)/i.test(a.getAttribute('href')||'')){a.target='_blank';a.rel='noopener noreferrer';}
    else a.removeAttribute('href');});
  tpl.content.querySelectorAll('img[src]').forEach(im=>{if(!/^(https?:|data:image\/)/i.test(im.getAttribute('src')||''))im.removeAttribute('src');});
  return tpl.innerHTML;
}
function qsnippet(c){const q=(c.anchor&&c.anchor.quoted_text)||'';return q?'"'+q+'"':'(whole line)';}
function threadHtml(c){return '<div class="gthread">'+((c.thread||[]).map(e=>{
  const role=e.role==='agent'?'agent':'reviewer';
  return '<div class="gentry '+role+'"><span class="grole">'+esc(role)+'</span><div class="gtext">'+mdComment(e.text||'')+'</div></div>';
}).join(''))+'</div>';}

// Offset-mapped highlight: find the quote in the line's .src textContent, then wrap each
// intersecting text-node slice in its own <mark> (a Range spanning element boundaries cannot be
// surroundContents'd, so we wrap per segment). Exact-line lookup first, then a whole-file scan.
function markInSrc(srcEl,qt,cid){
  const txt=srcEl.textContent;const start=txt.indexOf(qt);if(start<0)return false;
  const end=start+qt.length;
  const walker=document.createTreeWalker(srcEl,NodeFilter.SHOW_TEXT);
  const nodes=[];let node;while(node=walker.nextNode())nodes.push(node);
  let pos=0;const slices=[];
  nodes.forEach(n=>{const ns=pos,ne=pos+n.nodeValue.length;pos=ne;
    const s=Math.max(start,ns),e=Math.min(end,ne);if(s<e)slices.push([n,s-ns,e-ns]);});
  let wrapped=false;
  slices.forEach(([n,a,b])=>{const r=document.createRange();r.setStart(n,a);r.setEnd(n,b);
    const mk=document.createElement('mark');mk.className='cmt';mk.dataset.id=cid;
    try{r.surroundContents(mk);wrapped=true;}catch(e){}});
  return wrapped;
}
function highlightComment(c){
  const qt=c.anchor&&c.anchor.quoted_text;if(!qt)return null;
  const named=document.querySelector('.ln[data-num="'+(c.anchor.block_num||'')+'"]');
  const lines=named&&named.querySelector('.src').textContent.includes(qt)?[named]:[...document.querySelectorAll('.ln')];
  for(const ln of lines){if(markInSrc(ln.querySelector('.src'),qt,c.comment_id))return ln;}
  return null;
}

function renderComments(){
  confirming=null;
  // unwrap old marks
  document.querySelectorAll('mark.cmt').forEach(m=>{const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m);p.normalize();});
  document.querySelectorAll('.ln').forEach(l=>l.classList.remove('has-c'));
  const active=(comments||[]).filter(c=>c.status!=='resolved');
  const rail=$('#railcol'),dock=$('#cmtdock');rail.innerHTML='';
  const cards=[];
  active.forEach(c=>{
    const ln=highlightComment(c)||document.querySelector('.ln[data-num="'+(c.anchor.block_num||'')+'"]');
    if(ln)ln.classList.add('has-c');
    const ref=(ln&&ln.dataset.num)||c.anchor.block_num||'';
    const card=document.createElement('div');card.className='gcard';card.dataset.id=c.comment_id;
    const deletable=!(c.thread||[]).some(e=>e.role==='agent');
    card.innerHTML='<div class="ghead"><span class="gref">'+(ref?'L'+esc(ref):'')+'</span> <span class="gq">'+esc(qsnippet(c))+'</span>'+
      (deletable?'<button class="gdel" data-act="delete" title="Delete this comment — permanent">Delete</button>':'')+'</div>'+
      threadHtml(c)+'<div class="greply"><textarea placeholder="Reply…"></textarea><button class="btn" data-act="reply">Reply</button></div>';
    card._anchor=ln;rail.appendChild(card);cards.push(card);
  });
  wireCards(rail);
  // mirror into the narrow dock (static list)
  dock.innerHTML='<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:8px">Comments ('+active.length+')</div>';
  cards.forEach(c=>dock.appendChild(c.cloneNode(true)));wireCards(dock);
  $('#count').textContent=active.length+' open';
  document.querySelectorAll('mark.cmt').forEach(m=>m.onclick=()=>focusPair(m.dataset.id));
  layoutCards();
}
function wireCards(root){
  root.querySelectorAll('.gcard').forEach(card=>{
    const rb=card.querySelector('[data-act=reply]');
    if(rb)rb.onclick=e=>{e.stopPropagation();const ta=card.querySelector('textarea');const v=ta.value.trim();if(v)replyTo(card.dataset.id,v);};
    const ta=card.querySelector('textarea');if(ta)ta.onclick=e=>e.stopPropagation();
    const del=card.querySelector('[data-act=delete]');
    if(del)del.onclick=e=>{e.stopPropagation();const cid=card.dataset.id;
      if(del.dataset.armed){deleteComment(cid);return;}
      del.dataset.armed='1';del.textContent='Confirm delete?';del.classList.add('armed');confirming=cid;
      clearTimeout(del._t);del._t=setTimeout(()=>{del.dataset.armed='';del.textContent='Delete';del.classList.remove('armed');if(confirming===cid)confirming=null;},3000);};
    card.onclick=()=>focusPair(card.dataset.id);
  });
}
function focusPair(id){
  document.querySelectorAll('.gcard.active,mark.cmt.active').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.gcard[data-id="'+id+'"]').forEach(c=>c.classList.add('active'));
  const m=document.querySelector('mark.cmt[data-id="'+id+'"]');
  if(m){m.classList.add('active');m.scrollIntoView({block:'center',behavior:'smooth'});}
}
function layoutCards(){
  const pane=$('.srcpane'),wide=pane&&pane.clientWidth>=640;
  document.body.classList.toggle('norail',!wide);
  if(!wide)return;
  const col=$('#codecol');let prev=0;
  [...$('#railcol').querySelectorAll('.gcard')]
    .map(c=>({c,top:c._anchor?c._anchor.offsetTop:0})).sort((a,b)=>a.top-b.top)
    .forEach(o=>{const t=Math.max(o.top,prev);o.c.style.top=t+'px';prev=t+o.c.offsetHeight+10;});
}

// ---- add-comment affordances: line +, line-number click, text selection ----
function wireLineAffordances(){
  document.querySelectorAll('.ln').forEach(ln=>{
    const n=ln.dataset.num, srcText=()=>ln.querySelector('.src').textContent;
    const whole=()=>{const t=srcText().trim();return {block_num:n,quoted_text:t.length>180?t.slice(0,180)+'...':t};};
    const b=document.createElement('button');b.className='addb';b.textContent='+';b.title='Comment on line '+n;
    b.onclick=e=>{e.stopPropagation();openPop(whole(),e.clientX,e.clientY);};
    ln.appendChild(b);
    const num=ln.querySelector('.n');
    num.onclick=e=>openPop(whole(),e.clientX,e.clientY);
    num.onkeydown=e=>{if(e.key==='Enter'){const r=num.getBoundingClientRect();openPop(whole(),r.right,r.bottom);}};
  });
}
const addbtn=$('#addbtn');
$('#codecol').addEventListener('mouseup',e=>{
  setTimeout(()=>{
    const sel=window.getSelection();const t=(sel?sel.toString():'').trim();
    if(!t||!sel.rangeCount){addbtn.style.display='none';return;}
    const srcOf=nd=>{while(nd&&nd.nodeType!==1)nd=nd.parentNode;return nd&&nd.closest?nd.closest('.ln'):null;};
    const r=sel.getRangeAt(0);
    const ln=srcOf(sel.anchorNode)||srcOf(sel.focusNode)||srcOf(r.startContainer);
    if(!ln){addbtn.style.display='none';return;}
    cur={block_num:ln.dataset.num,quoted_text:t.length>180?t.slice(0,180)+'...':t};
    addbtn.style.left=Math.min(e.clientX-10,window.innerWidth-130)+'px';addbtn.style.top=(e.clientY+12)+'px';
    addbtn.style.display='block';
  },1);
});
addbtn.onclick=()=>{addbtn.style.display='none';openPop(cur);};
function openPop(c,x,y){
  cur=c;
  $('#popq').textContent=(c.quoted_text?'L'+c.block_num+': "'+c.quoted_text+'"':'Line '+c.block_num);
  $('#popnote').value='';
  const pop=$('#pop');pop.style.display='block';
  const px=(x!=null?Math.min(x,window.innerWidth-340):window.innerWidth/2-160);
  const py=(y!=null?Math.min(y+8,window.innerHeight-200):window.innerHeight/2-120);
  pop.style.left=Math.max(12,px)+'px';pop.style.top=Math.max(12,py)+'px';$('#popnote').focus();
}
$('#popcancel').onclick=()=>$('#pop').style.display='none';
$('#popsave').onclick=()=>{const v=$('#popnote').value.trim();if(!v)return;
  createComment({quoted_text:cur.quoted_text,block_num:cur.block_num,start:null,end:null},v);
  $('#pop').style.display='none';window.getSelection().removeAllRanges();};

// ---- PDF pane: compile status + iframe reload + download + error banner ----
async function refreshPdf(){
  let st=null;
  try{const r=await fetch(LATEX+'/compile',{cache:'no-store'});if(r.ok)st=await r.json();}catch(e){}
  const bar=$('#pdfstate'),msg=$('#pdfmsg'),frame=$('#pdfframe'),dl=$('#dlbtn'),errbar=$('#errbar');
  if(!st){bar.textContent='PDF';return;}
  const rev=st.revision;
  if(st.state==='ok'){
    bar.textContent='PDF · v'+rev+' · compiled';
    document.body.classList.remove('compile-failed');
    // #205: a return to ok must CLEAR the staleness dressing the failed branch applied, or the
    // Download button keeps advertising an old revision after the compile recovered.
    dl.href=LATEX+'/pdf'; dl.textContent='Download PDF'; dl.removeAttribute('title');
    msg.style.display='none';
    if(pdfRev!==rev){pdfRev=rev;frame.src=LATEX+'/pdf?v='+rev;}   // reload only on a new build
  }else if(st.state==='failed'){
    // #205. Two bugs lived here. On a COLD load (fresh page, no prior 'ok' this session) pdfRev was
    // null, so the viewer announced "No PDF yet" and never set frame.src — while a perfectly good
    // PDF sat on disk. And #dlbtn kept whatever href the 'ok' branch last gave it, so Download
    // handed over a previous revision's document with no indication it was stale.
    // Both are answered by the SERVER now (has_pdf / pdf_revision) rather than by session memory.
    bar.textContent='PDF · v'+rev+' · compile failed';
    document.body.classList.add('compile-failed');
    const rb=$('#recompilebtn'); if(rb){ rb.disabled=false; rb.textContent='Recompile'; }  // #250: verdict is in
    $('#errlog').textContent=st.log_tail||'(no log)';
    // "unknown" is deliberate for status files written before pdf_revision existed. st.revision is
    // the ATTEMPTED revision — displaying it here would name a revision whose PDF was never built.
    const shownRev = (st.pdf_revision!=null) ? ('v'+st.pdf_revision)
                   : (pdfRev!=null ? ('v'+pdfRev) : 'an earlier revision (unknown)');
    if(st.has_pdf){
      $('#errsum').textContent='Compile failed at v'+rev+' — showing '+shownRev;
      // Render the surviving PDF on a cold load too; the ok-branch guard never ran.
      if(frame.src.indexOf(LATEX+'/pdf')===-1) frame.src=LATEX+'/pdf?stale='+rev;
      msg.style.display='none';
      // Say what it is, rather than silently handing over a document the reader thinks is current.
      dl.href=LATEX+'/pdf';
      dl.textContent='Download '+shownRev;
      dl.title='The current compile (v'+rev+') failed. This downloads '+shownRev+'.';
    }else{
      $('#errsum').textContent='Compile failed at v'+rev;
      msg.textContent='No PDF yet — the compile failed. See the log above.';
      msg.style.display='flex';
      dl.removeAttribute('href');            // nothing to download; do not offer a dead link
      dl.textContent='Download PDF';
      dl.title='No PDF has been produced yet.';
    }
  }else{
    bar.textContent='PDF · '+st.state+'…';
    if(pdfRev==null){msg.textContent='Compiling…';msg.style.display='flex';}
    // #250: while the server says queued/running, the control stays in-progress — state from the
    // poll, not a client timer. (body.compile-failed is still set from the failed round, so the
    // button remains visible until the verdict.)
    const rb=$('#recompilebtn'); if(rb){ rb.disabled=true; rb.textContent='Recompiling…'; }
  }
}

// ---- live poll: source / comments / compile status off the same interval ----
function poll(){
  setInterval(async()=>{
    if(addbtn.style.display==='block'||$('#pop').style.display==='block'||confirming)return;
    try{
      const s=await fetch(API+'/status',{cache:'no-store'}).then(r=>r.json());
      if(s.source_updated&&s.source_updated!==lastSrc){lastSrc=s.source_updated;await fetchComments();await loadSource();await onAgentPush();}
      else if(s.comments_updated&&s.comments_updated!==lastCmt){lastCmt=s.comments_updated;await fetchComments();renderComments();}
    }catch(e){}
    refreshPdf();
  },2000);
}

// ---- divider drag, tabs, dock, boot ----
(function(){
  const div=$('#vdiv'),src=$('.srcpane');let drag=false;
  div.addEventListener('pointerdown',e=>{drag=true;div.classList.add('drag');div.setPointerCapture(e.pointerId);e.preventDefault();});
  div.addEventListener('pointermove',e=>{if(!drag)return;const r=$('.split').getBoundingClientRect();
    const pct=Math.min(72,Math.max(24,(e.clientX-r.left)/r.width*100));src.style.flexBasis=pct+'%';layoutCards();});
  div.addEventListener('pointerup',()=>{drag=false;div.classList.remove('drag');});
  const ts=$('#tab-src'),tp=$('#tab-pdf');
  function tab(pdf){document.body.classList.toggle('show-pdf',pdf);ts.setAttribute('aria-pressed',String(!pdf));tp.setAttribute('aria-pressed',String(pdf));}
  ts.onclick=()=>tab(false);tp.onclick=()=>tab(true);
  $('#cmtbtn').onclick=()=>$('#cmtdock').classList.toggle('show');
  window.addEventListener('resize',()=>{try{layoutCards();}catch(e){}});
})();
let tTimer=null;
function toast(m){const t=$('#toast');t.classList.remove('hasaction');t.textContent=m;t.style.opacity=1;clearTimeout(tTimer);tTimer=setTimeout(()=>t.style.opacity=0,1800);}
// Toast carrying one action. Used for "the AI rewrote your paper — see what changed", which is the
// moment the question is raised, so it is the right place to answer it. Longer-lived than a plain
// toast because a 1.8s window is not long enough to read a sentence and then aim at a button.
function toastAction(m,label,fn){
  const t=$('#toast');
  t.classList.add('hasaction');
  t.innerHTML='<span></span><button type="button" class="toastbtn"></button>';
  t.querySelector('span').textContent=m;
  const b=t.querySelector('.toastbtn');b.textContent=label;
  b.onclick=()=>{t.style.opacity=0;t.classList.remove('hasaction');fn();};
  t.style.opacity=1;clearTimeout(tTimer);tTimer=setTimeout(()=>{t.style.opacity=0;t.classList.remove('hasaction');},7000);
}

// #189: AWAIT the write. writeText returns a promise, so a synchronous try/catch around it cannot
// see a rejection and would report success while the clipboard stayed empty (denied permission,
// non-secure context, unfocused document). Failure has to be visibly distinct from success.
$('#copysrc').addEventListener('click',async()=>{
  try{ await navigator.clipboard.writeText(rawSource); toast('Source copied'); }
  catch(e){ toast('Copy failed — '+(e&&e.name?e.name:'clipboard unavailable')); }
});

async function boot(){
  try{const meta=await (await fetch(API,{cache:'no-store'})).json();
    $('#filename').textContent=(meta.source_path||meta.title||'paper')+'';
    const p=(meta.project?meta.project+' · ':'');$('#topstate').textContent=p+'v'+(meta.revision||0);
    $('#srcname').textContent='paper.tex';}catch(e){}
  await fetchComments();await loadSource();await refreshPdf();
  // Seed the live-reload cursors from the current status BEFORE polling, or the first tick sees
  // lastSrc/lastCmt at their initial 0 and falsely fires a "Draft updated by AI" reload on a
  // review nothing changed (mirrors viewer.html's load()).
  try{const s=await (await fetch(API+'/status',{cache:'no-store'})).json();
    lastSrc=s.source_updated||0;lastCmt=s.comments_updated||0;
    // #291: can_edit (#288) is the SAME custody can_write the PUT arm enforces — owner on both
    // tiers, false for a comment/view grantee. One extra field off a request the page already
    // makes, not a new one.
    canEdit=!!s.can_edit;$('#editbtn').hidden=!canEdit;}catch(e){}
  await refreshDiffAvail();   // reveals the toggle if an earlier version exists; never opens it
  poll();
}
$('#difftoggle').onclick=()=>{
  if(EDITON)return;   // #291 mutual exclusion: the click handler is the real gate; CSS just says so
  DIFFON=!DIFFON;
  $('#difftoggle').classList.remove('hinted');   // acted on; stop advertising
  applyDiffMode();
};
boot();

// ---- Share control: public link (#133) + named-share people panel (#134), owner-only ----
// Copied verbatim from viewer.html so the latex viewer shows the same panel (#152 share-parity).
// Depends only on API/ID (defined above) + the #sharebtn/#sharepop topbar markup. Keep in sync.
let _shareCsrf = "", _pubRight = null, _shares = [];
function _esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// Grantee label: prefer the server-resolved email in the /shares payload; "" or absent means the
// account is genuinely unknown (#267), so show the opaque subject marked unresolved rather than
// dressing a raw provider:sub uid up as an address.
function _shareLabel(s){ if(s && s.email) return s.email; const raw=((s&&s.subject)||"").replace(/^user:/,""); return raw ? raw+" (unresolved)" : "(unknown)"; }
async function initShare(){
  const btn = document.getElementById("sharebtn"), pop = document.getElementById("sharepop");
  if(!btn) return;
  // Ownership gate: GET /shares → 200 (owner; carries public state + named shares) | 404 (not owner).
  let r; try{ r = await fetch(API + "/shares", {cache:"no-store"}); }catch(e){ return; }
  if(r.status !== 200) return;                        // not the owner → no Share control at all
  const d = await r.json().catch(()=>({}));
  _pubRight = d.public || null;                        // "view" or null
  _shares = d.shares || [];
  try{ _shareCsrf = ((await fetch("/auth/session",{cache:"no-store"}).then(x=>x.json())) || {}).csrf || ""; }catch(e){}
  btn.style.display = "";
  btn.addEventListener("click", e=>{ e.stopPropagation(); pop.hidden = !pop.hidden; if(!pop.hidden) renderShare(); });
  document.addEventListener("click", e=>{ if(!pop.hidden && !pop.contains(e.target) && e.target!==btn) pop.hidden = true; });
}
function shareUrl(){ return location.origin + "/review/" + encodeURIComponent(ID); }
async function refreshShares(){
  try{ const d = await fetch(API + "/shares",{cache:"no-store"}).then(r=>r.json()); _pubRight = d.public||null; _shares = d.shares||[]; }catch(e){}
}
function renderShare(){
  const pop = document.getElementById("sharepop"), on = !!_pubRight;
  const rows = _shares.length
    ? _shares.map(s=>'<div class="share-item"><span class="em" title="'+_esc(_shareLabel(s))+'">'+_esc(_shareLabel(s))+'</span><span class="rt">'+_esc(s.right)+'</span><button class="rm" type="button" data-subject="'+_esc(s.subject)+'" title="Remove access">&times;</button></div>').join("")
    : '<div class="share-empty">No one yet.</div>';
  pop.innerHTML =
    '<h3>Share this review</h3>' +
    '<div class="share-row"><div class="share-lbl">Public link<small>Anyone with the link can view</small></div>' +
    '<label class="switch"><input type="checkbox" id="pubtoggle"' + (on?" checked":"") + '><span class="track"></span></label></div>' +
    (on ? '<div class="share-link"><input id="publink" readonly value="' + shareUrl() + '"><button class="share-copy" id="pubcopy" type="button">Copy</button></div>' : '') +
    '<div class="share-sep"></div>' +
    '<div class="share-people"><h4>Share with people</h4>' +
    '<div class="share-list">' + rows + '</div>' +
    '<div class="share-invite"><input id="invemail" type="email" placeholder="email address" autocomplete="off">' +
    '<select id="invright"><option value="comment">Can comment</option><option value="view">Can view</option></select>' +
    '<button id="invbtn" type="button">Invite</button></div>' +
    '<div class="share-err" id="inverr" style="display:none"></div></div>';
  pop.querySelector("#pubtoggle").addEventListener("change", async e=>{
    const t = e.target; t.disabled = true;
    try{
      const rr = await fetch(API + "/public", {method: t.checked?"POST":"DELETE", headers:{"X-CSRF-Token":_shareCsrf}});
      if(rr.ok) _pubRight = t.checked ? "view" : null;
    }catch(e){}
    renderShare();
  });
  const cp = pop.querySelector("#pubcopy");
  // #213: this said "Copied" whether or not anything was copied. TWO defects, not one:
  //   1. writeText returns a PROMISE, so the try/catch only ever caught a synchronous throw. A
  //      rejected permission (the common real failure) sailed straight past it.
  //   2. "Copied" was set unconditionally on the next line regardless.
  // The result was a UI that confidently reported success while the clipboard was untouched, which
  // is worse than no feedback: the reader pastes a stale buffer somewhere else and blames that.
  // Follows the pattern #copysrc in this same file already uses: await, then say what happened.
  // A silent no-op on failure would not satisfy this ticket either — the failure must be VISIBLE.
  if(cp) cp.addEventListener("click", async ()=>{
    const i = pop.querySelector("#publink"); i.select();
    try{
      await navigator.clipboard.writeText(i.value);
      cp.textContent = "Copied";
      setTimeout(()=>{ cp.textContent = "Copy"; }, 1400);
    }catch(e){
      // Name the reason: "it didn't work" sends people to the wrong place. The link stays
      // selected above, so manual copy is still available and worth implying.
      cp.textContent = "Copy failed";
      toast('Copy failed — '+((e && e.name) ? e.name : 'clipboard unavailable')+'. The link is selected; copy it manually.');
      setTimeout(()=>{ cp.textContent = "Copy"; }, 2600);
    }
  });
  pop.querySelector("#invbtn").addEventListener("click", async ()=>{
    const email = (pop.querySelector("#invemail").value||"").trim();
    const right = pop.querySelector("#invright").value;
    const err = pop.querySelector("#inverr"); err.style.display = "none";
    if(!email){ pop.querySelector("#invemail").focus(); return; }
    const btn = pop.querySelector("#invbtn"); btn.disabled = true; btn.textContent = "…";
    let rr; try{ rr = await fetch(API + "/shares", {method:"POST", headers:{"Content-Type":"application/json","X-CSRF-Token":_shareCsrf}, body:JSON.stringify({email, right})}); }
    catch(e){ btn.disabled=false; btn.textContent="Invite"; return; }
    if(rr.ok){ await refreshShares(); renderShare(); }
    else{ const j = await rr.json().catch(()=>({})); err.textContent = j.error || "Could not share."; err.style.display = "block"; btn.disabled=false; btn.textContent="Invite"; }
  });
  pop.querySelectorAll(".rm").forEach(b=>b.addEventListener("click", async ()=>{
    b.disabled = true;
    try{ await fetch(API + "/shares?subject=" + encodeURIComponent(b.dataset.subject), {method:"DELETE", headers:{"X-CSRF-Token":_shareCsrf}}); }catch(e){}
    await refreshShares(); renderShare();
  }));
}
initShare();

// #222: same dispatcher as the markdown viewer, so the marginal cost here is the table itself.
mdKeys.pushEscape(()=>{const p=$('#pop');if(!p||p.style.display!=='block')return false;p.style.display='none';return true;});
mdKeys.register([
  {keys:"1", label:"Show the LaTeX source",   run:()=>mdKeys.click("#tab-src")},
  {keys:"2", label:"Show the compiled PDF",   run:()=>mdKeys.click("#tab-pdf")},
  {keys:"c", label:"Toggle the comments dock", run:()=>mdKeys.click("#cmtbtn")},
  {keys:"a", label:"Add a comment",            run:()=>mdKeys.click("#addbtn")},
  {keys:"mod+Enter", label:"Save the comment you are writing", keepInField:true, run:()=>{
    const pop=$('#pop');
    if(pop && pop.style.display==='block') return mdKeys.click("#popsave");
    return false;
  }},
]);

// ---- #291: edit mode — swap #srcscroll for a textarea over the .tex source. Save rides the same
// PUT /source the MCP path uses, widened by #288 (If-Match precondition) and #289 (session-keyed
// CSRF + reviewer attribution). Two DISTINCT server outcomes on a rejected save, per #188, and the
// UI must not conflate them: 400 = the write guard fired, NOTHING was written, buffer kept, show
// the _NOT_TEX text verbatim; 409 = the write guard passed but the revision was stale, ALSO nothing
// written, buffer kept, but the message is about the OTHER writer, not the content. A 200 that
// later fails to COMPILE is neither of these — the editor has already closed on the 200, and that
// failure surfaces through the existing #errbar / refreshPdf() poll, untouched by this feature.
function editErr(msg){const e=$('#editerr');e.textContent=msg;e.hidden=!msg;}
async function enterEdit(){
  if(!canEdit||EDITON)return;
  DIFFON=false;   // mutual exclusion: edit always wins, unconditionally
  let text,rev;
  try{
    const r=await fetch(API+'/source',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    text=await r.text();
    // The precondition token comes from THIS response, never a separate /status fetch — reading it
    // out of band is exactly the lost-update ordering #288 forbids.
    rev=(r.headers.get('ETag')||'').replace(/"/g,'');
  }catch(e){toast('Could not load the source for editing');return;}
  editRevision=rev;
  $('#edittext').value=text;
  editErr('');
  EDITON=true;
  syncDiffVisibility();
  $('#edittext').focus();
}
function exitEdit(){
  EDITON=false;
  editErr('');
  syncDiffVisibility();
}
$('#editbtn').addEventListener('click',enterEdit);
$('#editcancel').addEventListener('click',exitEdit);
$('#editsave').addEventListener('click',async()=>{
  const save=$('#editsave'),cancel=$('#editcancel'),markdown=$('#edittext').value;
  save.disabled=true;cancel.disabled=true;save.textContent='Saving…';editErr('');
  let csrf='';
  try{csrf=((await fetch('/auth/session',{cache:'no-store'}).then(r=>r.json()))||{}).csrf||'';}catch(e){}
  let r=null,body=null;
  try{
    r=await fetch(API+'/source',{method:'PUT',headers:{'Content-Type':'application/json',
      'If-Match':'"'+editRevision+'"','X-CSRF-Token':csrf,'X-Mdreview-Client':'viewer'},
      body:JSON.stringify({markdown:markdown})});
    body=await r.json().catch(()=>({}));
  }catch(e){
    save.disabled=false;cancel.disabled=false;save.textContent='Save';
    editErr('Save failed — network error. Your text below is unsaved.');
    return;
  }
  save.disabled=false;cancel.disabled=false;save.textContent='Save';
  if(r.status===200){
    // This write IS the source_updated change the poll would otherwise see as a REMOTE one —
    // seed lastSrc from the response so the next tick does not fire a false "Draft updated by AI"
    // toast over the reviewer's own save (mirrors boot()'s cursor-seeding comment above).
    lastSrc=body.source_updated||lastSrc;
    EDITON=false;editErr('');syncDiffVisibility();
    await loadSource();await refreshDiffAvail();refreshPdf();
    toast('Saved — recompiling…');
    return;
  }
  if(r.status===409){
    // AC: buffer preserved, editor stays open, explicit "changed by the agent" message — never
    // auto-reload, that would be this UI resending nothing while silently discarding the buffer.
    // The buffer below is untouched by THIS failure, but reopening Edit fetches the latest text
    // and REPLACES it (enterEdit always repopulates from the server) — so the warning has to say
    // that plainly, or "Cancel, reopen Edit, re-apply" reads as a safe sequence when it is really
    // "copy your text out first, or reopening will overwrite it".
    editErr('Changed by the agent since you opened the editor. Your text below is unsaved and '
      +'NOT yet lost — but reopening Edit will replace it with the latest version. Copy what you '
      +'want to keep, then Cancel and reopen Edit to see the latest and re-apply it.');
    return;
  }
  if(r.status===400){
    // AC 7a: the #188 guard rejected the body before anything was written. Show its text verbatim
    // (decorator.py's _NOT_TEX is written for exactly this reader) — never invent our own wording.
    editErr((body&&body.error)||'Rejected: not a valid LaTeX document. Nothing was saved.');
    return;
  }
  editErr('Save failed — HTTP '+r.status+'. Your text below is unsaved.');
});
mdKeys.pushEscape(()=>{if(!EDITON)return false;exitEdit();return true;});

// #250 Recompile. Honest, server-driven states (the #213 #pubcopy pattern: await, then say what
// happened). The in-progress label appears only after the POST returns 2xx; a refused POST names
// its reason and re-enables; queued/running is driven by st.state in refreshPdf(), never a client
// timer; and the poll NEVER posts — one explicit click is the only retry path (#250's whole point,
// preserving _self_heal's anti-stacking rule).
$('#recompilebtn').addEventListener('click', async ()=>{
  const b=$('#recompilebtn');
  b.disabled=true;                                   // instant, so a double-click cannot double-post
  let csrf='';
  try{ csrf=((await fetch('/auth/session',{cache:'no-store'}).then(r=>r.json()))||{}).csrf||''; }catch(e){}
  let r=null;
  try{ r=await fetch(LATEX+'/recompile',{method:'POST',headers:{'X-CSRF-Token':csrf}}); }catch(e){}
  if(!r || !r.ok){
    const why = r ? (r.status===401?'sign in required':r.status===404?'not available for this review'
                    :r.status===403?'session expired — reload':r.status===507?'server disk is full'
                    :'HTTP '+r.status) : 'network error';
    toast('Recompile failed — '+why+'. Nothing was queued.');
    b.textContent='Recompile'; b.disabled=false;     // never a fake in-progress state
    return;
  }
  b.textContent='Recompiling…';                       // only AFTER the server said 2xx
  refreshPdf();                                       // pick up queued/running immediately
});

// #dlbtn is deliberately unbound: it downloads a file, and a stray keystroke must not write to disk.
</script>
