<!DOCTYPE html>
<!-- MR-094 placeholder. MR-097 replaces this with the full Overleaf-style split viewer per the
     approved mockup (artifact b1132f25-daf3-43d8-ba92-d41655fb68d4). The pane ids (#srcpane,
     #pdfpane) and the API calls below are the contract MR-097 builds on. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdreview · latex</title>
<style>
  :root{--bg:#fafafc;--panel:#fff;--text:#181a20;--muted:#5c6270;--rule:#e6e7ee;--accent:#5b30d6;--canvas:#eceef3;}
  @media (prefers-color-scheme: dark){:root{--bg:#0f1014;--panel:#17181d;--text:#e9eaf0;--muted:#9a9fb0;--rule:#26282f;--accent:#b9a3f5;--canvas:#0b0c10;}}
  *{box-sizing:border-box;}
  body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;}
  header{flex:0 0 auto;display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--rule);}
  .fn{font-family:ui-monospace,Menlo,monospace;color:var(--accent);}
  .split{flex:1;display:flex;min-height:0;}
  #srcpane{flex:0 0 46%;overflow:auto;border-right:1px solid var(--rule);padding:12px 0;background:var(--bg);}
  #pdfpane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas);}
  #pdfpane .bar{flex:0 0 auto;padding:7px 14px;border-bottom:1px solid var(--rule);background:var(--bg);color:var(--muted);}
  #pdfframe{flex:1;border:0;width:100%;}
  .ln{display:flex;gap:12px;padding:1px 14px;font-family:ui-monospace,Menlo,monospace;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
  .ln .n{color:var(--muted);opacity:.5;min-width:36px;text-align:right;user-select:none;}
  .msg{padding:18px;color:var(--muted);}
</style>
</head>
<body>
<header><a href="/">&larr; Reviews</a><span class="fn" id="fn">latex</span></header>
<div class="split">
  <section id="srcpane"><div class="msg">Loading source…</div></section>
  <section id="pdfpane">
    <div class="bar" id="pdfbar">PDF</div>
    <iframe id="pdfframe" title="compiled PDF"></iframe>
  </section>
</div>
<script>
const ID=location.pathname.split('/').pop();
const API='/api/reviews/'+ID, LATEX='/api/latex/'+ID;
async function loadSource(){
  const t=await (await fetch(API+'/source',{cache:'no-store'})).text();
  const pane=document.getElementById('srcpane');pane.innerHTML='';
  t.split('\n').forEach((line,i)=>{
    const d=document.createElement('div');d.className='ln';d.id='L'+(i+1);
    d.innerHTML='<span class="n">'+(i+1)+'</span>';
    d.appendChild(document.createTextNode(line));pane.appendChild(d);
  });
}
async function loadPdf(){
  const bar=document.getElementById('pdfbar'),frame=document.getElementById('pdfframe');
  const r=await fetch(LATEX+'/compile',{cache:'no-store'});
  const st=r.ok?await r.json():null;
  if(st){bar.textContent='PDF · '+st.state+' (v'+st.revision+')';}
  const pr=await fetch(LATEX+'/pdf',{cache:'no-store'});
  if(pr.ok){frame.src=LATEX+'/pdf?t='+Date.now();}
  else{frame.removeAttribute('src');bar.textContent='PDF · no build yet'+(st&&st.log_tail?' — '+st.log_tail.slice(-200):'');}
}
loadSource();loadPdf();
setInterval(loadPdf,2000);
</script>
</body>
</html>
