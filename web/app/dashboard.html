<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdreview · reviews</title>
<style>
  /* Light palette = the mockup; dark derived via the existing token swap (no STALE_S here — the
     viewer is the authoritative staleness surface; a dashboard card never tests lease freshness). */
  :root{
    --bg:#fafafc;--panel:#fff;--text:#181a20;--muted:#5c6270;--muted2:#6e727e;
    --rule:#e6e7ee;--nav-active:#f0f1f6;--nav-hover:#f5f6f9;
    --violet:#5b30d6;--violet-bg:#eee9fd;--blue:#1d4fbf;--blue-bg:#e9f0fd;
    --green:#2f8f5b;--link:#2f6fed;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1014;--panel:#17181d;--text:#e9eaf0;--muted:#9a9fb0;--muted2:#878c9c;
      --rule:#26282f;--nav-active:#22242b;--nav-hover:#1d1f25;
      --violet:#b9a3f5;--violet-bg:#2a2147;--blue:#9cc0f5;--blue-bg:#16243f;
      --green:#6dd39b;--link:#7ba6f5;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}

  .app{display:flex;min-height:100vh;}

  /* ---- sidebar ---- */
  .side{flex:0 0 256px;width:256px;padding:24px 18px;display:flex;flex-direction:column;gap:24px;
    border-right:1px solid var(--rule);position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;letter-spacing:-.15px;}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#2f6fed,#7c4dff);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .nav-section{display:flex;flex-direction:column;gap:2px;}
  .nav-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted2);padding:0 10px 6px;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;
    color:var(--muted);font-size:13.5px;font-weight:500;border:none;background:none;width:100%;text-align:left;
    font-family:inherit;}
  .nav-item:hover{background:var(--nav-hover);}
  .nav-item.active{background:var(--nav-active);color:var(--text);font-weight:600;}
  .nav-item .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55;}
  .nav-item.active .dot{opacity:1;}
  .nav-item .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-item .ct{flex:0 0 auto;font-size:11.5px;font-weight:600;color:var(--muted2);}
  .nav-item.active .ct{color:var(--text);}
  .proj-empty{padding:2px 10px;color:var(--muted2);font-size:12px;}

  /* ---- main ---- */
  .main{flex:1 1 auto;min-width:0;padding:26px 32px 56px;}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 18px;}
  h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.4px;}
  .sub{margin:6px 0 0;color:var(--muted);font-size:13px;}
  #search{flex:0 0 280px;max-width:40vw;font:inherit;font-size:13.5px;padding:9px 13px;border-radius:10px;
    border:1px solid var(--rule);background:var(--panel);color:var(--text);}
  #search:focus{outline:none;border-color:var(--link);}

  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted2);margin:0 0 12px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;}

  .card{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:13px;
    border-left:3px solid var(--rule);transition:border-color .12s,box-shadow .12s,transform .06s;}
  .card:hover{box-shadow:0 4px 16px rgba(20,22,40,.08);transform:translateY(-1px);}
  .card.is-hidden{display:none;}
  .showmore{display:none;margin:18px auto 4px;padding:8px 18px;font:inherit;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--rule);border-radius:8px;cursor:pointer;}
  .showmore:hover{border-color:var(--muted2);}
  .proj-more{padding:6px 10px 2px;color:var(--muted2);font-size:11.5px;}
  .card.s-your-turn{border-left-color:var(--violet);}
  .card.s-agent-working,.card.s-waiting{border-left-color:var(--blue);}
  .card.s-resolved{border-left-color:var(--green);}
  .cardlink{display:flex;flex-direction:column;gap:10px;padding:15px 18px 13px 19px;color:inherit;
    text-decoration:none;cursor:pointer;}
  .crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted2);min-width:0;}
  .crumb .seg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .crumb .rev{margin-left:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;flex:0 0 auto;transition:opacity .12s;}
  .card:hover .crumb .rev{opacity:0;}   /* hide the version on hover so the delete button isn't on top of it */
  .card .title{font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.15px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:26px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .divider{height:1px;background:var(--rule);margin:1px 0 0;}
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px 3px 9px;
    font-size:12px;font-weight:600;}
  .badge .bdot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto;}
  .badge .bdot.ring{background:none;border:1.5px solid currentColor;width:8px;height:8px;}
  .badge.your-turn{background:var(--violet-bg);color:var(--violet);}
  .badge.agent-working{background:var(--blue-bg);color:var(--blue);}
  .badge.waiting{background:var(--blue-bg);color:var(--blue);}
  .badge.resolved{background:none;color:var(--muted);padding-left:0;}
  .date{font-size:11.5px;color:var(--muted2);flex:0 0 auto;}
  .countline{font-size:11.5px;color:var(--muted2);display:flex;align-items:center;gap:7px;}
  .countline .cdot{width:6px;height:6px;border-radius:50%;background:var(--muted2);flex:0 0 auto;}
  .card.s-your-turn .cdot{background:var(--violet);}
  .card.s-agent-working .cdot,.card.s-waiting .cdot{background:var(--blue);}
  .card.s-resolved .cdot{background:var(--green);}

  .del{position:absolute;top:11px;right:12px;display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;padding:0;border-radius:7px;border:1px solid transparent;background:transparent;
    color:var(--muted2);cursor:pointer;opacity:0;transition:opacity .12s,color .12s,background .12s;}
  .card:hover .del{opacity:1;}
  .del:hover{color:#c0392b;background:rgba(192,57,43,.12);}
  .del:focus-visible{opacity:1;outline:2px solid var(--link);outline-offset:1px;}

  .empty,.noresults{text-align:center;color:var(--muted);padding:64px 0;}
  .noresults{display:none;}
  .empty code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    background:rgba(127,127,127,.12);padding:2px 6px;border-radius:5px;}

  @media (max-width:720px){
    .app{flex-direction:column;}
    .side{flex-basis:auto;width:auto;height:auto;position:static;flex-direction:column;
      border-right:none;border-bottom:1px solid var(--rule);}
    .main{padding:20px 16px 48px;}
    h1{font-size:24px;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">md</span><span>mdreview</span></div>
    <nav class="nav-section" id="inbox">
      <div class="nav-label">Inbox</div>
      <button class="nav-item active" data-filter="all"><span class="dot"></span><span class="nm">All reviews</span><span class="ct" id="ct-all">0</span></button>
      <button class="nav-item" data-filter="needs"><span class="dot" style="color:var(--violet)"></span><span class="nm">Needs you</span><span class="ct" id="ct-needs">0</span></button>
      <button class="nav-item" data-filter="working"><span class="dot" style="color:var(--blue)"></span><span class="nm">Agent working</span><span class="ct" id="ct-working">0</span></button>
      <button class="nav-item" data-filter="resolved"><span class="dot" style="color:var(--green)"></span><span class="nm">Resolved</span><span class="ct" id="ct-resolved">0</span></button>
    </nav>
    <nav class="nav-section" id="projects">
      <div class="nav-label">Projects</div>
      <div id="projlist"></div>
    </nav>
  </aside>
  <main class="main">
    <div class="head">
      <div>
        <h1 id="h1">All reviews</h1>
        <p class="sub" id="sub">Loading…</p>
      </div>
      <input id="search" type="search" placeholder="Search reviews, projects…" autocomplete="off">
    </div>
    <div class="eyebrow" id="eyebrow">Recent activity</div>
    <div id="list" class="grid"></div>
    <button class="showmore" id="showmore">Show more</button>
    <div class="noresults" id="noresults">No reviews match your search.</div>
  </main>
</div>
<script>
const $=s=>document.querySelector(s);
const TRASH='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function rel(ts){
  if(!ts)return "";
  const s=Math.max(0,(Date.now()/1000)-ts);
  if(s<60)return "just now";
  const m=s/60; if(m<60)return Math.round(m)+"m ago";
  const h=m/60; if(h<24)return Math.round(h)+"h ago";
  const d=h/24; if(d<30)return Math.round(d)+"d ago";
  return new Date(ts*1000).toLocaleDateString();   // locale / Europe/London date fallback
}
// latest activity = newest of created / source_updated / feedback_updated
function activity(r){return Math.max(r.created||0, r.source_updated||0, r.feedback_updated||0);}

// Baton status badge — derived per row from turn + agent_status + status. NO STALE_S freshness test
// on the dashboard (epic D2/R1): the viewer is the authoritative staleness surface.
function statusOf(r){
  if(r.status==="resolved") return "resolved";
  const turn=r.turn||"reviewer";
  if(turn==="agent"){
    const as=r.agent_status;
    return (as && as.state==="working") ? "agent-working" : "waiting";
  }
  return "your-turn";   // turn==="reviewer" and not resolved
}
const BADGE={
  "your-turn":   {cls:"your-turn",   label:"Your turn",         dot:"<span class='bdot'></span>"},
  "agent-working":{cls:"agent-working",label:"Agent working",   dot:"<span class='bdot'></span>"},
  "waiting":     {cls:"waiting",     label:"Waiting for agent", dot:"<span class='bdot ring'></span>"},
  "resolved":    {cls:"resolved",    label:"Resolved",          dot:"<span class='bdot' style='background:var(--green)'></span>"},
};
function countLabel(r){
  const t=r.notes_total||0, a=r.notes_addressed||0;
  if(!t) return "no comments";
  const open=Math.max(0,t-a);
  if(r.status==="resolved" || open===0) return t+" resolved";
  return open+" open"+(a?" · "+a+" resolved":"");
}

function card(r){
  const st=statusOf(r);
  const b=BADGE[st];
  const t=esc(r.title||r.id), pr=esc(r.project||""), se=esc(r.session||""), pa=esc(r.source_path||"");
  const rev=(r.revision||0)>0?`<span class="rev">v${r.revision}</span>`:"";
  // crumb = project (or session fallback) on the left, revision on the right — matches the mockup
  // (the full source_path stays searchable via data-path, but the card stays clean).
  const lead=pr||se;
  const crumb=(lead||rev)?`<div class="crumb">${lead?`<span class="seg">${lead}</span>`:""}${rev}</div>`:"";
  return `<div class="card s-${st}" data-id="${esc(r.id)}" data-title="${t}" data-project="${pr}" data-path="${pa}" data-status="${st}">
    <a class="cardlink" href="/review/${encodeURIComponent(r.id)}">
      ${crumb}
      <div class="title">${t}</div>
      <div class="row">
        <span class="badge ${b.cls}">${b.dot}${b.label}</span>
        <span class="date">${rel(activity(r))}</span>
      </div>
      <div class="divider"></div>
      <div class="countline"><span class="cdot"></span>${countLabel(r)}</div>
    </a>
    <button class="del" data-id="${esc(r.id)}" data-title="${t}" aria-label="Delete ${t}">${TRASH}</button>
  </div>`;
}

let allReviews=[];
let activeFilter="all";       // all | needs | working | resolved | project:<name>
let shownCap=0;              // 0 ⇒ recompute to fit the viewport on the next applyFilter (no long scroll)
const PROJ_TOP=8;            // projects shown in the sidebar; the rest are reachable via the search box

async function load(){
  let data;
  try{ data=await fetch('/api/reviews',{cache:'no-store'}).then(r=>r.json()); }
  catch(e){ $("#sub").textContent="Could not reach the service."; return; }
  allReviews=(data&&data.reviews)||[];
  render();
}

// inbox predicates (epic D1) — client-side over the same rows the chip filter used
const INBOX={
  all:     ()=>true,
  needs:   r=>(r.turn||"reviewer")==="reviewer" && r.status!=="resolved",
  working: r=>(r.turn||"reviewer")==="agent",
  resolved:r=>r.status==="resolved",
};
function matchesFilter(r){
  if(activeFilter.startsWith("project:")) return (r.project||"")===activeFilter.slice(8);
  return (INBOX[activeFilter]||INBOX.all)(r);
}
function filterTitle(){
  // project filters only ever carry a non-empty project name (the Projects list is built from
  // distinct non-empty `project` values), so the slice is always the project label.
  if(activeFilter.startsWith("project:")) return activeFilter.slice(8);
  return {all:"All reviews",needs:"Needs you",working:"Agent working",resolved:"Resolved"}[activeFilter]||"All reviews";
}

function render(){
  // sidebar counts
  $("#ct-all").textContent=allReviews.length;
  $("#ct-needs").textContent=allReviews.filter(INBOX.needs).length;
  $("#ct-working").textContent=allReviews.filter(INBOX.working).length;
  $("#ct-resolved").textContent=allReviews.filter(INBOX.resolved).length;

  // projects list
  const byProj=new Map();
  for(const r of allReviews){ const p=r.project||""; if(p) byProj.set(p,(byProj.get(p)||0)+1); }
  // most active first, then show only the top N — the rest are found via the search box (no sidebar scroll)
  const projNames=[...byProj.keys()].sort((a,b)=>byProj.get(b)-byProj.get(a)||a.localeCompare(b));
  if(!projNames.length){
    $("#projlist").innerHTML = `<div class="proj-empty">No projects yet</div>`;
  }else{
    let h = projNames.slice(0,PROJ_TOP).map(p=>`<button class="nav-item" data-filter="project:${esc(p)}"><span class="dot"></span><span class="nm">${esc(p)}</span><span class="ct">${byProj.get(p)}</span></button>`).join("");
    const extra = projNames.length - PROJ_TOP;
    if(extra>0) h += `<div class="proj-more">+${extra} more · search to filter</div>`;
    $("#projlist").innerHTML = h;
  }

  // active nav highlight
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.filter===activeFilter));

  $("#h1").textContent=filterTitle();

  const list=$("#list");
  if(!allReviews.length){
    $("#sub").textContent="No reviews yet.";
    $("#eyebrow").style.display="none";
    list.classList.remove('grid');
    list.innerHTML=`<div class="empty">No reviews yet.<br><br>An agent creates one with <code>POST /api/reviews</code>.</div>`;
    return;
  }
  list.classList.add('grid');
  const sorted=allReviews.slice().sort((a,b)=>activity(b)-activity(a));
  list.innerHTML=sorted.map(card).join("");
  applyFilter();
}

// live filter over rendered cards: active inbox/project predicate + search text
// how many tiles fit above the fold: grid columns × rows that fit in the remaining viewport height.
// Keeps the first screen to a viewport-worth so "Show more" is in reach without a long scroll.
function viewportCap(){
  const list=$("#list");
  const top=Math.max(0, list.getBoundingClientRect().top);
  const gtc=getComputedStyle(list).gridTemplateColumns;
  const cols=(gtc && gtc!=='none') ? gtc.split(' ').filter(Boolean).length : 1;
  const vis=list.querySelector('.card:not(.is-hidden)');
  const ch=(vis && vis.offsetHeight) || 150;          // measured card height, else estimate
  const gap=14;
  const rows=Math.max(1, Math.floor((window.innerHeight - top - 24 + gap)/(ch + gap)));
  return Math.max(cols, cols*rows);
}
function applyFilter(){
  if(!shownCap) shownCap=viewportCap();               // (re)fit to the viewport when reset to 0
  const q=($("#search").value||"").toLowerCase().trim();
  const byId=new Map(allReviews.map(r=>[String(r.id),r]));
  let matched=0, shown=0;
  document.querySelectorAll('.card').forEach(c=>{
    const r=byId.get(c.dataset.id); if(!r) return;
    const hay=(c.dataset.title+" "+c.dataset.project+" "+c.dataset.path).toLowerCase();
    const ok = matchesFilter(r) && (!q || hay.includes(q));
    // matched = total passing the filter/search; displayed = the first `shownCap` of them (load-more)
    let disp=false;
    if(ok){ matched++; disp = matched<=shownCap; if(disp) shown++; }
    c.classList.toggle('is-hidden', !disp);
  });
  const projects=new Set(allReviews.filter(r=>r.project).map(r=>r.project)).size;
  $("#sub").textContent = `${matched} review${matched===1?"":"s"} · ${projects} project${projects===1?"":"s"}`;
  $("#eyebrow").style.display = matched ? "" : "none";
  $("#noresults").style.display=(allReviews.length && !matched)?"block":"none";
  // load-more control: visible only when matches exceed the current page cap
  const more=$("#showmore"), rem=matched-shown;
  if(more){ if(rem>0){ more.style.display="block"; more.textContent=`Show more (${rem})`; } else more.style.display="none"; }
}

document.addEventListener('click', async e=>{
  const del=e.target.closest('.del');
  if(del){
    e.preventDefault();
    if(!confirm(`Delete review "${del.dataset.title}"? This cannot be undone.`))return;
    await fetch('/api/reviews/'+encodeURIComponent(del.dataset.id),{method:'DELETE'}).catch(()=>{});
    load();
    return;
  }
  const sm=e.target.closest('#showmore');
  if(sm){ shownCap+=viewportCap(); applyFilter(); return; }   // reveal one more viewport of tiles
  if(e.target.closest('a'))return;                              // the tile is a link → opens the review
  const nav=e.target.closest('.nav-item');
  if(nav){ activeFilter=nav.dataset.filter; shownCap=0; render(); return; }   // new filter → refit viewport
});
$("#search").addEventListener('input', ()=>{ shownCap=0; applyFilter(); });   // new query → refit viewport
let _rz; window.addEventListener('resize', ()=>{ clearTimeout(_rz); _rz=setTimeout(()=>{ shownCap=Math.max(shownCap, viewportCap()); applyFilter(); }, 120); });   // grow to fill on resize
load();
</script>
</body>
</html>
