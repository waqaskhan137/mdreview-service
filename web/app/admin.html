<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdreview · admin</title>
<!-- #152 Basecoat: vendored (self-hosted, no runtime CDN) — Basecoat CSS, mdreview tokens, then the map. -->
<link rel="stylesheet" href="/static/basecoat.cdn.min.css">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/basecoat-theme.css">
<script src="/static/basecoat.all.min.js" defer></script>
<style>
  /* Layout + admin-specific bits only. Buttons/cards/inputs/table come from Basecoat now. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:940px;margin:0 auto;padding:40px 24px 80px;}
  .tophead{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{font-size:22px;margin:0 0 4px} .sub{color:var(--muted-fg);margin:0 0 24px} h2{font-size:15px;margin:8px 0 2px}
  .muted{color:var(--muted-fg)} .email{font-weight:500}
  .you{font-size:10px;color:var(--muted2);border:1px solid var(--rule);border-radius:var(--r-pill);padding:1px 7px;margin-left:7px}
  /* semantic role/status colours layered on Basecoat's .badge base */
  .badge.b-owner{background:var(--accent-bg);color:var(--brand);border-color:transparent}
  .badge.b-admin{background:var(--good-bg);color:var(--good);border-color:transparent}
  .badge.b-super{background:var(--warn-bg);color:var(--warn);border-color:transparent}
  .chip{font-size:11.5px;font-weight:600}
  .chip.active{color:var(--good)} .chip.banned{color:var(--danger)}
  .rowbanned td{opacity:.55}
  .acts{text-align:right;white-space:normal}
  .notice{text-align:center;color:var(--muted-fg);padding:52px 0}
  .notice b{color:var(--text);display:block;margin-bottom:6px;font-size:16px}
  /* Confirm bar. The flash bar is theme.css's shared `.flash` (#178); admin does not redeclare it. */
  #confirmbar{display:none;align-items:center;gap:10px;background:var(--warn-bg);border:1px solid var(--warn-rule);
    border-radius:var(--r-control);padding:11px 14px;margin:0 0 14px}
  #confirmbar .msg{flex:1}
  /* Row menu (#179). Basecoat positions [data-popover] `position:absolute` inside the relative
     .dropdown-menu, NOT in the top layer, so every scrolling/clipping ancestor between the menu
     and the page would cut it off: Basecoat's own `.card{overflow:hidden}` and `.table-container
     {overflow-x:auto}` (one axis non-visible forces the other to `auto`). Both are opened up HERE,
     scoped to the user card, rather than globally. The menu also sits in the right-aligned last
     column, so it is anchored to the trigger's right edge or it spills past the card. */
  #usercard{overflow:visible}
  #panel .table-container{overflow:visible}
  .acts .dropdown-menu>[data-popover]{left:auto;right:0}
  .acts [role=menu]{min-width:190px}
  .acts [role=menuitem],.acts [role=menuitemcheckbox]{font:inherit;background:none;border:0;text-align:left}
  .acts [data-indicator]{font-size:12px;line-height:1}
  /* Basecoat gives a toast paragraph `word-break:break-all`, which suits a long opaque token and
     mangles a sentence ("Undo within 10 se / conds"). Break on words; keep `anywhere` so a long
     address in the title still wraps rather than overflowing the 360px toast. */
  #toaster .toast-content section p{word-break:normal;overflow-wrap:anywhere}
  #toaster .toast-content section h2{overflow-wrap:anywhere}
  /* blocklist */
  .blockadd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .blockadd input#blockval{max-width:200px} .blockadd input#blocknote{flex:1;min-width:140px}
  .blockrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px}
  .blockrow:last-child{border-bottom:none}
  .blockrow .bv{font-weight:500}
  .blockrow .bk{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted2);
    border:1px solid var(--rule);border-radius:var(--r-pill);padding:1px 7px}
  .blockrow .bn{flex:1;color:var(--muted-fg)} .blockrow .brm{margin-left:auto}
  .blockempty{color:var(--muted-fg);padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="tophead">
    <a class="btn" data-variant="ghost" data-size="sm" href="/">&larr; reviews</a>
    <div id="acct"></div>
  </div>
  <h1>Admin</h1>
  <p class="sub">Manage the people on this mdreview instance.</p>
  <div id="confirmbar"><span class="msg"></span><button class="btn mini danger" data-variant="destructive" data-size="sm" id="cfy">Confirm</button><button class="btn mini" data-variant="outline" data-size="sm" id="cfn">Cancel</button></div>
  <div id="flash" class="flash" role="status" aria-live="polite"></div>
  <div class="card" id="usercard"><section><div id="panel" class="notice">Loading…</div></section></div>

  <div class="card" id="blockcard" style="display:none">
    <header>
      <h2>Blocklist</h2>
      <p>A blocked email or IP is refused at the sign-in link step.</p>
    </header>
    <section>
      <div id="blockpanel" class="blockempty">Loading…</div>
      <div class="blockadd">
        <input class="input" type="text" id="blockval" placeholder="email or IP" autocomplete="off">
        <select class="input" id="blockkind"><option value="email">Email</option><option value="ip">IP</option></select>
        <input class="input" type="text" id="blocknote" placeholder="note (optional)" autocomplete="off">
        <button class="btn" id="blockbtn" type="button">Block</button>
      </div>
    </section>
  </div>
</div>
<!-- Undo surface for the ban (#179). OUTSIDE .wrap and outside #panel: the `#panel .mini` re-bind at
     renderUsers() must never see a toast button. Basecoat's MutationObserver initialises it. -->
<div id="toaster" class="toaster" data-align="end"></div>

<!-- Before the inline block: boot() runs at parse time and needs window.mdSession. -->
<script src="/static/session.js"></script>
<script>
const $ = s => document.querySelector(s);
let ME = null, CSRF = "";
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(ts){ return ts ? new Date(ts*1000).toISOString().slice(0,10) : "-"; }
function notice(title, body){ return '<div class="notice"><b>'+esc(title)+'</b>'+esc(body||"")+'</div>'; }
// The base class stays on in every state: theme.css's shared `.flash` carries `display:none`, so
// clearing className outright would leave the bar permanently visible and unstyled.
function flash(msg, kind){ const f=$("#flash"); f.textContent=msg; f.className=kind?("flash "+kind):"flash";
  if(kind){ setTimeout(()=>{ f.className="flash"; }, 4000); } }

function askConfirm(msg, onYes){
  const bar=$("#confirmbar"); bar.querySelector(".msg").textContent=msg; bar.style.display="flex";
  bar.scrollIntoView({block:"center", behavior:"smooth"});   // the action may be far down (blocklist)
  $("#cfy").onclick=()=>{ bar.style.display="none"; onYes(); };
  $("#cfn").onclick=()=>{ bar.style.display="none"; };
}

async function boot(){
  // #221: loadUsers() below already separates "could not reach the service" from a real answer.
  // This did not, so a blip told an admin to sign in again while their session was alive.
  const res=await window.mdSession.read();
  if(!res.reachable){ $("#panel").innerHTML=notice("Could not reach the service.","You have not been signed out. Reload to retry."); return; }
  const s=res.sess;
  if(!s.authenticated){ $("#panel").innerHTML = '<div class="notice"><b>Sign in to continue</b><a href="/">Go to sign in &rarr;</a></div>'; return; }
  ME=s.uid; CSRF=s.csrf||"";
  $("#blockbtn").onclick=addBlock;
  loadUsers();
}
async function loadUsers(){
  let r; try{ r=await fetch("/admin/users",{cache:"no-store"}); }catch(e){ $("#panel").innerHTML=notice("Could not reach the service.",""); return; }
  if(r.status===403){ $("#panel").innerHTML=notice("You don't have admin access.","This area is for administrators."); return; }
  if(!r.ok){ $("#panel").innerHTML=notice("Could not load users.","Status "+r.status); return; }
  const d=await r.json(); renderUsers(d.users||[]); loadBlock();
}

function roles(u){
  const b=[];
  if(u.is_owner) b.push('<span class="badge b-owner">Owner</span>');
  if(u.is_admin) b.push('<span class="badge b-admin">Admin</span>');
  if(u.super_read) b.push('<span class="badge b-super">Super-read</span>');
  return b.length ? b.join("") : '<span class="muted">member</span>';
}
function statusChip(st){ return st==="banned" ? '<span class="chip banned">Banned</span>' : '<span class="chip active">Active</span>'; }
// act(action, label, value, danger) -> one menu item carrying its intent; uid/email added by the row.
// `text` is what the item reads on screen; `label` stays the sentence the flash and the confirm use.
// `checked` is null for a plain command and true/false for a role toggle, which renders it as a
// menuitemcheckbox so the CURRENT role is visible without opening anything else.
function act(action, label, value, danger, text, checked){
  return {action, label, value, danger, text:text||label, checked:(checked===undefined?null:checked)};
}
// Role and Ban belong to the same decision (§06), so one menu carries both, plus the two session
// levers, which have working endpoints and would otherwise be silently dropped.
//
// Role is TWO independent booleans server-side (is_admin, super_read), not a three-way choice: a
// user can hold both, and `:145` posts exactly one action per click. Member/Admin/Super-read as
// radios could therefore show two checked at once and could not demote a both-roles user in one
// POST, i.e. a control that half-applies. So Admin and Super-read are checkboxes and "Member" is
// simply the state where neither is checked, which `roles()` already prints in the Roles column.
//
// The isMe carve-outs mirror the server's self-lockout guards (adminroutes.py:123-128): an admin can
// neither ban themselves nor drop their own admin role, so those items are not offered.
function actionsFor(u){
  if(u.is_owner) return [];                       // the owner row is protected: no actions
  const isMe=u.uid===ME, banned=u.status==="banned";
  const role=[], sessions=[], access=[];
  if(!isMe) role.push(u.is_admin ? act("admin","Revoke admin",false,true,"Admin",true)
                                 : act("admin","Make admin",true,false,"Admin",false));
  role.push(u.super_read ? act("super-read","Revoke super-read",false,true,"Super-read",true)
                         : act("super-read","Grant super-read",true,false,"Super-read",false));
  sessions.push(act("revoke-tokens","Revoke tokens",true,true));
  sessions.push(act("revoke-sessions","Revoke sessions",true,true));
  if(!isMe) access.push(banned ? act("unban","Unban",true,false) : act("ban","Ban",true,true));
  return [{heading:"Role", items:role}, {items:sessions}, {items:access}];
}
function menuItem(u, x){
  const kind = x.checked===null ? "menuitem" : "menuitemcheckbox";
  // Only the commands are dressed destructive; a role checkbox must not turn red merely for being on.
  const variant = (x.danger && x.checked===null) ? ' data-variant="destructive"' : "";
  return '<button type="button" role="'+kind+'"'+(x.checked===null?"":' aria-checked="'+x.checked+'"')
    +' class="mini'+(x.danger?" danger":"")+'"'+variant
    +' data-action="'+x.action+'" data-value="'+x.value+'" data-uid="'+esc(u.uid)
    +'" data-email="'+esc(u.email)+'" data-label="'+esc(x.label)+'">'+esc(x.text)
    +(x.checked===null?"":'<span data-indicator aria-hidden="true">&check;</span>')+'</button>';
}
function rowMenu(u){
  const groups=actionsFor(u).filter(g=>g.items.length);
  if(!groups.length) return '<span class="muted">&mdash;</span>';   // the owner: nothing to arm
  const id="m-"+esc(u.uid);
  const body=groups.map(g=>(g.heading?'<div role="heading">'+esc(g.heading)+'</div>':"")
    +g.items.map(x=>menuItem(u,x)).join("")).join('<hr role="separator">');
  return '<div class="dropdown-menu">'
    +'<button type="button" class="btn" data-variant="outline" data-size="sm" aria-haspopup="menu"'
    +' aria-controls="'+id+'" id="t-'+id+'">Manage</button>'
    +'<div data-popover aria-hidden="true" id="'+id+'">'
    +'<div role="menu" aria-labelledby="t-'+id+'">'+body+'</div></div></div>';
}
function renderUsers(users){
  const rows = users.map(u=>{
    const acts = rowMenu(u);
    return '<tr'+(u.status==="banned"?' class="rowbanned"':'')+'>'
      +'<td class="email">'+esc(u.email)+(u.uid===ME?' <span class="you">you</span>':'')+'</td>'
      +'<td>'+statusChip(u.status)+'</td>'
      +'<td>'+roles(u)+'</td>'
      +'<td class="muted">'+fmt(u.created)+'</td>'
      +'<td class="acts">'+acts+'</td></tr>';
  }).join("");
  $("#panel").className=""; $("#panel").removeAttribute("style");
  $("#panel").innerHTML='<div class="table-container"><table class="table"><thead><tr><th>User</th><th>Status</th><th>Roles</th><th>Joined</th><th class="acts">Actions</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  document.querySelectorAll("#panel .mini").forEach(b=>b.addEventListener("click",()=>{
    const {action, uid, email, label} = b.dataset, value = b.dataset.value==="true";
    if(b.classList.contains("danger")) askConfirm(confirmCopy(action, email, label), ()=>doAction(action, uid, email, value, label));
    else doAction(action, uid, email, value, label);
  }));
}
// The undo window, stated once. The toast's lifetime and both sentences that quote it derive from
// this, so a UI that promises 10 seconds cannot be served by a toast that lives for 3.
const UNDO_MS=10000, UNDO_S=UNDO_MS/1000;
// What the operator is actually about to do. Ban says its blast radius, because "Ban sam@acme.io?"
// alone does not tell you whether the account's documents go with it.
//
// It does NOT quote a review count: /admin/users (users.py:116) returns none, and this slice may not
// change the API. A wrong or invented number is worse than no number.
function confirmCopy(action, email, label){
  if(action==="ban")
    return "Ban "+email+"? They lose access immediately: open sessions and API tokens stop working. "
         + "Their reviews are kept, and you can undo this for "+UNDO_S+" seconds.";
  return label+" for "+email+"?";
}
// After a ban, the undo IS the safety net: take it back without hunting for the row again.
function offerUndo(uid, email){
  const t=$("#toaster");
  if(!t || typeof t.toast!=="function") return;      // no toaster (bundle blocked): the ban still stands
  const el=t.toast({category:"warning", title:"Banned "+email,
                    description:"Access revoked. Undo within "+UNDO_S+" seconds.",
                    cancel:{label:"Undo"}, duration:UNDO_MS});
  const undo=el && el.querySelector("[data-toast-cancel]");
  // Routed through doAction so the unban carries the CSRF header and re-renders like any other action.
  if(undo) undo.addEventListener("click", ()=>doAction("unban", uid, email, true, "Unban"));
}
async function doAction(action, uid, email, value, label){
  let r; try{
    r=await fetch("/admin/users/"+encodeURIComponent(uid)+"/"+action,
      {method:"POST", headers:{"Content-Type":"application/json","X-CSRF-Token":CSRF}, body:JSON.stringify({value})});
  }catch(e){ flash("Network error.", "err"); loadUsers(); return; }
  if(r.ok){ flash(label+": "+email, "ok"); if(action==="ban") offerUndo(uid, email); loadUsers(); }
  // Re-render on failure too: Basecoat flips a menuitemcheckbox's aria-checked optimistically on
  // click, so without this a refused role change leaves a tick mark asserting a state that is false.
  else{ const j=await r.json().catch(()=>({})); flash((j.error||("Failed ("+r.status+")"))+": "+email, "err"); loadUsers(); }
}
// ---- Blocklist (#143): block an email or IP from the sign-in link step ----
async function loadBlock(){
  $("#blockcard").style.display="";
  let d; try{ d=await fetch("/admin/blocklist",{cache:"no-store"}).then(r=>r.json()); }catch(e){ return; }
  const items=(d&&d.blocklist)||[];
  $("#blockpanel").className = items.length ? "" : "blockempty";
  $("#blockpanel").innerHTML = items.length ? items.map(x=>
    '<div class="blockrow"><span class="bv">'+esc(x.value)+'</span><span class="bk">'+esc(x.kind)+'</span>'
    +'<span class="bn">'+esc(x.note||"")+'</span>'
    +'<button class="btn mini danger brm" data-variant="destructive" data-size="sm" data-value="'+esc(x.value)+'">Remove</button></div>').join("")
    : "Nothing blocked.";
  document.querySelectorAll("#blockpanel .brm").forEach(b=>b.addEventListener("click",()=>
    askConfirm("Unblock "+b.dataset.value+"?", ()=>removeBlock(b.dataset.value))));
}
async function addBlock(){
  const value=($("#blockval").value||"").trim(); if(!value) return;
  const kind=$("#blockkind").value, note=($("#blocknote").value||"").trim();
  const btn=$("#blockbtn"); btn.disabled=true;
  let r; try{ r=await fetch("/admin/blocklist",{method:"POST",
    headers:{"Content-Type":"application/json","X-CSRF-Token":CSRF}, body:JSON.stringify({value,kind,note})}); }
  catch(e){ btn.disabled=false; return; }
  btn.disabled=false;
  if(r.ok){ $("#blockval").value=""; $("#blocknote").value=""; flash("Blocked "+value,"ok"); loadBlock(); }
  else{ const j=await r.json().catch(()=>({})); flash(j.error||("Failed ("+r.status+")"),"err"); }
}
async function removeBlock(value){
  let r; try{ r=await fetch("/admin/blocklist/"+encodeURIComponent(value),{method:"DELETE",headers:{"X-CSRF-Token":CSRF}}); }
  catch(e){ return; }
  if(r.ok){ flash("Unblocked "+value,"ok"); loadBlock(); } else flash("Failed ("+r.status+")","err");
}
boot();
</script>
<script src="/static/account.js"></script>
</body>
</html>
