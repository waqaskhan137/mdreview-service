<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdreview · admin</title>
<style>
  :root{--bg:#0e0f13;--panel:#15171c;--text:#e7e9ee;--muted:#9aa0ac;--muted2:#6b7280;
        --rule:#262a33;--accent:#7c6cff;--danger:#c0392b;--good:#6dd39b;--warn:#e0b341;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:940px;margin:0 auto;padding:40px 24px 80px;}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  h1{font-size:22px;margin:0 0 4px} .sub{color:var(--muted);margin:0 0 24px}
  .tophead{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:6px 20px 14px;margin:12px 0}
  button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--rule);
         background:#20232b;color:var(--text);cursor:pointer}
  button:hover{border-color:var(--accent)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--rule);font-size:13px;vertical-align:middle}
  th{color:var(--muted2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  tr:last-child td{border-bottom:none}
  .muted{color:var(--muted)}
  .email{font-weight:500}
  .you{font-size:10px;color:var(--muted2);border:1px solid var(--rule);border-radius:20px;padding:1px 7px;margin-left:7px}
  .badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:20px;text-transform:uppercase;margin-right:4px}
  .b-owner{background:#2f2650;color:#c9b8ff} .b-admin{background:#123027;color:var(--good)} .b-super{background:#332815;color:var(--warn)}
  .chip{font-size:11.5px;font-weight:600}
  .chip.active{color:var(--good)} .chip.banned{color:#f0a0a0}
  .rowbanned td{opacity:.55}
  .acts{text-align:right;white-space:normal}
  button.mini{font-size:11.5px;padding:4px 10px;border-radius:7px;margin:2px 0 2px 5px}
  button.mini.danger{color:#f0a0a0;border-color:#4a2a2a}
  button.mini.danger:hover{background:#3a1f1f;border-color:var(--danger)}
  #confirmbar{display:none;align-items:center;gap:10px;background:#332815;border:1px solid #5a4a1f;
    border-radius:9px;padding:11px 14px;margin:0 0 14px}
  #confirmbar .msg{flex:1}
  #flash{display:none;padding:11px 14px;border-radius:9px;margin:0 0 14px;font-size:13px}
  #flash.err{display:block;background:#3a1f1f;border:1px solid #4a2a2a;color:#f0b4b4}
  #flash.ok{display:block;background:#123027;border:1px solid #1f4a38;color:var(--good)}
  .notice{text-align:center;color:var(--muted);padding:52px 0}
  .notice b{color:var(--text);display:block;margin-bottom:6px;font-size:16px}
  h2{font-size:15px;margin:8px 0 2px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .blockadd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .blockadd input[type=text],.blockadd select{font:inherit;padding:8px 10px;border-radius:8px;
    border:1px solid var(--rule);background:#0f1116;color:var(--text)}
  .blockadd input#blockval{width:200px} .blockadd input#blocknote{flex:1;min-width:140px}
  .blockrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px}
  .blockrow:last-child{border-bottom:none}
  .blockrow .bv{font-weight:500}
  .blockrow .bk{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted2);
    border:1px solid var(--rule);border-radius:20px;padding:1px 7px}
  .blockrow .bn{flex:1;color:var(--muted)} .blockrow .brm{margin-left:auto}
  .blockempty{color:var(--muted);padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="tophead">
    <p class="muted" style="margin:0"><a href="/">&larr; reviews</a></p>
    <div id="acct"></div>
  </div>
  <h1>Admin</h1>
  <p class="sub">Manage the people on this mdreview instance.</p>
  <div id="confirmbar"><span class="msg"></span><button class="mini danger" id="cfy">Confirm</button><button class="mini" id="cfn">Cancel</button></div>
  <div id="flash"></div>
  <div class="card"><div id="panel" class="notice">Loading…</div></div>

  <div class="card" id="blockcard" style="display:none">
    <h2 style="margin-top:2px">Blocklist</h2>
    <p class="sub" style="margin:0 0 4px">A blocked email or IP is refused at the sign-in link step.</p>
    <div id="blockpanel" class="blockempty">Loading…</div>
    <div class="blockadd">
      <input type="text" id="blockval" placeholder="email or IP" autocomplete="off">
      <select id="blockkind"><option value="email">Email</option><option value="ip">IP</option></select>
      <input type="text" id="blocknote" placeholder="note (optional)" autocomplete="off">
      <button class="primary" id="blockbtn" type="button">Block</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let ME = null, CSRF = "";
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(ts){ return ts ? new Date(ts*1000).toISOString().slice(0,10) : "-"; }
function notice(title, body){ return '<div class="notice"><b>'+esc(title)+'</b>'+esc(body||"")+'</div>'; }
function flash(msg, kind){ const f=$("#flash"); f.textContent=msg; f.className=kind; if(kind){ setTimeout(()=>{ f.className=""; }, 4000); } }

function askConfirm(msg, onYes){
  const bar=$("#confirmbar"); bar.querySelector(".msg").textContent=msg; bar.style.display="flex";
  bar.scrollIntoView({block:"center", behavior:"smooth"});   // the action may be far down (blocklist)
  $("#cfy").onclick=()=>{ bar.style.display="none"; onYes(); };
  $("#cfn").onclick=()=>{ bar.style.display="none"; };
}

async function boot(){
  let s={}; try{ s=await fetch("/auth/session",{cache:"no-store"}).then(r=>r.json()); }catch(e){}
  if(!s.authenticated){ $("#panel").innerHTML = '<div class="notice"><b>Sign in to continue</b><a href="/">Go to sign in &rarr;</a></div>'; return; }
  ME=s.uid; CSRF=s.csrf||"";
  $("#blockbtn").onclick=addBlock;
  loadUsers();
}
async function loadUsers(){
  let r; try{ r=await fetch("/admin/users",{cache:"no-store"}); }catch(e){ $("#panel").innerHTML=notice("Could not reach the service.",""); return; }
  if(r.status===403){ $("#panel").innerHTML=notice("You don't have admin access.","This area is for administrators."); return; }
  if(!r.ok){ $("#panel").innerHTML=notice("Could not load users.","Status "+r.status); return; }
  const d=await r.json(); renderUsers(d.users||[]); loadBlock();
}

function roles(u){
  const b=[];
  if(u.is_owner) b.push('<span class="badge b-owner">Owner</span>');
  if(u.is_admin) b.push('<span class="badge b-admin">Admin</span>');
  if(u.super_read) b.push('<span class="badge b-super">Super-read</span>');
  return b.length ? b.join("") : '<span class="muted">member</span>';
}
function statusChip(st){ return st==="banned" ? '<span class="chip banned">Banned</span>' : '<span class="chip active">Active</span>'; }
// act(action, label, value, danger) -> a button carrying its intent; uid/email added by the row.
function act(action, label, value, danger){
  return {action, label, value, danger};
}
function actionsFor(u){
  if(u.is_owner) return [];                       // the owner row is protected: no actions
  const isMe=u.uid===ME, banned=u.status==="banned", a=[];
  if(!isMe) a.push(banned ? act("unban","Unban",true,false) : act("ban","Ban",true,true));
  if(!isMe) a.push(u.is_admin ? act("admin","Revoke admin",false,true) : act("admin","Make admin",true,false));
  a.push(u.super_read ? act("super-read","Revoke super-read",false,true) : act("super-read","Grant super-read",true,false));
  a.push(act("revoke-tokens","Revoke tokens",true,true));
  a.push(act("revoke-sessions","Revoke sessions",true,true));
  return a;
}
function renderUsers(users){
  const rows = users.map(u=>{
    const acts = actionsFor(u).map(x=>
      '<button class="mini'+(x.danger?" danger":"")+'" data-action="'+x.action+'" data-value="'+x.value
      +'" data-uid="'+esc(u.uid)+'" data-email="'+esc(u.email)+'" data-label="'+esc(x.label)+'">'+esc(x.label)+'</button>').join("");
    return '<tr'+(u.status==="banned"?' class="rowbanned"':'')+'>'
      +'<td class="email">'+esc(u.email)+(u.uid===ME?' <span class="you">you</span>':'')+'</td>'
      +'<td>'+statusChip(u.status)+'</td>'
      +'<td>'+roles(u)+'</td>'
      +'<td class="muted">'+fmt(u.created)+'</td>'
      +'<td class="acts">'+(acts||'<span class="muted">&mdash;</span>')+'</td></tr>';
  }).join("");
  $("#panel").className=""; $("#panel").removeAttribute("style");
  $("#panel").innerHTML='<table><thead><tr><th>User</th><th>Status</th><th>Roles</th><th>Joined</th><th class="acts">Actions</th></tr></thead><tbody>'+rows+'</tbody></table>';
  document.querySelectorAll("#panel .mini").forEach(b=>b.addEventListener("click",()=>{
    const {action, uid, email, label} = b.dataset, value = b.dataset.value==="true";
    if(b.classList.contains("danger")) askConfirm(label+" — "+email+"?", ()=>doAction(action, uid, email, value, label));
    else doAction(action, uid, email, value, label);
  }));
}
async function doAction(action, uid, email, value, label){
  let r; try{
    r=await fetch("/admin/users/"+encodeURIComponent(uid)+"/"+action,
      {method:"POST", headers:{"Content-Type":"application/json","X-CSRF-Token":CSRF}, body:JSON.stringify({value})});
  }catch(e){ flash("Network error.", "err"); return; }
  if(r.ok){ flash(label+": "+email, "ok"); loadUsers(); }
  else{ const j=await r.json().catch(()=>({})); flash((j.error||("Failed ("+r.status+")"))+" — "+email, "err"); }
}
// ---- Blocklist (#143): block an email or IP from the sign-in link step ----
async function loadBlock(){
  $("#blockcard").style.display="";
  let d; try{ d=await fetch("/admin/blocklist",{cache:"no-store"}).then(r=>r.json()); }catch(e){ return; }
  const items=(d&&d.blocklist)||[];
  $("#blockpanel").className = items.length ? "" : "blockempty";
  $("#blockpanel").innerHTML = items.length ? items.map(x=>
    '<div class="blockrow"><span class="bv">'+esc(x.value)+'</span><span class="bk">'+esc(x.kind)+'</span>'
    +'<span class="bn">'+esc(x.note||"")+'</span>'
    +'<button class="mini danger brm" data-value="'+esc(x.value)+'">Remove</button></div>').join("")
    : "Nothing blocked.";
  document.querySelectorAll("#blockpanel .brm").forEach(b=>b.addEventListener("click",()=>
    askConfirm("Unblock "+b.dataset.value+"?", ()=>removeBlock(b.dataset.value))));
}
async function addBlock(){
  const value=($("#blockval").value||"").trim(); if(!value) return;
  const kind=$("#blockkind").value, note=($("#blocknote").value||"").trim();
  const btn=$("#blockbtn"); btn.disabled=true;
  let r; try{ r=await fetch("/admin/blocklist",{method:"POST",
    headers:{"Content-Type":"application/json","X-CSRF-Token":CSRF}, body:JSON.stringify({value,kind,note})}); }
  catch(e){ btn.disabled=false; return; }
  btn.disabled=false;
  if(r.ok){ $("#blockval").value=""; $("#blocknote").value=""; flash("Blocked "+value,"ok"); loadBlock(); }
  else{ const j=await r.json().catch(()=>({})); flash(j.error||("Failed ("+r.status+")"),"err"); }
}
async function removeBlock(value){
  let r; try{ r=await fetch("/admin/blocklist/"+encodeURIComponent(value),{method:"DELETE",headers:{"X-CSRF-Token":CSRF}}); }
  catch(e){ return; }
  if(r.ok){ flash("Unblocked "+value,"ok"); loadBlock(); } else flash("Failed ("+r.status+")","err");
}
boot();
</script>
<script src="/static/account.js"></script>
</body>
</html>
