services:
  mdreview:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: mdreview-service:latest
    container_name: mdreview
    ports:
      - "8137:8080"            # host 8137 -> container 8080
    volumes:
      - mdreview-data:/data     # feedback/source persist across restarts
    restart: unless-stopped
    environment:
      # Set this if the service is reached via a fixed external URL, so review_url
      # is correct regardless of the Host header. Leave empty for local use.
      MDREVIEW_PUBLIC_BASE: ""

  # The opt-in watcher (agent auto-runner) is SHELVED. Its compose service and the
  # `make watcher` target were removed; the code stays under src/watcher/ (+ src/watch.py,
  # infra/Dockerfile.watcher, infra/watcher/). Revive by restoring this service block and
  # the make target (see git history), then follow the README watcher runbook.

volumes:
  mdreview-data:
