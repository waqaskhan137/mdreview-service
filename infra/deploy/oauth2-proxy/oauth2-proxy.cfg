# oauth2-proxy config for mdreview (Phase 1). Google provider; membership = the authenticated-emails
# file (the invite allowlist, multi-user). Secrets (client id/secret, cookie secret) come from env
# via .env, NEVER this committed file. See RUNBOOK-phase1.md.

provider = "google"

# Run as an auth ORACLE only: nginx does the real proxying, this just answers /oauth2/auth (202/401)
# and serves /oauth2/{start,callback,sign_out}. static://202 = "authed" response with no upstream.
upstreams = [ "static://202" ]

# Emit identity on the auth_request response; nginx captures these via auth_request_set and passes
# the user (X-Auth-Request-*) to the app on the cookie plane.
set_xauthrequest = true

# The invite list = the entire membership. No self-signup exists.
# CRITICAL: do NOT set email_domains. oauth2-proxy ORs the domain rule with the emails file, and
# email_domains=["*"] means allow-all, which makes the allowlist decorative (ANY Google account is
# admitted). With email_domains unset, ONLY the exact emails in this file are admitted.
authenticated_emails_file = "/etc/oauth2-proxy/invited-emails.txt"

# nginx terminates TLS and is the trusted front.
reverse_proxy = true
http_address = "0.0.0.0:4180"

# Must match the Authorized redirect URI registered on the Google OAuth client.
redirect_url = "https://app.mdreview.space/oauth2/callback"
# Single canonical domain (owner decision 2026-07-22): app.mdreview.space ONLY. REQUIRED — without it
# oauth2-proxy rejects the post-auth return redirect ("domain / port not in whitelist") and every
# sign-in loops (issue #69/#86). The old app.waqasrana.space host 301-redirects here (see nginx/).
whitelist_domains = [ "app.mdreview.space" ]

# Session cookie: Secure + Lax. Strict breaks the provider callback redirect. Lax also blocks
# cross-site state-changing requests (a CSRF belt for the cookie plane).
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "168h"
cookie_refresh = "1h"
