# app.waqasrana.space — RETIRED 2026-07-22 (owner decision: single canonical domain = app.mdreview.space).
# This vhost is now a pure 301 redirector to the canonical host (issues #69/#86). Redirecting the WHOLE
# URL (incl. $request_uri) means an old deep link like https://app.waqasrana.space/review/<id> lands on
# https://app.mdreview.space/review/<id> — so no app.waqasrana.space `rd` ever reaches oauth2-proxy to be
# rejected as "domain / port not in whitelist". Keep the acme-challenge location so the cert can renew
# and the 443 redirect keeps terminating TLS. Reversible: restore the prior Phase-1 vhost from git history.
server {
    listen 80;
    listen [::]:80;
    server_name app.waqasrana.space;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://app.mdreview.space$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.waqasrana.space;
    ssl_certificate     /etc/letsencrypt/live/app.waqasrana.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.waqasrana.space/privkey.pem;
    location / { return 301 https://app.mdreview.space$request_uri; }
}
