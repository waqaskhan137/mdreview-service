# Phase 1 vhost for app.waqasrana.space on the Kapture host nginx. TWO auth planes:
#   - browser: oauth2-proxy cookie (auth_request); the vouched identity is passed to the app with a
#     shared proxy secret so the app trusts it.
#   - agent:   Authorization: Bearer <token>; nginx just passes it through, the APP validates it.
# TLS via certbot `certonly --webroot` (hand-authored; do NOT run `certbot --nginx`, it rewrites this).
# Install: copy to sites-available + symlink; copy snippets/mdreview-blank-identity.conf to
# /etc/nginx/snippets/; create the host-only /etc/nginx/snippets/mdreview-proxy-secret.conf from the
# .example (with the real MDREVIEW_PROXY_SECRET); then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name app.waqasrana.space;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` is portable to older nginx (Kapture runs 1.24, where the modern `http2 on;`
    # directive is unavailable). It only warns on nginx >= 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.waqasrana.space;

    ssl_certificate     /etc/letsencrypt/live/app.waqasrana.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.waqasrana.space/privkey.pem;

    # Asset uploads (base64 images) share the API location, so cap at 25m here; the app also enforces
    # MDREVIEW_MAX_BODY (32m backstop) + a disk-space floor on writes.
    client_max_body_size 25m;

    # Rate + connection caps (zones in conf.d/mdreview-limits.conf). Bounds a bearer/token flood and
    # long-poll connection exhaustion per client IP.
    limit_req  zone=mdreview_req burst=40 nodelay;
    limit_conn mdreview_conn 40;

    # Host-only include (NOT in git): `set $mdr_proxy_secret "<MDREVIEW_PROXY_SECRET from .env>";`
    # The shared secret proving a vouched identity header came through nginx. Create it with 600
    # perms from mdreview-proxy-secret.conf.example; see RUNBOOK-phase1.
    include snippets/mdreview-proxy-secret.conf;

    # ---- open routes (no identity needed): uptime probe + public vendored assets ----
    # Blank client-supplied identity here too (these routes never read it, but keep the boundary uniform).
    location = /healthz {
        include snippets/mdreview-blank-identity.conf;
        proxy_pass http://127.0.0.1:8140;
    }
    location /static/ {
        include snippets/mdreview-blank-identity.conf;
        proxy_pass http://127.0.0.1:8140;
    }

    # ---- oauth2-proxy endpoints (sign-in page, provider callback, sign-out) ----
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4181;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ---- the auth_request oracle: /oauth2/auth returns 202 (authed) or 401 (not) ----
    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4181;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length   "";
        proxy_pass_request_body off;
    }

    # ---- app routes: cookie plane (browser) OR bearer plane (agent) ----
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @maybe_bearer;      # no cookie -> try a Bearer token, else send to sign-in

        # Cookie plane succeeded: vouch the identity oauth2-proxy returned. Blank any client-supplied
        # copies FIRST (the include; proxy_set_header does NOT inherit across levels), then set the
        # trusted values captured from the auth subrequest + the shared proxy secret.
        auth_request_set $mdr_email $upstream_http_x_auth_request_email;
        auth_request_set $mdr_user  $upstream_http_x_auth_request_user;
        include snippets/mdreview-blank-identity.conf;
        proxy_set_header X-Auth-Request-Email $mdr_email;
        proxy_set_header X-Auth-Request-User  $mdr_user;
        proxy_set_header X-Mdreview-Provider  google;
        proxy_set_header X-Mdreview-Proxy     $mdr_proxy_secret;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;              # exceed the app /wait long-poll bound (25s)
        proxy_pass http://127.0.0.1:8140;
    }

    # No valid cookie. An agent carries a Bearer token: blank ALL identity + the proxy secret (so a
    # forged header can never ride the token path), pass Authorization through, let the APP validate.
    # A plain browser (no cookie, no token) is sent to sign in.
    location @maybe_bearer {
        if ($http_authorization !~* "^Bearer ") {
            return 302 https://app.waqasrana.space/oauth2/start?rd=https://app.waqasrana.space$request_uri;
        }
        include snippets/mdreview-blank-identity.conf;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8140;
    }
}
