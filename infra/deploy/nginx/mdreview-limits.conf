# mdreview rate/connection-limit zones. Install to /etc/nginx/conf.d/ (http context) so the zones
# exist before app.waqasrana.space's server block references them. Keyed on the client IP (the app
# subdomain is DNS-only / grey-cloud, so $binary_remote_addr is the real client).
limit_req_zone  $binary_remote_addr zone=mdreview_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=mdreview_conn:10m;
