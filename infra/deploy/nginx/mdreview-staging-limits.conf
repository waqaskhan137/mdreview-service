# Staging rate/connection-limit zones — DISTINCT zone names from prod's mdreview-limits.conf so both
# can be loaded in the same nginx http context. limit_req_zone is http-context (it can't live inside a
# server block), and a duplicate zone name breaks `nginx -t` — which would wedge the reload for BOTH
# the prod and staging vhosts. Install to /etc/nginx/conf.d/. Keyed on the client IP.
limit_req_zone  $binary_remote_addr zone=mdreview_staging_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=mdreview_staging_conn:10m;
