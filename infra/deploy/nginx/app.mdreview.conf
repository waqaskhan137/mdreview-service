# Phase 0 vhost for app.mdreview.waqasrana.space on the Kapture host nginx.
# Gates EVERY path (including /api) behind oauth2-proxy via auth_request. No bearer exception:
# per-user token auth arrives in Phase 1. TLS via certbot `certonly --webroot` (this file is
# hand-authored, so do NOT run `certbot --nginx`, which would rewrite it).
#
# Install: copy to /etc/nginx/sites-available/app.mdreview.waqasrana.space, symlink into
# sites-enabled, copy the snippet to /etc/nginx/snippets/, then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name app.mdreview.waqasrana.space;

    # certbot http-01 challenge lives here; everything else is redirected to https.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` is portable to older nginx; on nginx >= 1.25.1 it warns, and the modern
    # form is `listen 443 ssl;` + a separate `http2 on;`. Kept portable on purpose.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.mdreview.waqasrana.space;

    ssl_certificate     /etc/letsencrypt/live/app.mdreview.waqasrana.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.mdreview.waqasrana.space/privkey.pem;

    # Body cap ships the moment the API is reachable (the assets route gets a larger cap in Phase 1).
    client_max_body_size 1m;

    # ---- oauth2-proxy endpoints (sign-in page, provider callback, sign-out) ----
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ---- the auth_request oracle: /oauth2/auth returns 202 (authed) or 401 (not) ----
    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The oracle needs no body and should not forward a large one.
        proxy_set_header Content-Length   "";
        proxy_pass_request_body off;
    }

    # ---- everything else: require auth, then proxy to the app (Phase 0 gates ALL paths) ----
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;

        # Strip any client-supplied identity headers IN THIS location. nginx proxy_set_header does
        # NOT inherit across levels, so this must be include-d in every app-facing location block;
        # server-level blanking alone silently fails here.
        include snippets/mdreview-blank-identity.conf;

        # Phase 1 will add here (same block): capture identity from the auth subrequest via
        # auth_request_set, set X-Auth-Request-*, the X-Mdreview-Proxy shared secret, and the
        # per-provider X-Mdreview-Provider tag. Phase 0 needs none of it (the app has no auth code).

        proxy_pass       http://127.0.0.1:8140;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Must exceed the app's /wait long-poll bound (MDREVIEW_WAIT_TIMEOUT_S, default 25s).
        proxy_read_timeout 60s;
    }

    # Send an unauthenticated browser to sign in, preserving the original destination.
    # Hardcode the canonical origin (do NOT reflect $host) so this can never be an open redirect
    # if this vhost ever becomes the default_server.
    location @oauth2_signin {
        return 302 https://app.mdreview.waqasrana.space/oauth2/start?rd=https://app.mdreview.waqasrana.space$request_uri;
    }
}
