# Staging vhost for staging.mdreview.space on the Kapture host nginx. Authored FRESH for the NATIVE
# hosted plane — deliberately NOT a copy of app.mdreview.space.conf:
#   - NO /oauth2/*, NO auth_request, NO proxy-identity header. The app owns its own magic-link session
#     (MDREVIEW_ALLOW_PROXY_PLANE=0), so there is nothing to proxy to oauth2-proxy and no spoofable
#     X-Mdreview-Proxy / X-Auth-Request-* header to strip (the app never reads them with the plane off).
#   - Its OWN rate-limit zones (conf.d/mdreview-staging-limits.conf) so it shares no limit_req_zone with
#     prod — a duplicate zone would break `nginx -t` and wedge BOTH stacks' reloads.
# TLS via certbot `certonly --webroot` (hand-authored; do NOT run `certbot --nginx`, it rewrites this).
# Install: copy to sites-available + symlink; copy nginx/mdreview-staging-limits.conf to /etc/nginx/conf.d/;
# then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name staging.mdreview.space;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.mdreview.space;

    ssl_certificate     /etc/letsencrypt/live/staging.mdreview.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.mdreview.space/privkey.pem;

    client_max_body_size 25m;
    limit_req  zone=mdreview_staging_req burst=40 nodelay;   # zones in conf.d/mdreview-staging-limits.conf
    limit_conn mdreview_staging_conn 40;

    # Single ingress: the app enforces custody (owner-only writes, share/public reads, admin super-read)
    # and serves its own /auth/ login. nginx just proxies everything to the hosted app on 8141.
    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;            # exceed the app /wait long-poll bound (25s)
        proxy_pass http://127.0.0.1:8141;
    }
}
