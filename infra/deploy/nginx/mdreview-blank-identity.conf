# Blank client-supplied identity headers so nothing can forge an authenticated identity to the app.
# INCLUDE THIS INSIDE EVERY app-facing location block: nginx `proxy_set_header` does not inherit
# across levels, so the moment a location sets any header, all server/http-level ones are dropped
# for that location. Server-level blanking alone silently fails and a forged hyphenated header
# (forwarded by default) rides straight through. Install to /etc/nginx/snippets/.
proxy_set_header X-Auth-Request-User              "";
proxy_set_header X-Auth-Request-Email             "";
proxy_set_header X-Auth-Request-Preferred-Username "";
proxy_set_header X-Auth-Request-Groups            "";
proxy_set_header X-Mdreview-Proxy                 "";
proxy_set_header X-Mdreview-Provider              "";
