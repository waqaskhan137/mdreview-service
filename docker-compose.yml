services:
  mdreview:
    build: .
    image: mdreview-service:latest
    container_name: mdreview
    ports:
      - "8137:8080"            # host 8137 -> container 8080
    volumes:
      - mdreview-data:/data     # feedback/source persist across restarts
    restart: unless-stopped
    environment:
      # Set this if the service is reached via a fixed external URL, so review_url
      # is correct regardless of the Host header. Leave empty for local use.
      MDREVIEW_PUBLIC_BASE: ""

  # Opt-in agent runner (MR-071 / #30). OFF by default — only started with `--profile watcher`.
  # Authenticated by the operator's Claude SUBSCRIPTION: put a `claude setup-token` value in a
  # gitignored `.env` (CLAUDE_CODE_OAUTH_TOKEN=…); see the README watcher runbook. LOCAL single-user
  # use only — it auto-actions every Sent review (WATCH_ARMED_FILE is the per-review opt-in escape).
  watcher:
    build:
      context: .
      dockerfile: Dockerfile.watcher
    image: mdreview-watcher:latest
    profiles: ["watcher"]
    depends_on:
      mdreview:
        condition: service_healthy     # wait for the service's HEALTHCHECK, not just start-order
    restart: unless-stopped
    environment:
      MDREVIEW_BASE: "http://mdreview:8080"
      WATCH_TRUSTED_BASE: "http://mdreview:8080"   # exact-match vouch for the non-loopback service host
      WATCH_LAUNCH_CMD: '["bash","/app/watcher/launch.sh"]'
      # Subscription token from .env (compose auto-interpolates). Empty is allowed so `up`/`config`
      # work without it; the agent only fails (401) at spawn time if it is unset/invalid.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"

volumes:
  mdreview-data:
