name: Deploy landing page to Pages

# Single source of truth: web/site/ lives on main; this Action publishes it to GitHub Pages.
# No gh-pages branch, no local worktree — edit web/site/, push to main, it deploys.
#
# web/site/releases/index.html is the one exception to "web/site/ IS the site": it does not
# exist in git at all (#373). It is GENERATED here, into the checkout, on every run, from the
# GitHub Releases API (scripts/gen_releases_page.py) — never committed back. Two reasons, not
# one: `main` requires signed commits (branch protection, required_signatures), which would make
# a bot commit here awkward for no benefit; and generating fresh every deploy means there is no
# committed file for a person or a future change to quietly hand-edit and let drift from the API
# again, which is the exact failure this issue reports (page stuck at v0.2.0 while prod ran
# v0.5.3, flagged once at v0.4.0 and not fixed). `release: published` is a new trigger below
# specifically so tagging + creating a Release (release.yml) republishes the site without anyone
# remembering to — the third of the three links #373 found broken.
on:
  push:
    branches: [main]
    paths:
      - 'web/site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/gen_releases_page.py'
      - 'scripts/releases_page_tripwire.py'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let an in-flight run finish (don't cancel a publish)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # #373: render web/site/releases/index.html from the live Releases API into this run's
      # checkout (see the file header for why this is never committed). --dump-json snapshots
      # the exact release list this run rendered from, so the tripwire step below checks the
      # page against the SAME data, not a re-fetch that could race a release landing in between.
      - name: Generate the releases page from GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/gen_releases_page.py web/site/releases/index.html \
            --repo "${{ github.repository }}" \
            --dump-json /tmp/releases-snapshot.json

      # #373's tripwire: fail the deploy, loudly, if the newest release did not make it onto the
      # page the previous step just generated — rather than publish a stale page and rely on
      # someone noticing (twice already, per the ticket). Exit code is the signal; a nonzero exit
      # here fails this job before upload-pages-artifact/deploy-pages ever runs.
      - name: Verify the newest release is represented (tripwire)
        run: |
          python3 scripts/releases_page_tripwire.py /tmp/releases-snapshot.json \
            web/site/releases/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site      # the static site dir: index.html + CNAME + the just-generated releases/
      - id: deployment
        uses: actions/deploy-pages@v4
