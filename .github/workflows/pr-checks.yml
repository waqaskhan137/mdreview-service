name: pr-checks

# Pre-merge gate for `dev`. Agents self-merge their own PRs (docs/process/README.md, Branching),
# so this is the check standing where the second-party look used to. Deliberately a SEPARATE
# workflow from staging-image.yml rather than a trigger added to it: `on:` is workflow-level, so
# a pull_request trigger there would also run that workflow's `image` job (`needs:` is a
# dependency, not a filter) and publish the PR head as `:dev` — which the staging timer adopts
# within 15 minutes. It would also join that workflow's static `cancel-in-progress` group and
# cancel in-flight `dev` builds.
#
# Both smokes are stdlib-only and build their env inline: no repo secret, no Docker, no host.
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job KEY is the status-check context name (not the workflow name), so this is what to list
  # if `pr-checks` is ever made a required status check on `dev`.
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Guards this file's own safety invariants: no packages scope, no image push, job key
      # unchanged. It runs on the PR head, so a PR that breaks them fails before it can merge.
      - name: pr-checks guard
        run: python3 tests/pr_checks_guard.py

      - name: Hosted boot smoke
        run: python3 tests/hosted_boot_smoke.py

      - name: Custody regression smoke
        run: python3 tests/custody_regression_smoke.py

      # #266: CSRF on the /account/tokens write arms — cookie plane 403s without the per-session
      # token; the proxy and bearer planes pass unchanged. Stdlib-only, boots its own server.
      - name: Account tokens CSRF selfcheck
        run: python3 tests/account_tokens_csrf_selfcheck.py

      - name: Manual resolve smoke
        run: python3 tests/manual_resolve_smoke.py

      # #144: GET /admin/audit — cookie-plane-admin gate, newest-first, limit + before cursor,
      # raw fields (the stated policy). Stdlib-only, boots its own server.
      - name: Admin audit read selfcheck
        run: python3 tests/admin_audit_selfcheck.py

      # #288: the edit-precondition seam — revision ETag/If-Match + MCP expected_revision 409
      # on stale, no-break when omitted; can_edit on /status; the widened latex override.
      # Stdlib-only, boots its own local + hosted instances.
      - name: Revision precondition selfcheck
        run: python3 tests/revision_precondition_selfcheck.py

      # #289: session-keyed CSRF on PUT /source (verified session 403s without the token; proxy
      # and bearer planes pass unchanged) + the source_updated_by attribution lifecycle
      # (reviewer sets, agent deletes, readers default) + round.json "by". Stdlib-only, boots
      # its own local + hosted instances.
      - name: Source CSRF + attribution selfcheck
        run: python3 tests/source_csrf_attribution_selfcheck.py

      # #267: GET /api/reviews/{id}/shares resolves `email` per named share; a resolvable subject
      # yields the address, an unresolvable one yields "". Stdlib-only, boots its own server.
      - name: Review shares email selfcheck
        run: python3 tests/review_shares_email_selfcheck.py
