name: staging-image

# Every push to dev builds + pushes the :dev service image to GHCR, which the Kapture staging stack's
# auto-update timer then pulls and health-gates. Boot-smoke-gated: a dev push that would crash-loop
# staging (e.g. a config.py guard change vs the hosted env) fails here and never publishes :dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:

# A burst of dev pushes builds the newest commit once; older in-flight runs cancel.
concurrency:
  group: staging-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write          # push the :dev image to GHCR

jobs:
  boot-smoke:
    # Runs with the EXACT staging env (REQUIRE_AUTH=1, ALLOW_PROXY_PLANE=0, inert PROXY_SECRET) — the
    # only check that does, so the R2-NEW crash-loop can't regress unnoticed. Stdlib-only, no deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hosted boot smoke
        run: python3 tests/hosted_boot_smoke.py

      # #115: the executable check #97 lacked. Gates the image build, so a change that reopens the
      # custody failure class (fail-open default, or a returning bulk owner-stamp) cannot ship.
      - name: Custody regression smoke
        run: python3 tests/custody_regression_smoke.py

  image:
    needs: boot-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: docker/setup-buildx-action@v3

      # Slim image (latex-free) — staging runs the hosted plane with LaTeX off. amd64 only: Kapture is
      # x86 and every dev push builds this, so we skip the slow arm64 emulation prod's release does.
      - name: Build + push the staging service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mdreview-service:dev
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
