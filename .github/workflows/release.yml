name: release

# Tag-driven release: build and push the service + watcher Docker images to GHCR.
# RELEASES ONLY FROM main: a v* tag must point at a commit on main, or the job refuses (the guard
# step below). So the flow is: land on main (the dev->main PR), then tag main:
#   git checkout main && git pull && git tag v1.0.0 && git push origin v1.0.0
# (or run manually via workflow_dispatch from main).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v0.0.1)'
        required: true

permissions:
  packages: write          # push the Docker images to GHCR
  contents: write          # create the GitHub Release for the tag (#373)

jobs:
  docker:
    # Publish the server + watcher images to GHCR so they appear under the repo's Packages. Main-only.
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce release from main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${VERSION} is not on main; releases must be tagged from main."
            exit 1
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build + push the service image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mdreview-service:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/mdreview-service:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build + push the watcher image (amd64, node+claude is slow under arm64 emulation)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.watcher
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mdreview-watcher:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/mdreview-watcher:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build + push the latex service image (amd64; separate package keeps the slim image + prod :latest untouched)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.latex
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mdreview-service-latex:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/mdreview-service-latex:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # #373: the tag -> GitHub Release link. Everything downstream (the public releases page,
      # republishing it) derives from this Release existing, so it is created right after the
      # images that make the tag real, not left as a separate manual step nobody remembers.
      # Generated notes are the FLOOR, not the ceiling: the owner can edit the Release's title
      # and body afterward on GitHub, and the next Pages deploy (release: published, or the next
      # web/site/** push) picks the edit up since the page is generated from the API each time,
      # never hand-copied.
      #
      # Idempotent by construction: `gh release create` fails outright if a Release already
      # exists for the tag, so re-running this job (a re-dispatch, a retried step) checks first
      # and no-ops rather than erroring or creating a duplicate.
      - name: Create the GitHub Release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $VERSION already exists -- idempotent no-op"
          else
            gh release create "$VERSION" --repo "${{ github.repository }}" --generate-notes
          fi
